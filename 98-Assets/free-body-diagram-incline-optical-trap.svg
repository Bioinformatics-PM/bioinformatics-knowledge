<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="776" height="396" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Free-body diagrams: every force acting on one object, then sum them</text>
  <!-- Panel A: incline -->
  <text x="195" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">(a) block on a frictionless incline</text>
  <polygon points="50,320 340,320 340,152.6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <path d="M90,320 A40,40 0 0 0 84.6,300" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="98" y="312" font-size="14" fill="#1f2937">θ</text>
  <rect x="-25" y="-25" width="50" height="50" rx="4" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5" transform="translate(187.5,211.75) rotate(-30)"/>
  <line x1="187.5" y1="211.75" x2="187.5" y2="291.75" stroke="#1f2937" stroke-width="2.5" marker-end="url(#fa)"/>
  <text x="196" y="290" font-size="14" fill="#1f2937">mg</text>
  <line x1="187.5" y1="211.75" x2="152.5" y2="151.1" stroke="#1f2937" stroke-width="2.5" marker-end="url(#fa)"/>
  <text x="128" y="148" font-size="14" fill="#1f2937">N</text>
  <line x1="187.5" y1="211.75" x2="135.5" y2="241.75" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#fa)"/>
  <text x="62" y="252" font-size="13" fill="#b45309">mg sin θ</text>
  <text x="195" y="350" text-anchor="middle" font-size="13" fill="#1f2937">Perpendicular to the slope: N = mg cos θ.</text>
  <text x="195" y="370" text-anchor="middle" font-size="13" fill="#1f2937">Along the slope: ma = mg sin θ.</text>
  <!-- divider -->
  <line x1="392" y1="56" x2="392" y2="380" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Panel B: optical trap -->
  <text x="585" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">(b) bead held by an optical trap</text>
  <rect x="420" y="296" width="330" height="16" rx="8" fill="#bbf7d0" stroke="#22c55e"/>
  <text x="585" y="332" text-anchor="middle" font-size="13" fill="#1f2937">microtubule</text>
  <line x1="540" y1="96" x2="540" y2="284" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="540" y="90" text-anchor="middle" font-size="13" fill="#6d28d9">trap center</text>
  <line x1="541" y1="122" x2="589" y2="122" stroke="#475569" stroke-width="1.5" marker-start="url(#fa)" marker-end="url(#fa)"/>
  <text x="565" y="116" text-anchor="middle" font-size="13" fill="#1f2937">x</text>
  <line x1="590" y1="230" x2="628" y2="286" stroke="#64748b" stroke-width="3"/>
  <circle cx="624" cy="290" r="6" fill="#fde68a" stroke="#d97706"/>
  <circle cx="638" cy="290" r="6" fill="#fde68a" stroke="#d97706"/>
  <text x="650" y="282" font-size="13" fill="#1f2937">kinesin</text>
  <circle cx="590" cy="190" r="40" fill="#fecdd3" stroke="#f43f5e" stroke-width="1.5"/>
  <line x1="590" y1="180" x2="700" y2="180" stroke="#1f2937" stroke-width="2.5" marker-end="url(#fa)"/>
  <text x="652" y="172" font-size="13" fill="#1f2937">F_motor</text>
  <line x1="590" y1="200" x2="480" y2="200" stroke="#1f2937" stroke-width="2.5" marker-end="url(#fa)"/>
  <text x="408" y="218" font-size="13" fill="#1f2937">F_trap = −κx</text>
  <text x="585" y="350" text-anchor="middle" font-size="13" fill="#1f2937">Weight ≈ 10⁻¹⁵ N: negligible next to pN forces.</text>
  <text x="585" y="370" text-anchor="middle" font-size="13" fill="#1f2937">At stall, a = 0: F_motor = κx.</text>
</svg>
