<title id="t">Free-energy profiles of SN2 and SN1 substitutions</title>
<desc id="d">Left: SN2, one step through a single transition state in which the nucleophile bonds while the leaving group departs; rate = k[R-LG][Nu]. Right: SN1, two steps: a slow ionization through the highest transition state to a carbocation intermediate, then fast capture by the nucleophile; rate = k[R-LG]. Schematic, not to scale.</desc>
<rect x="3" y="3" width="794" height="464" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="400" y="33" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">One step or two: free-energy profiles of SN2 and SN1</text>
<text x="400" y="54" text-anchor="middle" font-size="13" fill="#475569">Schematic, not to scale. ‡ marks a transition state; the highest one sets the rate.</text>
