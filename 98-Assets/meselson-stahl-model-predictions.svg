<text x="579" y="104" font-size="12" fill="#475569">light</text>
<text x="711" y="104" text-anchor="end" font-size="12" fill="#475569">heavy</text>
<text x="24" y="130" font-size="14" font-weight="bold" fill="#1f2937">Conservative</text>
<text x="24" y="148" font-size="12" fill="#b91c1c">excluded at gen 1</text>
