<text x="189" y="104" font-size="12" fill="#475569">light</text>
<text x="321" y="104" text-anchor="end" font-size="12" fill="#475569">heavy</text>
<text x="450" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Generation 1 (in 14N)</text>
<text x="384" y="104" font-size="12" fill="#475569">light</text>
<text x="516" y="104" text-anchor="end" font-size="12" fill="#475569">heavy</text>
