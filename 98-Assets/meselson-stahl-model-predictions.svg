<text x="380.0" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Deducing the CsCl bands predicted by three replication models</text>
<text x="380.0" y="54" text-anchor="middle" font-size="13" fill="#1f2937">Band position = fraction of 15N in a duplex (light 0, hybrid ½, heavy 1); label = share of the DNA</text>
