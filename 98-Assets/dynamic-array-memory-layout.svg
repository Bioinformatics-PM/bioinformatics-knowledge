<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="756" height="516" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Arrays in memory: addressing, doubling, references versus values</text>

  <!-- Panel A -->
  <text x="30" y="64" font-size="14" font-weight="bold" fill="#1f2937">A. Static array: element i sits at address a + b·i (here b = 8 bytes)</text>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <rect x="60" y="80" width="70" height="38" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="130" y="80" width="70" height="38" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="200" y="80" width="70" height="38" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="270" y="80" width="70" height="38" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="340" y="80" width="70" height="38" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="410" y="80" width="70" height="38" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="480" y="80" width="70" height="38" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="550" y="80" width="70" height="38" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="95" y="104">x[0]</text><text x="165" y="104">x[1]</text><text x="235" y="104">x[2]</text><text x="305" y="104">x[3]</text>
    <text x="375" y="104">x[4]</text><text x="445" y="104">x[5]</text><text x="515" y="104">x[6]</text><text x="585" y="104">x[7]</text>
    <text x="95" y="136" font-size="12">a</text><text x="165" y="136" font-size="12">a+8</text><text x="235" y="136" font-size="12">a+16</text><text x="305" y="136" font-size="12">a+24</text>
    <text x="375" y="136" font-size="12">a+32</text><text x="445" y="136" font-size="12">a+40</text><text x="515" y="136" font-size="12">a+48</text><text x="585" y="136" font-size="12">a+56</text>
  </g>
  <text x="632" y="96" font-size="13" fill="#1f2937">one block,</text>
  <text x="632" y="113" font-size="13" fill="#1f2937">no gaps</text>
  <text x="60" y="160" font-size="13" fill="#1f2937">get_at(3) reads address a + 3·8 = a + 24: one multiply-add, whatever the length, so O(1).</text>

  <!-- Panel B -->
  <text x="30" y="196" font-size="14" font-weight="bold" fill="#1f2937">B. Dynamic array: when full, allocate twice the capacity, copy, then append</text>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <rect x="60" y="210" width="70" height="34" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="130" y="210" width="70" height="34" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="200" y="210" width="70" height="34" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="270" y="210" width="70" height="34" fill="#dcfce7" stroke="#22c55e"/>
    <text x="95" y="232">x[0]</text><text x="165" y="232">x[1]</text><text x="235" y="232">x[2]</text><text x="305" y="232">x[3]</text>
    <rect x="60" y="292" width="70" height="34" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="130" y="292" width="70" height="34" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="200" y="292" width="70" height="34" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="270" y="292" width="70" height="34" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="340" y="292" width="70" height="34" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <rect x="410" y="292" width="70" height="34" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <rect x="480" y="292" width="70" height="34" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <rect x="550" y="292" width="70" height="34" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="95" y="314">x[0]</text><text x="165" y="314">x[1]</text><text x="235" y="314">x[2]</text><text x="305" y="314">x[3]</text>
    <text x="375" y="314">x[4]</text>
  </g>
  <text x="355" y="232" font-size="13" fill="#1f2937">full: n = capacity = 4; append(x[4]) arrives</text>
  <line x1="200" y1="246" x2="200" y2="288" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="212" y="272" font-size="13" fill="#1f2937">new block of capacity 8: copy 4 items (Θ(n)), write x[4], free the old block</text>
  <text x="632" y="306" font-size="13" fill="#1f2937">3 spare</text>
  <text x="632" y="322" font-size="13" fill="#1f2937">slots</text>
  <text x="60" y="348" font-size="13" fill="#1f2937">The next 3 appends cost O(1) each; over n appends the copies total less than 2n (amortized O(1)).</text>

  <!-- Panel C -->
  <text x="30" y="382" font-size="14" font-weight="bold" fill="#1f2937">C. A Python list stores references; array('d') stores the values themselves</text>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <rect x="60" y="394" width="50" height="34" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="110" y="394" width="50" height="34" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="160" y="394" width="50" height="34" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="210" y="394" width="50" height="34" fill="#dbeafe" stroke="#3b82f6"/>
    <circle cx="85" cy="411" r="4" fill="#1d4ed8"/><circle cx="135" cy="411" r="4" fill="#1d4ed8"/>
    <circle cx="185" cy="411" r="4" fill="#1d4ed8"/><circle cx="235" cy="411" r="4" fill="#1d4ed8"/>
    <rect x="40" y="458" width="76" height="30" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
    <rect x="132" y="478" width="76" height="30" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
    <rect x="226" y="452" width="76" height="30" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
    <rect x="318" y="476" width="76" height="30" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="78" y="478">1.0 (24 B)</text><text x="170" y="498">2.0 (24 B)</text><text x="264" y="472">3.0 (24 B)</text><text x="356" y="496">4.0 (24 B)</text>
    <rect x="440" y="394" width="70" height="34" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="510" y="394" width="70" height="34" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="580" y="394" width="70" height="34" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="650" y="394" width="70" height="34" fill="#dcfce7" stroke="#22c55e"/>
    <text x="475" y="416">1.0</text><text x="545" y="416">2.0</text><text x="615" y="416">3.0</text><text x="685" y="416">4.0</text>
  </g>
  <line x1="85" y1="415" x2="80" y2="455" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="135" y1="415" x2="166" y2="475" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="185" y1="415" x2="258" y2="449" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="235" y1="415" x2="348" y2="473" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="440" y="452" font-size="13" fill="#1f2937">array('d'): 8 B per value, one block</text>
  <text x="440" y="474" font-size="13" fill="#1f2937">list: 8 B reference + 24 B float object</text>
  <text x="440" y="496" font-size="13" fill="#1f2937">measured: 32.4 B versus 8.0 B per value</text>
</svg>
