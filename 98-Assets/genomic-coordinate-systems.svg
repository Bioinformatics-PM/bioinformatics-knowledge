<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="718" height="318" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Two ways to number the same bases</text>
  <!-- 1-based: numbers sit on the bases -->
  <text x="24" y="112" font-size="14" fill="#1f2937">1-based:</text>
  <text x="24" y="128" font-size="12" fill="#475569">count bases</text>
  <path d="M290 88 v-8 h140 v8" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="360" y="72" text-anchor="middle" font-size="13" fill="#92400e">[3, 4] closed: GFF, GTF, VCF, SAM, "chr:3-4"</text>
  <g font-size="14" fill="#1f2937" text-anchor="middle">
    <text x="185" y="112">1</text><text x="255" y="112">2</text><text x="325" y="112">3</text>
    <text x="395" y="112">4</text><text x="465" y="112">5</text><text x="535" y="112">6</text>
  </g>
  <!-- the sequence -->
  <g stroke="#64748b" stroke-width="1.5">
    <rect x="150" y="122" width="70" height="54" fill="#dbeafe"/>
    <rect x="220" y="122" width="70" height="54" fill="#dbeafe"/>
    <rect x="290" y="122" width="70" height="54" fill="#fde68a"/>
    <rect x="360" y="122" width="70" height="54" fill="#fde68a"/>
    <rect x="430" y="122" width="70" height="54" fill="#dbeafe"/>
    <rect x="500" y="122" width="70" height="54" fill="#dbeafe"/>
  </g>
  <g font-size="26" font-family="Courier New, monospace" font-weight="bold" fill="#1f2937" text-anchor="middle">
    <text x="185" y="158">A</text><text x="255" y="158">C</text><text x="325" y="158">T</text>
    <text x="395" y="158">G</text><text x="465" y="158">C</text><text x="535" y="158">G</text>
  </g>
  <!-- 0-based: numbers sit on the boundaries -->
  <g stroke="#475569" stroke-width="2">
    <line x1="150" y1="176" x2="150" y2="194"/><line x1="220" y1="176" x2="220" y2="194"/>
    <line x1="290" y1="176" x2="290" y2="194"/><line x1="360" y1="176" x2="360" y2="194"/>
    <line x1="430" y1="176" x2="430" y2="194"/><line x1="500" y1="176" x2="500" y2="194"/>
    <line x1="570" y1="176" x2="570" y2="194"/>
  </g>
  <g font-size="14" fill="#1f2937" text-anchor="middle">
    <text x="150" y="212">0</text><text x="220" y="212">1</text><text x="290" y="212">2</text>
    <text x="360" y="212">3</text><text x="430" y="212">4</text><text x="500" y="212">5</text>
    <text x="570" y="212">6</text>
  </g>
  <text x="24" y="208" font-size="14" fill="#1f2937">0-based:</text>
  <text x="24" y="224" font-size="12" fill="#475569">count boundaries</text>
  <path d="M290 226 v8 h140 v-8" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="360" y="254" text-anchor="middle" font-size="13" fill="#1e3a8a">[2, 4) half-open: BED, BAM, Python s[2:4]</text>
  <text x="360" y="290" text-anchor="middle" font-size="13" fill="#1f2937">Same bases "TG": the start differs by one, the end is identical; length = 4 - 2 = 4 - 3 + 1 = 2</text>
</svg>
