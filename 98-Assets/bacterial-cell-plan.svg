<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 486" width="820" height="486" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Plan of a bacterial cell</title>
<desc id="d">Schematic rod-shaped bacterium. From outside in: an optional polysaccharide capsule, a peptidoglycan cell wall, the plasma membrane and the cytoplasm. The chromosome is folded in the nucleoid, a region without a surrounding membrane. Small circular plasmids and many 70S ribosomes lie in the cytoplasm. Pili project from the surface and a flagellum extends from one pole. Archaea share the plan but have different membrane lipids and no peptidoglycan.</desc>
<rect x="1" y="1" width="818" height="484" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" font-weight="bold" fill="#1f2937">Plan of a bacterial cell (schematic, not to scale)</text>
<text x="24" y="56" font-size="13" fill="#374151">Typical prokaryotic size 0.1 to 5 µm. No nucleus and no membrane-bound organelles.</text>
