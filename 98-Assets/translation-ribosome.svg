<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Helvetica, Arial, sans-serif">
  <title>Translation elongation: the E, P and A sites of the ribosome</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="796" height="496" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Translation elongation: the E, P and A sites of the ribosome</text>

  <!-- large subunit -->
  <rect x="210" y="110" width="380" height="200" rx="80" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
  <text x="255" y="138" font-size="13" fill="#3730a3">large subunit</text>
  <!-- small subunit -->
  <rect x="220" y="326" width="360" height="92" rx="44" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <text x="400" y="404" text-anchor="middle" font-size="13" fill="#075985">small subunit</text>

  <!-- sites -->
  <g fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="267" y="150" width="86" height="158" rx="10"/>
    <rect x="357" y="150" width="86" height="158" rx="10"/>
    <rect x="447" y="150" width="86" height="158" rx="10"/>
  </g>
  <text x="283" y="172" text-anchor="middle" font-size="18" font-weight="bold" fill="#3730a3">E</text>
  <text x="373" y="172" text-anchor="middle" font-size="18" font-weight="bold" fill="#3730a3">P</text>
  <text x="463" y="172" text-anchor="middle" font-size="18" font-weight="bold" fill="#3730a3">A</text>

  <!-- tRNAs -->
  <rect x="284" y="186" width="52" height="84" rx="14" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <rect x="374" y="186" width="52" height="84" rx="14" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <rect x="464" y="186" width="52" height="84" rx="14" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="310" y="232" text-anchor="middle" font-size="12" fill="#1f2937">tRNA</text>
  <text x="400" y="232" text-anchor="middle" font-size="12" fill="#1f2937">tRNA</text>
  <text x="490" y="232" text-anchor="middle" font-size="12" fill="#1f2937">tRNA</text>

  <!-- anticodons (written 3' to 5' so they align with codons written 5' to 3') -->
  <g font-family="Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">
    <text x="310" y="295">UAC</text>
    <text x="400" y="295">CGU</text>
    <text x="490" y="295">AAG</text>
  </g>
  <g stroke="#64748b" stroke-width="2">
    <line x1="296" y1="302" x2="296" y2="314"/><line x1="310" y1="302" x2="310" y2="314"/><line x1="324" y1="302" x2="324" y2="314"/>
    <line x1="386" y1="302" x2="386" y2="314"/><line x1="400" y1="302" x2="400" y2="314"/><line x1="414" y1="302" x2="414" y2="314"/>
    <line x1="476" y1="302" x2="476" y2="314"/><line x1="490" y1="302" x2="490" y2="314"/><line x1="504" y1="302" x2="504" y2="314"/>
  </g>

  <!-- mRNA -->
  <line x1="40" y1="318" x2="760" y2="318" stroke="#f97316" stroke-width="5"/>
  <text x="22" y="323" font-size="14" font-weight="bold" fill="#c2410c">5'</text>
  <text x="766" y="323" font-size="14" font-weight="bold" fill="#c2410c">3'</text>
  <g font-family="Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">
    <text x="150" y="344">. . . C C</text>
    <text x="310" y="344">AUG</text>
    <text x="400" y="344">GCA</text>
    <text x="490" y="344">UUC</text>
    <text x="620" y="344">GAA</text>
    <text x="700" y="344">UAA</text>
  </g>
  <text x="700" y="362" text-anchor="middle" font-size="12" fill="#b91c1c">stop</text>
  <text x="150" y="362" text-anchor="middle" font-size="12" fill="#475569">5' UTR</text>
  <text x="70" y="306" font-size="13" fill="#9a3412">mRNA</text>

  <!-- amino acids and growing chain -->
  <line x1="400" y1="186" x2="400" y2="160" stroke="#64748b" stroke-width="2"/>
  <line x1="490" y1="186" x2="490" y2="160" stroke="#64748b" stroke-width="2"/>
  <line x1="400" y1="120" x2="382" y2="84" stroke="#64748b" stroke-width="3"/>
  <circle cx="400" cy="138" r="20" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="378" cy="76" r="20" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="490" cy="138" r="20" fill="#fdba74" stroke="#c2410c" stroke-width="2"/>
  <text x="400" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">Ala</text>
  <text x="378" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">Met</text>
  <text x="490" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">Phe</text>

  <!-- side labels -->
  <text x="196" y="200" text-anchor="end" font-size="13" fill="#1f2937">E site: empty tRNA</text>
  <text x="196" y="218" text-anchor="end" font-size="13" fill="#1f2937">leaves the ribosome</text>
  <line x1="200" y1="210" x2="282" y2="222" stroke="#475569" stroke-width="1.5"/>
  <text x="604" y="200" font-size="13" fill="#1f2937">A site: aminoacyl-tRNA</text>
  <text x="604" y="218" font-size="13" fill="#1f2937">pairs with the next codon</text>
  <line x1="600" y1="210" x2="518" y2="222" stroke="#475569" stroke-width="1.5"/>
  <text x="604" y="84" font-size="13" fill="#1f2937">P site: peptidyl-tRNA holds</text>
  <text x="604" y="100" font-size="13" fill="#1f2937">the growing chain (Met-Ala),</text>
  <text x="604" y="116" font-size="13" fill="#1f2937">N-terminus first</text>
  <line x1="600" y1="96" x2="418" y2="126" stroke="#475569" stroke-width="1.5"/>

  <!-- movement -->
  <line x1="320" y1="444" x2="480" y2="444" stroke="#475569" stroke-width="3" marker-end="url(#arr)"/>
  <text x="400" y="430" text-anchor="middle" font-size="13" fill="#1f2937">ribosome moves 5' to 3', one codon per cycle</text>

  <text x="400" y="472" text-anchor="middle" font-size="12" fill="#475569">Anticodons are written 3' to 5' so that each pairs antiparallel with its codon (5'-AUG-3' with 3'-UAC-5').</text>
  <text x="400" y="489" text-anchor="middle" font-size="12" fill="#475569">Subunits: 50S + 30S (70S ribosome) in bacteria, 60S + 40S (80S ribosome) in eukaryotes. Schematic, not to scale.</text>
</svg>
