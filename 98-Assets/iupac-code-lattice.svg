  <rect x="573" y="368" width="74" height="44" rx="9" fill="#dbeafe" stroke="#64748b" stroke-width="1.2"/>
  <text x="610" y="388" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">T</text>
  <text x="610" y="405" text-anchor="middle" font-size="12" fill="#1f2937">T</text>
  <text x="758" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">|S| = 1</text>
  <text x="758" y="404" text-anchor="middle" font-size="12" fill="#1f2937">2 bits</text>
  <text x="400" y="448" text-anchor="middle" font-size="12" fill="#1f2937">A line joins a code to each code that adds exactly one base. Going up loses information: log2(4/|S|) bits per symbol.</text>
  <text x="400" y="468" text-anchor="middle" font-size="12" fill="#1f2937">Complement swaps A with T and C with G: R and Y, K and M, B and V, D and H swap; S, W and N are their own complements.</text>
