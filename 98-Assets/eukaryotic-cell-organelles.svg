<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">An animal cell and its main organelles</title>
<desc id="d">Schematic animal cell. The nucleus, bounded by a double envelope with pores, contains a nucleolus. Rough endoplasmic reticulum studded with ribosomes wraps around the nucleus and continues into tubular smooth endoplasmic reticulum. A Golgi stack with transport vesicles lies near the nucleus. Mitochondria, a lysosome and a peroxisome sit in the cytosol, with free ribosomes and microtubules radiating from the centrosome. The plasma membrane bounds the cell. Plant cells add a cell wall, chloroplasts and a large central vacuole.</desc>
<rect x="1" y="1" width="958" height="578" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" font-weight="bold" fill="#1f2937">An animal cell and its main organelles (schematic, not to scale)</text>
<text x="24" y="56" font-size="13" fill="#374151">Eukaryotic cells are typically 10 to 100 µm across; organelles are drawn enlarged and few.</text>
