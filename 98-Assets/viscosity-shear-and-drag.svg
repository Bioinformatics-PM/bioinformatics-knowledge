  <text x="689.2" y="215" text-anchor="middle" font-size="13" fill="#b45309">force off</text>
  <text x="482.0" y="190" font-size="13" fill="#1d4ed8">velocity v(t)</text>
  <text x="432" y="135" text-anchor="end" font-size="13" fill="#1f2937">v_t</text>
