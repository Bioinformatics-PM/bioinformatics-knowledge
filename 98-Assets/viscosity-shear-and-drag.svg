  <text x="720" y="270" text-anchor="middle" font-size="13" fill="#1f2937">10</text>
  <text x="580" y="290" text-anchor="middle" font-size="13" fill="#1f2937">time, in units of τ = m/γ</text>
  <text x="580" y="314" text-anchor="middle" font-size="13" fill="#1f2937">v rises and decays with the same time constant τ.</text>
  <text x="580" y="334" text-anchor="middle" font-size="13" fill="#1f2937">Protein in water: τ ≈ 1 ps, so velocity follows force.</text>
</svg>
