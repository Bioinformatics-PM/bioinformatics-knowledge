  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="756" height="356" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Viscosity: shearing a fluid takes force, and drag erases unpushed motion</text>
  <!-- Panel A -->
  <text x="200" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">(a) fluid sheared between two plates</text>
  <line x1="150" y1="80" x2="250" y2="80" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ak)"/>
  <text x="258" y="85" font-size="14" fill="#1f2937">F, plate moves at v</text>
  <rect x="60" y="90" width="280" height="14" rx="3" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="60" y="104" width="280" height="142" fill="#e0f2fe"/>
  <rect x="60" y="246" width="280" height="14" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <line x1="90" y1="104" x2="90" y2="246" stroke="#64748b" stroke-width="1"/>
  <line x1="90" y1="114" x2="201.5" y2="114" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><line x1="90" y1="140" x2="179.6" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><line x1="90" y1="166" x2="157.6" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><line x1="90" y1="192" x2="135.6" y2="192" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><line x1="90" y1="218" x2="113.7" y2="218" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="90" y1="246" x2="210" y2="104" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="222" y="150" font-size="13" fill="#b45309">linear velocity</text>
  <text x="222" y="166" font-size="13" fill="#b45309">profile, slope v/L</text>
  <line x1="42" y1="106" x2="42" y2="244" stroke="#1f2937" stroke-width="1.5" marker-start="url(#ak)" marker-end="url(#ak)"/>
  <text x="30" y="180" font-size="14" fill="#1f2937">L</text>
  <text x="200" y="280" text-anchor="middle" font-size="13" fill="#1f2937">fixed plate; plate area A</text>
  <text x="200" y="310" text-anchor="middle" font-size="15" fill="#1f2937">F = η v A / L</text>
  <text x="200" y="334" text-anchor="middle" font-size="13" fill="#1f2937">No slip: the fluid touching a plate moves with it.</text>
  <line x1="392" y1="52" x2="392" y2="344" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Panel B -->
  <text x="580" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">(b) a pushed particle with linear drag</text>
