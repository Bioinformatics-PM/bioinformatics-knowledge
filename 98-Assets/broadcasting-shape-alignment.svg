<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="758" height="478" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Broadcasting: align shapes from the right, stretch length-1 axes</text>

  <!-- Panel A -->
  <text x="24" y="64" font-size="14" font-weight="bold" fill="#1f2937">A. Scale each sample: counts / lib  (genes x samples divided by one total per sample)</text>
  <!-- counts grid 4 x 6 -->
  <g stroke="#64748b" stroke-width="1" fill="#dbeafe">
    <rect x="40" y="86" width="156" height="80"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="66" y1="86" x2="66" y2="166"/><line x1="92" y1="86" x2="92" y2="166"/><line x1="118" y1="86" x2="118" y2="166"/>
    <line x1="144" y1="86" x2="144" y2="166"/><line x1="170" y1="86" x2="170" y2="166"/>
    <line x1="40" y1="106" x2="196" y2="106"/><line x1="40" y1="126" x2="196" y2="126"/><line x1="40" y1="146" x2="196" y2="146"/>
  </g>
  <text x="118" y="186" text-anchor="middle" font-size="13" fill="#1f2937">counts, shape (4, 6)</text>
  <text x="218" y="132" text-anchor="middle" font-size="22" fill="#1f2937">÷</text>

  <!-- lib: one real row, three virtual rows -->
  <rect x="240" y="86" width="156" height="20" fill="#fed7aa" stroke="#64748b" stroke-width="1"/>
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="266" y1="86" x2="266" y2="106"/><line x1="292" y1="86" x2="292" y2="106"/><line x1="318" y1="86" x2="318" y2="106"/>
    <line x1="344" y1="86" x2="344" y2="106"/><line x1="370" y1="86" x2="370" y2="106"/>
  </g>
  <g fill="#fff7ed" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 3">
    <rect x="240" y="106" width="156" height="20"/>
    <rect x="240" y="126" width="156" height="20"/>
    <rect x="240" y="146" width="156" height="20"/>
  </g>
  <text x="318" y="121" text-anchor="middle" font-size="12" fill="#92400e">same row, not copied</text>
  <text x="318" y="161" text-anchor="middle" font-size="12" fill="#92400e">(stride 0)</text>
  <text x="318" y="186" text-anchor="middle" font-size="13" fill="#1f2937">lib, shape (6,) seen as (1, 6)</text>
  <text x="418" y="132" text-anchor="middle" font-size="22" fill="#1f2937">=</text>

  <!-- result grid -->
  <rect x="440" y="86" width="156" height="80" fill="#dcfce7" stroke="#64748b" stroke-width="1"/>
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="466" y1="86" x2="466" y2="166"/><line x1="492" y1="86" x2="492" y2="166"/><line x1="518" y1="86" x2="518" y2="166"/>
    <line x1="544" y1="86" x2="544" y2="166"/><line x1="570" y1="86" x2="570" y2="166"/>
    <line x1="440" y1="106" x2="596" y2="106"/><line x1="440" y1="126" x2="596" y2="126"/><line x1="440" y1="146" x2="596" y2="146"/>
  </g>
  <text x="518" y="186" text-anchor="middle" font-size="13" fill="#1f2937">result, shape (4, 6)</text>

  <!-- shape table -->
  <g font-family="Courier New, monospace" font-size="14" fill="#1f2937">
    <text x="40" y="222">counts</text><text x="130" y="222">4</text><text x="160" y="222">6</text>
    <text x="40" y="242">lib</text><text x="130" y="242">1</text><text x="160" y="242">6</text>
    <text x="40" y="262">result</text><text x="130" y="262">4</text><text x="160" y="262">6</text>
  </g>
  <g font-size="13" fill="#1f2937">
    <text x="200" y="242">missing leading axis padded with length 1</text>
    <text x="200" y="262">each axis: equal lengths, or one of them is 1; result takes the larger</text>
  </g>
  <line x1="24" y1="284" x2="736" y2="284" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Panel B -->
  <text x="24" y="310" font-size="14" font-weight="bold" fill="#1f2937">B. All pairs: X[:, None, :] - Y[None, :, :], then sum of squares over the last axis</text>
  <!-- X: 3 vectors along axis 0 -->
  <g stroke="#64748b" stroke-width="1" fill="#dbeafe">
    <rect x="40" y="330" width="48" height="14"/><rect x="40" y="356" width="48" height="14"/><rect x="40" y="382" width="48" height="14"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="52" y1="330" x2="52" y2="396"/><line x1="64" y1="330" x2="64" y2="396"/><line x1="76" y1="330" x2="76" y2="396"/>
  </g>
  <text x="64" y="420" text-anchor="middle" font-size="13" fill="#1f2937">(3, 1, 4)</text>
  <text x="112" y="368" text-anchor="middle" font-size="22" fill="#1f2937">-</text>
  <!-- Y: 3 vectors along axis 1 -->
  <g stroke="#64748b" stroke-width="1" fill="#fed7aa">
    <rect x="132" y="356" width="48" height="14"/><rect x="188" y="356" width="48" height="14"/><rect x="244" y="356" width="48" height="14"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="144" y1="356" x2="144" y2="370"/><line x1="156" y1="356" x2="156" y2="370"/><line x1="168" y1="356" x2="168" y2="370"/>
    <line x1="200" y1="356" x2="200" y2="370"/><line x1="212" y1="356" x2="212" y2="370"/><line x1="224" y1="356" x2="224" y2="370"/>
    <line x1="256" y1="356" x2="256" y2="370"/><line x1="268" y1="356" x2="268" y2="370"/><line x1="280" y1="356" x2="280" y2="370"/>
  </g>
  <text x="212" y="420" text-anchor="middle" font-size="13" fill="#1f2937">(1, 3, 4)</text>
  <text x="318" y="368" text-anchor="middle" font-size="22" fill="#1f2937">=</text>
  <!-- differences: 3 x 3 vectors -->
  <g stroke="#64748b" stroke-width="1" fill="#ede9fe">
    <rect x="340" y="330" width="48" height="14"/><rect x="396" y="330" width="48" height="14"/><rect x="452" y="330" width="48" height="14"/>
    <rect x="340" y="356" width="48" height="14"/><rect x="396" y="356" width="48" height="14"/><rect x="452" y="356" width="48" height="14"/>
    <rect x="340" y="382" width="48" height="14"/><rect x="396" y="382" width="48" height="14"/><rect x="452" y="382" width="48" height="14"/>
  </g>
  <g stroke="#a5b4fc" stroke-width="1">
    <line x1="352" y1="330" x2="352" y2="396"/><line x1="364" y1="330" x2="364" y2="396"/><line x1="376" y1="330" x2="376" y2="396"/>
    <line x1="408" y1="330" x2="408" y2="396"/><line x1="420" y1="330" x2="420" y2="396"/><line x1="432" y1="330" x2="432" y2="396"/>
    <line x1="464" y1="330" x2="464" y2="396"/><line x1="476" y1="330" x2="476" y2="396"/><line x1="488" y1="330" x2="488" y2="396"/>
  </g>
  <text x="420" y="420" text-anchor="middle" font-size="13" fill="#1f2937">(3, 3, 4): x_i - y_j</text>
  <!-- arrow -->
  <line x1="512" y1="363" x2="590" y2="363" stroke="#475569" stroke-width="2"/>
  <polygon points="590,357 602,363 590,369" fill="#475569"/>
  <text x="556" y="352" text-anchor="middle" font-size="12" fill="#1f2937">square, sum</text>
  <text x="556" y="386" text-anchor="middle" font-size="12" fill="#1f2937">over axis -1, sqrt</text>
  <!-- distance matrix 3 x 3 -->
  <rect x="614" y="330" width="96" height="66" fill="#dcfce7" stroke="#64748b" stroke-width="1"/>
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="646" y1="330" x2="646" y2="396"/><line x1="678" y1="330" x2="678" y2="396"/>
    <line x1="614" y1="352" x2="710" y2="352"/><line x1="614" y1="374" x2="710" y2="374"/>
  </g>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="630" y="345">0</text><text x="662" y="367">0</text><text x="694" y="389">0</text>
  </g>
  <text x="662" y="420" text-anchor="middle" font-size="13" fill="#1f2937">D, shape (3, 3)</text>
  <text x="380" y="458" text-anchor="middle" font-size="13" fill="#1f2937">Memory: the stretched inputs cost nothing, but the (n, m, d) difference array is materialized.</text>
</svg>
