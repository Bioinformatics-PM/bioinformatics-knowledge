<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="hk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="ho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="756" height="406" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Resolving collisions: chaining versus linear probing</text>
  <text x="380" y="52" text-anchor="middle" font-size="13" fill="#1f2937">Toy hash values: h(ATG) = 3, h(TGG) = 6, h(AAA) = 3, h(GCC) = 1, h(TAA) = 6; inserted in this order; m = 8 slots</text>

  <!-- Panel A: chaining -->
  <text x="30" y="82" font-size="14" font-weight="bold" fill="#1f2937">A. Chaining: each slot holds a list</text>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="48" y="114">0</text><text x="48" y="144">1</text><text x="48" y="174">2</text><text x="48" y="204">3</text>
    <text x="48" y="234">4</text><text x="48" y="264">5</text><text x="48" y="294">6</text><text x="48" y="324">7</text>
  </g>
  <g fill="#e2e8f0" stroke="#64748b">
    <rect x="60" y="95" width="44" height="30"/><rect x="60" y="125" width="44" height="30"/><rect x="60" y="155" width="44" height="30"/><rect x="60" y="185" width="44" height="30"/>
    <rect x="60" y="215" width="44" height="30"/><rect x="60" y="245" width="44" height="30"/><rect x="60" y="275" width="44" height="30"/><rect x="60" y="305" width="44" height="30"/>
  </g>
  <g fill="#1d4ed8"><circle cx="82" cy="140" r="4"/><circle cx="82" cy="200" r="4"/><circle cx="82" cy="290" r="4"/></g>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <rect x="140" y="127" width="60" height="26" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="170" y="145">GCC</text>
    <rect x="140" y="187" width="60" height="26" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="170" y="205">ATG</text>
    <rect x="236" y="187" width="60" height="26" rx="6" fill="#fde68a" stroke="#d97706"/><text x="266" y="205">AAA</text>
    <rect x="140" y="277" width="60" height="26" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="170" y="295">TGG</text>
    <rect x="236" y="277" width="60" height="26" rx="6" fill="#fde68a" stroke="#d97706"/><text x="266" y="295">TAA</text>
  </g>
  <g stroke="#475569" stroke-width="1.5">
    <line x1="86" y1="140" x2="137" y2="140" marker-end="url(#hk)"/>
    <line x1="86" y1="200" x2="137" y2="200" marker-end="url(#hk)"/>
    <line x1="200" y1="200" x2="233" y2="200" marker-end="url(#hk)"/>
    <line x1="86" y1="290" x2="137" y2="290" marker-end="url(#hk)"/>
    <line x1="200" y1="290" x2="233" y2="290" marker-end="url(#hk)"/>
  </g>
  <text x="30" y="362" font-size="13" fill="#1f2937">Search AAA: hash to slot 3, walk its list (ATG, then AAA).</text>
  <text x="30" y="382" font-size="13" fill="#1f2937">Expected list length: the load factor n/m = 5/8.</text>

  <!-- Panel B: linear probing -->
  <text x="400" y="82" font-size="14" font-weight="bold" fill="#1f2937">B. Linear probing: one array, try the next slot</text>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="418" y="114">0</text><text x="418" y="144">1</text><text x="418" y="174">2</text><text x="418" y="204">3</text>
    <text x="418" y="234">4</text><text x="418" y="264">5</text><text x="418" y="294">6</text><text x="418" y="324">7</text>
    <rect x="430" y="95" width="80" height="30" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <rect x="430" y="125" width="80" height="30" fill="#dbeafe" stroke="#3b82f6"/><text x="470" y="145">GCC</text>
    <rect x="430" y="155" width="80" height="30" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <rect x="430" y="185" width="80" height="30" fill="#dbeafe" stroke="#3b82f6"/><text x="470" y="205">ATG</text>
    <rect x="430" y="215" width="80" height="30" fill="#fde68a" stroke="#d97706"/><text x="470" y="235">AAA</text>
    <rect x="430" y="245" width="80" height="30" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <rect x="430" y="275" width="80" height="30" fill="#dbeafe" stroke="#3b82f6"/><text x="470" y="295">TGG</text>
    <rect x="430" y="305" width="80" height="30" fill="#fde68a" stroke="#d97706"/><text x="470" y="325">TAA</text>
  </g>
  <path d="M 512 200 C 540 205, 540 225, 513 230" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ho)"/>
  <path d="M 512 290 C 540 295, 540 315, 513 320" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ho)"/>
  <text x="548" y="219" font-size="12" fill="#1f2937">AAA: slot 3 taken,</text>
  <text x="548" y="235" font-size="12" fill="#1f2937">stored in slot 4</text>
  <text x="548" y="309" font-size="12" fill="#1f2937">TAA: slot 6 taken,</text>
  <text x="548" y="325" font-size="12" fill="#1f2937">stored in slot 7</text>
  <text x="400" y="362" font-size="13" fill="#1f2937">Search AAA: probe 3 (ATG), then 4 (AAA): found.</text>
  <text x="400" y="382" font-size="13" fill="#1f2937">Deleting ATG must leave a tombstone in slot 3,</text>
  <text x="400" y="400" font-size="13" fill="#1f2937">or the search for AAA would stop there.</text>
</svg>
