<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Helvetica, Arial, sans-serif">
  <rect x="2" y="2" width="716" height="416" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">A probability space for random 8-mers (areas not to scale)</text>

  <!-- Sample space -->
  <rect x="28" y="52" width="444" height="344" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="42" y="74" font-size="14" font-weight="bold" fill="#1f2937">Ω = {A, C, G, T}⁸</text>
  <text x="42" y="92" font-size="13" fill="#1f2937">65,536 equally likely outcomes</text>

  <!-- Event E: contains CG -->
  <circle cx="255" cy="235" r="122" fill="#fde68a" fill-opacity="0.7" stroke="#d97706" stroke-width="2"/>
  <text x="255" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">E</text>
  <text x="255" y="336" text-anchor="middle" font-size="13" fill="#1f2937">contains CG</text>

  <!-- Event B: within one mismatch of the site -->
  <circle cx="178" cy="168" r="50" fill="#bbf7d0" fill-opacity="0.85" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="150" font-size="14" font-weight="bold" fill="#1f2937">B</text>
  <!-- Event A: exact match, inside B and E -->
  <circle cx="195" cy="185" r="13" fill="#86efac" stroke="#15803d" stroke-width="2"/>
  <text x="195" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">A</text>

  <!-- Event C: within one mismatch of the reverse complement -->
  <circle cx="338" cy="152" r="50" fill="#bfdbfe" fill-opacity="0.85" stroke="#2563eb" stroke-width="2"/>
  <text x="338" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">C</text>

  <!-- Complement label -->
  <text x="42" y="382" font-size="13" fill="#1f2937">Eᶜ: no CG (40,545 outcomes)</text>

  <!-- Legend -->
  <g font-size="13" fill="#1f2937">
    <text x="490" y="74" font-weight="bold" font-size="14">Events (subsets of Ω)</text>
    <text x="490" y="100">A: equals the site ACGTTGCA</text>
    <text x="506" y="117">(invented): 1 outcome</text>
    <text x="490" y="143">B: at most 1 mismatch to</text>
    <text x="506" y="160">the site: 1 + 8 × 3 = 25</text>
    <text x="490" y="186">C: at most 1 mismatch to</text>
    <text x="506" y="203">TGCAACGT (reverse</text>
    <text x="506" y="220">complement): 25</text>
    <text x="490" y="246">E: contains CG: 24,991</text>
    <text x="490" y="280" font-weight="bold" font-size="14">Relations</text>
    <text x="490" y="304">A is a subset of B: P(A) ≤ P(B)</text>
    <text x="490" y="324">B and C are disjoint:</text>
    <text x="506" y="341">P(B or C) = 50 / 65,536</text>
    <text x="490" y="365">19 of the 25 outcomes of B</text>
    <text x="506" y="382">lie in E (B ∩ E)</text>
  </g>
</svg>
