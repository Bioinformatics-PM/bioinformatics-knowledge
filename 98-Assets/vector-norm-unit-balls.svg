<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="400" rx="16" fill="#f8fafc"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Unit balls in the plane: every v with ‖v‖ ≤ 1, for three norms</text>

  <!-- center (190,210), 130 px per unit -->
  <rect x="60" y="80" width="260" height="260" fill="#fef3c7" fill-opacity="0.6" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="190" cy="210" r="130" fill="#d1fae5" fill-opacity="0.7" stroke="#059669" stroke-width="2.5"/>
  <polygon points="320,210 190,80 60,210 190,340" fill="#dbeafe" fill-opacity="0.8" stroke="#2563eb" stroke-width="2.5"/>
  <g stroke="#64748b" stroke-width="1.2">
    <line x1="40" y1="210" x2="340" y2="210"/><line x1="190" y1="60" x2="190" y2="360"/>
  </g>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="326" y="228">1</text><text x="54" y="228">−1</text><text x="202" y="76">1</text><text x="206" y="356">−1</text>
  </g>
  <line x1="190" y1="210" x2="268" y2="106" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="268" cy="106" r="5" fill="#7c3aed"/>
  <text x="268" y="70" font-size="13" fill="#7c3aed" font-weight="bold" text-anchor="middle">v = (0.6, 0.8)</text>

  <rect x="372" y="88" width="16" height="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="396" y="101" font-size="14" fill="#1f2937">L1: |v₁| + |v₂| ≤ 1 (diamond)</text>
  <rect x="372" y="118" width="16" height="16" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="396" y="131" font-size="14" fill="#1f2937">L2: √(v₁² + v₂²) ≤ 1 (disc)</text>
  <rect x="372" y="148" width="16" height="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="396" y="161" font-size="14" fill="#1f2937">L∞: max(|v₁|, |v₂|) ≤ 1 (square)</text>
  <g font-size="14" fill="#1f2937">
    <text x="372" y="204">For v = (0.6, 0.8):</text>
    <text x="372" y="226">‖v‖₁ = 1.4, ‖v‖₂ = 1, ‖v‖∞ = 0.8</text>
    <text x="372" y="262">Nested: diamond inside disc inside square,</text>
    <text x="372" y="284">because ‖v‖∞ ≤ ‖v‖₂ ≤ ‖v‖₁.</text>
    <text x="372" y="320">The L1 ball has its corners on the axes,</text>
    <text x="372" y="342">where one coordinate is exactly 0: the</text>
    <text x="372" y="364">geometric reason the lasso gives zeros.</text>
  </g>
</svg>
