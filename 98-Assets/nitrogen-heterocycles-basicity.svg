<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Nitrogen heterocycles of biology and the basicity of their nitrogens</title>
<desc id="d">Six aromatic rings with their numbered nitrogens. Pyridine-like nitrogens (blue) keep their lone pair in the ring plane and are basic hydrogen-bond acceptors; pyrrole-like N-H nitrogens (orange) put their lone pair in the aromatic pi system and are not basic but donate hydrogen bonds. pKa values of the protonated rings: pyrrole 0.4, pyrimidine 1.3, pyridine 5.25, imidazole 6.95. Biological examples: NAD+ (pyridine), C, T and U (pyrimidine), heme (pyrrole), histidine (imidazole), tryptophan (indole), adenine and guanine (purine).</desc>
<rect x="3" y="3" width="794" height="594" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="400" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Nitrogen heterocycles of biology: which nitrogen is basic?</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="#475569">Carbons and their H atoms are implicit; circles mark aromatic rings; pKa of the protonated ring from OpenStax Organic Chemistry, sec. 24.3.</text>
