<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Helvetica, Arial, sans-serif">
  <title>Folding energy landscape drawn as a rugged funnel</title>
  <rect x="2" y="2" width="796" height="466" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Folding energy landscape: a rugged funnel (schematic)</text>

  <!-- free energy axis -->
  <line x1="45" y1="95" x2="45" y2="380" stroke="#475569" stroke-width="2"/>
  <polygon points="39,380 45,394 51,380" fill="#475569"/>
  <text x="30" y="250" font-size="13" fill="#1f2937" transform="rotate(-90 30 250)" text-anchor="middle">free energy</text>
  <text x="52" y="100" font-size="12" fill="#1f2937">high</text>
  <text x="52" y="378" font-size="12" fill="#1f2937">low</text>

  <!-- width = number of conformations -->
  <line x1="140" y1="72" x2="660" y2="72" stroke="#475569" stroke-width="1.5"/>
  <polygon points="140,72 152,66 152,78" fill="#475569"/>
  <polygon points="660,72 648,66 648,78" fill="#475569"/>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#1f2937">width: number of conformations (conformational entropy)</text>
  <text x="400" y="100" text-anchor="middle" font-size="13" fill="#1f2937">unfolded ensemble: many conformations</text>

  <!-- landscape -->
  <polyline points="130,105.1 133,109.7 136,110.2 139,108.6 142,108.3 145,111.4 148,117.3 151,124.0 154,128.8 157,131.2 160,132.7 163,135.9 166,142.8 169,153.0 172,164.2 175,173.3 178,178.8 181,181.5 184,183.8 187,187.7 190,193.7 193,200.2 196,204.9 199,206.4 202,205.3 205,204.2 208,205.6 211,210.4 214,217.7 217,225.0 220,230.6 223,234.3 226,237.8 229,243.1 232,251.3 235,261.5 238,271.3 241,278.5 244,282.6 247,284.6 250,286.5 253,289.8 256,294.2 259,298.0 262,299.7 265,298.9 268,296.8 271,295.8 274,297.7 277,302.6 280,309.0 283,314.9 286,318.9 289,321.3 292,323.5 295,327.1 298,332.2 301,337.8 304,342.1 307,343.9 310,343.6 313,342.6 316,342.8 319,345.1 322,348.9 325,352.7 328,355.4 331,356.8 334,357.9 337,360.2 340,364.4 343,370.1 346,375.7 349,379.8 352,381.8 355,382.4 358,383.1 361,384.7 364,387.3 367,389.8 370,391.2 373,391.0 376,389.8 379,389.0 382,389.5 385,391.7 388,394.6 391,397.1 394,398.5 397,398.8 400,398.8 403,399.0 406,399.9 409,401.4 412,402.1 415,401.2 418,398.5 421,394.9 424,391.5 427,389.3 430,388.0 433,386.7 436,384.2 439,380.5 442,376.2 445,372.9 448,371.4 451,371.8 454,372.6 457,372.6 460,370.8 463,367.6 466,364.4 469,362.3 472,361.4 475,360.6 478,358.4 481,353.8 484,347.4 487,340.7 490,335.5 493,332.5 496,330.9 499,329.1 502,325.9 505,321.4 508,316.8 511,314.0 514,313.6 517,315.1 520,316.5 523,316.4 526,314.8 529,313.0 532,313.0 535,315.7 538,319.8 541,322.4 544,320.4 547,312.5 550,300.3 553,286.9 556,275.5 559,267.5 562,262.0 565,257.3 568,251.7 571,245.5 574,240.1 577,237.1 580,236.5 583,236.6 586,234.9 589,229.7 592,221.2 595,211.8 598,203.9 601,198.7 604,195.3 607,191.6 610,185.7 613,177.8 616,169.6 619,163.9 622,162.0 625,163.0 628,164.3 631,163.1 634,158.5 637,151.8 640,145.5 643,141.4 646,139.3 649,136.8 652,131.5 655,122.1 658,110.3 661,99.2 664,91.3 667,87.4 670,85.6" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- chains on the landscape -->
  <g fill="#fbbf24" stroke="#92400e" stroke-width="1.5">
    <circle cx="160" cy="123.7" r="8"/> <circle cx="640" cy="136.5" r="8"/> <circle cx="255" cy="282.7" r="8"/> <circle cx="545" cy="308.4" r="8"/>
  </g>
  <circle cx="412" cy="392.1" r="9" fill="#34d399" stroke="#065f46" stroke-width="1.5"/>

  <!-- folding routes -->
  <g fill="none" stroke="#db2777" stroke-width="2" stroke-dasharray="6 4">
    <path d="M 170 134.8 Q 210 180.3 248 262.5"/>
    <path d="M 268 272.8 Q 330 311.4 395 376.7"/>
    <path d="M 630 141.8 Q 600 187.1 556 253.5"/>
    <path d="M 536 291.1 Q 500 291.9 430 364.0"/>
  </g>
  <g fill="#db2777">
    <polygon points="248,262.5 236,253.5 238,267.5"/>
    <polygon points="395,376.7 383,367.7 384,381.7"/>
    <polygon points="556,253.5 568,245.5 567,259.5"/>
    <polygon points="430,364.0 441,355.0 443,369.0"/>
  </g>

  <!-- labels -->
  <text x="282" y="262" font-size="12" fill="#1f2937">partly folded</text>
  <text x="282" y="277" font-size="12" fill="#1f2937">intermediate</text>
  <text x="470" y="250" font-size="12" fill="#1f2937">climb out,</text>
  <text x="470" y="265" font-size="12" fill="#1f2937">then down</text>
  <line x1="545" y1="322.4" x2="580" y2="350" stroke="#475569" stroke-width="1"/>
  <text x="585" y="355" font-size="12" fill="#1f2937">kinetic trap: misfolded,</text>
  <text x="585" y="370" font-size="12" fill="#1f2937">must partly unfold to escape</text>
  <text x="412" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">native state</text>
  <text x="412" y="447" text-anchor="middle" font-size="12" fill="#1f2937">lowest free energy</text>

  <!-- side notes -->
  <text x="70" y="405" font-size="12" fill="#1f2937">Levinthal's random search:</text>
  <text x="70" y="421" font-size="12" fill="#1f2937">3¹⁰⁰ ≈ 5 × 10⁴⁷ conformations,</text>
  <text x="70" y="437" font-size="12" fill="#1f2937">at 10⁻¹³ s each ≈ 1.6 × 10²⁷ years</text>
  <text x="585" y="405" font-size="12" fill="#1f2937">Down the slope, partly</text>
  <text x="585" y="421" font-size="12" fill="#1f2937">correct structure is kept</text>
  <text x="585" y="437" font-size="12" fill="#1f2937">(cumulative selection)</text>
</svg>
