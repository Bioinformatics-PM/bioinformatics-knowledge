<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="390" rx="16" fill="#f8fafc"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Vectors as arrows: addition (left) and the dot product (right)</text>
  <text x="60" y="58" font-size="14" fill="#1f2937">Addition: head to tail (parallelogram)</text>
  <text x="430" y="58" font-size="14" fill="#1f2937">Dot product: lengths, angle and projection</text>

  <!-- left panel grid: origin (60,320), 50 px per unit -->
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="110" y1="70" x2="110" y2="320"/><line x1="160" y1="70" x2="160" y2="320"/>
    <line x1="210" y1="70" x2="210" y2="320"/><line x1="260" y1="70" x2="260" y2="320"/>
    <line x1="310" y1="70" x2="310" y2="320"/>
    <line x1="60" y1="270" x2="310" y2="270"/><line x1="60" y1="220" x2="310" y2="220"/>
    <line x1="60" y1="170" x2="310" y2="170"/><line x1="60" y1="120" x2="310" y2="120"/>
    <line x1="60" y1="70" x2="310" y2="70"/>
  </g>
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="60" y1="320" x2="320" y2="320"/><line x1="60" y1="320" x2="60" y2="65"/>
  </g>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="110" y="337">1</text><text x="160" y="337">2</text><text x="210" y="337">3</text><text x="260" y="337">4</text><text x="310" y="337">5</text>
    <text x="48" y="274">1</text><text x="48" y="224">2</text><text x="48" y="174">3</text><text x="48" y="124">4</text><text x="48" y="74">5</text>
  </g>
  <g stroke-dasharray="6 4" stroke-width="2" fill="none">
    <line x1="210" y1="270" x2="260" y2="170" stroke="#d97706"/>
    <line x1="110" y1="220" x2="260" y2="170" stroke="#2563eb"/>
  </g>
  <line x1="60" y1="320" x2="210" y2="270" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-blue)"/>
  <line x1="60" y1="320" x2="110" y2="220" stroke="#d97706" stroke-width="3" marker-end="url(#ah-amber)"/>
  <line x1="60" y1="320" x2="260" y2="170" stroke="#059669" stroke-width="3" marker-end="url(#ah-green)"/>
  <circle cx="60" cy="320" r="4" fill="#1f2937"/>
  <text x="50" y="337" font-size="12" fill="#1f2937">0</text>
  <text x="218" y="290" font-size="14" fill="#2563eb" font-weight="bold">u = (3, 1)</text>
  <text x="70" y="208" font-size="14" fill="#d97706" font-weight="bold">v = (1, 2)</text>
  <text x="200" y="158" font-size="14" fill="#059669" font-weight="bold">u + v = (4, 3)</text>

  <!-- right panel: origin (430,310), 50 px per unit -->
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="430" y1="310" x2="740" y2="310"/><line x1="430" y1="310" x2="430" y2="95"/>
  </g>
  <line x1="430" y1="310" x2="530" y2="310" stroke="#7c3aed" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  <line x1="430" y1="310" x2="680" y2="310" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-blue)"/>
  <line x1="430" y1="310" x2="530" y2="160" stroke="#d97706" stroke-width="3" marker-end="url(#ah-amber)"/>
  <line x1="530" y1="160" x2="530" y2="310" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M 520 310 V 300 H 530" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 470 310 A 40 40 0 0 0 452.2 276.7" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="430" cy="310" r="4" fill="#1f2937"/>
  <text x="474" y="296" font-size="14" fill="#1f2937">θ</text>
  <text x="664" y="300" font-size="14" fill="#2563eb" font-weight="bold">u</text>
  <text x="508" y="160" font-size="14" fill="#d97706" font-weight="bold">v</text>
  <text x="430" y="334" font-size="13" fill="#7c3aed">projection of v on u: |v| cos θ = (u · v) / |u| = 2</text>
  <g font-size="13" fill="#1f2937">
    <text x="560" y="110">u = (5, 0), v = (2, 3)</text>
    <text x="560" y="132">u · v = 5×2 + 0×3 = 10</text>
    <text x="560" y="154">|u| = 5, |v| = √13 ≈ 3.606</text>
    <text x="560" y="176">cos θ = 10 / (5 × 3.606) ≈ 0.555</text>
    <text x="560" y="198">θ ≈ 56.3°</text>
  </g>
  <text x="400" y="372" text-anchor="middle" font-size="12" fill="#1f2937">Grid units; each vector is drawn as an arrow from the origin to the point it names.</text>
</svg>
