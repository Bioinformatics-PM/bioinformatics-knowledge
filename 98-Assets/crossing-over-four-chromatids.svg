<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="bar"><rect x="0" y="0" width="180" height="14" rx="7"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="468" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Crossing over at the four-chromatid stage</text>
  <text x="380" y="52" text-anchor="middle" font-size="13" fill="#475569">Which of the four products of one meiosis are recombinant for loci A and B?</text>

  <!-- Row 1: one crossover -->
  <text x="30" y="82" font-size="14" font-weight="bold" fill="#1f2937">One crossover between A and B</text>
  <text x="110" y="99" text-anchor="middle" font-size="12" fill="#475569">locus A</text>
  <text x="290" y="99" text-anchor="middle" font-size="12" fill="#475569">locus B</text>
  <rect x="60" y="104" width="270" height="14" rx="7" fill="#bfdbfe" stroke="#3b82f6"/>
  <rect x="60" y="126" width="270" height="14" rx="7" fill="#bfdbfe" stroke="#3b82f6"/>
  <rect x="60" y="154" width="270" height="14" rx="7" fill="#fed7aa" stroke="#ea580c"/>
  <rect x="60" y="176" width="270" height="14" rx="7" fill="#fed7aa" stroke="#ea580c"/>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="110" y="115">A</text><text x="290" y="115">B</text>
    <text x="110" y="137">A</text><text x="290" y="137">B</text>
    <text x="110" y="165">a</text><text x="290" y="165">b</text>
    <text x="110" y="187">a</text><text x="290" y="187">b</text>
  </g>
  <g font-size="12" fill="#475569" text-anchor="end">
    <text x="50" y="115">1</text><text x="50" y="137">2</text><text x="50" y="165">3</text><text x="50" y="187">4</text>
  </g>
  <path d="M190,133 L210,161 M190,161 L210,133" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <text x="195" y="210" text-anchor="middle" font-size="12" fill="#6d28d9">crossover between chromatids 2 and 3</text>
  <line x1="345" y1="147" x2="425" y2="147" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="385" y="138" text-anchor="middle" font-size="12" fill="#475569">meiosis</text>

  <g transform="translate(440,100)">
    <g clip-path="url(#bar)"><rect x="0" y="0" width="180" height="14" fill="#bfdbfe"/></g>
    <rect x="0" y="0" width="180" height="14" rx="7" fill="none" stroke="#64748b"/>
    <text x="33" y="11" text-anchor="middle" font-size="12" fill="#1f2937">A</text>
    <text x="153" y="11" text-anchor="middle" font-size="12" fill="#1f2937">B</text>
  </g>
  <g transform="translate(440,128)">
    <g clip-path="url(#bar)"><rect x="0" y="0" width="93" height="14" fill="#bfdbfe"/><rect x="93" y="0" width="87" height="14" fill="#fed7aa"/></g>
    <rect x="0" y="0" width="180" height="14" rx="7" fill="none" stroke="#64748b"/>
    <text x="33" y="11" text-anchor="middle" font-size="12" fill="#1f2937">A</text>
    <text x="153" y="11" text-anchor="middle" font-size="12" fill="#1f2937">b</text>
  </g>
  <g transform="translate(440,156)">
    <g clip-path="url(#bar)"><rect x="0" y="0" width="93" height="14" fill="#fed7aa"/><rect x="93" y="0" width="87" height="14" fill="#bfdbfe"/></g>
    <rect x="0" y="0" width="180" height="14" rx="7" fill="none" stroke="#64748b"/>
    <text x="33" y="11" text-anchor="middle" font-size="12" fill="#1f2937">a</text>
    <text x="153" y="11" text-anchor="middle" font-size="12" fill="#1f2937">B</text>
  </g>
  <g transform="translate(440,184)">
    <g clip-path="url(#bar)"><rect x="0" y="0" width="180" height="14" fill="#fed7aa"/></g>
    <rect x="0" y="0" width="180" height="14" rx="7" fill="none" stroke="#64748b"/>
    <text x="33" y="11" text-anchor="middle" font-size="12" fill="#1f2937">a</text>
    <text x="153" y="11" text-anchor="middle" font-size="12" fill="#1f2937">b</text>
  </g>
  <g font-size="12" fill="#1f2937">
    <text x="632" y="111">AB parental</text>
    <text x="632" y="139" font-weight="bold">Ab recombinant</text>
    <text x="632" y="167" font-weight="bold">aB recombinant</text>
    <text x="632" y="195">ab parental</text>
  </g>
  <text x="530" y="216" text-anchor="middle" font-size="12" fill="#475569">2 of 4 products recombinant</text>

  <line x1="30" y1="232" x2="730" y2="232" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Row 2: two crossovers involving the same two chromatids -->
  <text x="30" y="258" font-size="14" font-weight="bold" fill="#1f2937">Two crossovers between A and B, on the same two chromatids</text>
  <text x="110" y="275" text-anchor="middle" font-size="12" fill="#475569">locus A</text>
  <text x="290" y="275" text-anchor="middle" font-size="12" fill="#475569">locus B</text>
  <rect x="60" y="280" width="270" height="14" rx="7" fill="#bfdbfe" stroke="#3b82f6"/>
  <rect x="60" y="302" width="270" height="14" rx="7" fill="#bfdbfe" stroke="#3b82f6"/>
  <rect x="60" y="330" width="270" height="14" rx="7" fill="#fed7aa" stroke="#ea580c"/>
  <rect x="60" y="352" width="270" height="14" rx="7" fill="#fed7aa" stroke="#ea580c"/>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="110" y="291">A</text><text x="290" y="291">B</text>
    <text x="110" y="313">A</text><text x="290" y="313">B</text>
    <text x="110" y="341">a</text><text x="290" y="341">b</text>
    <text x="110" y="363">a</text><text x="290" y="363">b</text>
  </g>
  <g font-size="12" fill="#475569" text-anchor="end">
    <text x="50" y="291">1</text><text x="50" y="313">2</text><text x="50" y="341">3</text><text x="50" y="363">4</text>
  </g>
  <path d="M155,309 L175,337 M155,337 L175,309 M235,309 L255,337 M235,337 L255,309" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <text x="205" y="388" text-anchor="middle" font-size="12" fill="#6d28d9">two crossovers between chromatids 2 and 3</text>
  <line x1="345" y1="323" x2="425" y2="323" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="385" y="314" text-anchor="middle" font-size="12" fill="#475569">meiosis</text>

  <g transform="translate(440,276)">
    <g clip-path="url(#bar)"><rect x="0" y="0" width="180" height="14" fill="#bfdbfe"/></g>
    <rect x="0" y="0" width="180" height="14" rx="7" fill="none" stroke="#64748b"/>
    <text x="33" y="11" text-anchor="middle" font-size="12" fill="#1f2937">A</text>
    <text x="153" y="11" text-anchor="middle" font-size="12" fill="#1f2937">B</text>
  </g>
  <g transform="translate(440,304)">
    <g clip-path="url(#bar)"><rect x="0" y="0" width="70" height="14" fill="#bfdbfe"/><rect x="70" y="0" width="53" height="14" fill="#fed7aa"/><rect x="123" y="0" width="57" height="14" fill="#bfdbfe"/></g>
    <rect x="0" y="0" width="180" height="14" rx="7" fill="none" stroke="#64748b"/>
    <text x="33" y="11" text-anchor="middle" font-size="12" fill="#1f2937">A</text>
    <text x="153" y="11" text-anchor="middle" font-size="12" fill="#1f2937">B</text>
  </g>
  <g transform="translate(440,332)">
    <g clip-path="url(#bar)"><rect x="0" y="0" width="70" height="14" fill="#fed7aa"/><rect x="70" y="0" width="53" height="14" fill="#bfdbfe"/><rect x="123" y="0" width="57" height="14" fill="#fed7aa"/></g>
    <rect x="0" y="0" width="180" height="14" rx="7" fill="none" stroke="#64748b"/>
    <text x="33" y="11" text-anchor="middle" font-size="12" fill="#1f2937">a</text>
    <text x="153" y="11" text-anchor="middle" font-size="12" fill="#1f2937">b</text>
  </g>
  <g transform="translate(440,360)">
    <g clip-path="url(#bar)"><rect x="0" y="0" width="180" height="14" fill="#fed7aa"/></g>
    <rect x="0" y="0" width="180" height="14" rx="7" fill="none" stroke="#64748b"/>
    <text x="33" y="11" text-anchor="middle" font-size="12" fill="#1f2937">a</text>
    <text x="153" y="11" text-anchor="middle" font-size="12" fill="#1f2937">b</text>
  </g>
  <g font-size="12" fill="#1f2937">
    <text x="632" y="287">AB parental</text>
    <text x="632" y="315">AB parental *</text>
    <text x="632" y="343">ab parental *</text>
    <text x="632" y="371">ab parental</text>
  </g>
  <text x="530" y="392" text-anchor="middle" font-size="12" fill="#475569">0 of 4 recombinant for A and B</text>
  <text x="380" y="416" text-anchor="middle" font-size="12" fill="#475569">* middle segment exchanged: detectable only with a marker between A and B</text>

  <!-- Legend -->
  <rect x="150" y="434" width="28" height="12" rx="6" fill="#bfdbfe" stroke="#3b82f6"/>
  <text x="186" y="445" font-size="12" fill="#1f2937">maternal homolog</text>
  <rect x="330" y="434" width="28" height="12" rx="6" fill="#fed7aa" stroke="#ea580c"/>
  <text x="366" y="445" font-size="12" fill="#1f2937">paternal homolog</text>
  <path d="M520,434 L532,446 M520,446 L532,434" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <text x="540" y="445" font-size="12" fill="#1f2937">crossover</text>
</svg>
