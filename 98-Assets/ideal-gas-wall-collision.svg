<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="756" height="376" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Kinetic origin of gas pressure: molecules bouncing off a wall</text>
  <!-- box -->
  <rect x="40" y="70" width="260" height="240" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/>
  <rect x="296" y="70" width="10" height="240" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="301" y="62" text-anchor="middle" font-size="13" fill="#1f2937">wall, area A</text>
  <!-- other molecules -->
  <g fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.2">
    <circle cx="80" cy="110" r="7"/><circle cx="150" cy="260" r="7"/><circle cx="110" cy="190" r="7"/>
    <circle cx="250" cy="95" r="7"/><circle cx="230" cy="270" r="7"/><circle cx="70" cy="285" r="7"/>
  </g>
  <!-- incoming and outgoing paths -->
  <line x1="190" y1="230" x2="281" y2="180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <line x1="286" y1="176" x2="196" y2="122" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <circle cx="286" cy="177" r="8" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="168" y="248" font-size="13" fill="#1f2937">before: v_x &gt; 0</text>
  <text x="140" y="110" font-size="13" fill="#1f2937">after: −v_x</text>
  <!-- L dimension -->
  <line x1="44" y1="330" x2="296" y2="330" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow-grey)" marker-end="url(#arrow-grey)"/>
  <text x="170" y="350" text-anchor="middle" font-size="13" fill="#1f2937">length L along x (volume V = A L)</text>
  <!-- derivation -->
  <g font-size="13" fill="#1f2937">
    <rect x="340" y="70" width="395" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="352" y="90">1. One bounce gives the wall momentum 2 m v_x</text>
    <text x="352" y="107">   (elastic collision: v_x becomes −v_x)</text>
    <rect x="340" y="124" width="395" height="44" rx="8" fill="#dcfce7" stroke="#86efac"/>
    <text x="352" y="144">2. Same molecule returns after a round trip</text>
    <text x="352" y="161">   of 2L, i.e. every Δt = 2L / v_x</text>
    <rect x="340" y="178" width="395" height="44" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="352" y="198">3. Mean force of one molecule: 2 m v_x / Δt = m v_x² / L</text>
    <text x="352" y="215">   N molecules: F = N m ⟨v_x²⟩ / L</text>
    <rect x="340" y="232" width="395" height="44" rx="8" fill="#fce7f3" stroke="#f9a8d4"/>
    <text x="352" y="252">4. P = F / A = (N/V) m ⟨v_x²⟩ = (1/3)(N/V) m ⟨v²⟩</text>
    <text x="352" y="269">   since ⟨v²⟩ = 3⟨v_x²⟩ (no preferred direction)</text>
    <rect x="340" y="286" width="395" height="44" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="352" y="306">5. Compare with P V = N k_B T:</text>
    <text x="352" y="323">   ⟨½ m v²⟩ = (3/2) k_B T</text>
  </g>
</svg>
