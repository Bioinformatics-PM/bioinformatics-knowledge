<circle cx="115" cy="325" r="19" fill="#e9d5ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="115" y="152" text-anchor="middle" font-size="14" fill="#1f2937">CHO</text>
<line x1="115" y1="160" x2="115" y2="352" stroke="#334155" stroke-width="2.2"/>
<text x="115" y="372" text-anchor="middle" font-size="14" fill="#1f2937">CH<tspan baseline-shift="sub" font-size="10">2</tspan>OH</text>
<line x1="77" y1="190" x2="153" y2="190" stroke="#334155" stroke-width="2.2"/>
