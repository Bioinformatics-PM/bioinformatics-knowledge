<text x="485.0" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">C2 epimers (differ only at C2)</text>
<text x="400" y="495" text-anchor="middle" font-size="13" fill="#475569">Epimers differ at exactly one stereocenter; all of them are diastereomers. D/L names only the configuration at C5.</text>
