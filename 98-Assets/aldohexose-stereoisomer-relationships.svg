<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Stereoisomers of D-glucose: enantiomer, epimers and diastereomers</title>
<desc id="d">Fischer projections of L-glucose, D-glucose, D-galactose and D-mannose, C1 aldehyde at the top. Shaded centers differ from D-glucose. L-glucose differs at all four stereocenters (enantiomer); D-galactose only at C4 (C4 epimer); D-mannose only at C2 (C2 epimer); D-galactose and D-mannose differ at C2 and C4 (diastereomers, not epimers).</desc>
<rect x="3" y="3" width="794" height="514" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="400" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Enantiomer, epimers and diastereomers of D-glucose</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="#475569">Fischer projections (C1 at top). Shaded stereocenters differ from D-glucose.</text>
<text x="22" y="152" font-size="12" fill="#64748b">C1</text>
<text x="22" y="194" font-size="12" fill="#64748b">C2</text>
<text x="22" y="239" font-size="12" fill="#64748b">C3</text>
<text x="22" y="284" font-size="12" fill="#64748b">C4</text>
<text x="22" y="329" font-size="12" fill="#64748b">C5</text>
<text x="22" y="376" font-size="12" fill="#64748b">C6</text>
<text x="115" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">L-glucose</text>
