<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" font-family="Helvetica, Arial, sans-serif">
  <rect x="2" y="2" width="716" height="446" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="360" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Toy protein-protein interaction network (invented data)</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#1f2937">vertex = protein, edge = interaction, number under each name = degree</text>
  <g stroke="#64748b" stroke-width="2.5" stroke-linecap="round">
    <line x1="300" y1="220" x2="160" y2="140"/>
    <line x1="300" y1="220" x2="160" y2="300"/>
    <line x1="300" y1="220" x2="430" y2="130"/>
    <line x1="300" y1="220" x2="430" y2="310"/>
    <line x1="160" y1="140" x2="160" y2="300"/>
    <line x1="430" y1="130" x2="560" y2="220"/>
    <line x1="430" y1="310" x2="560" y2="220"/>
    <line x1="560" y1="220" x2="670" y2="220"/>
  </g>
  <g stroke-width="2.5">
    <circle cx="300" cy="220" r="30" fill="#fde68a" stroke="#b45309"/>
    <circle cx="160" cy="140" r="30" fill="#dbeafe" stroke="#2563eb"/>
    <circle cx="160" cy="300" r="30" fill="#dbeafe" stroke="#2563eb"/>
    <circle cx="430" cy="130" r="30" fill="#dbeafe" stroke="#2563eb"/>
    <circle cx="430" cy="310" r="30" fill="#dbeafe" stroke="#2563eb"/>
    <circle cx="560" cy="220" r="30" fill="#dbeafe" stroke="#2563eb"/>
    <circle cx="670" cy="220" r="30" fill="#bbf7d0" stroke="#15803d"/>
    <circle cx="640" cy="345" r="30" fill="#e5e7eb" stroke="#6b7280"/>
  </g>
  <g text-anchor="middle" fill="#1f2937">
    <text x="300" y="217" font-size="14" font-weight="bold">P1</text><text x="300" y="234" font-size="12">deg 4</text>
    <text x="160" y="137" font-size="14" font-weight="bold">P2</text><text x="160" y="154" font-size="12">deg 2</text>
    <text x="160" y="297" font-size="14" font-weight="bold">P3</text><text x="160" y="314" font-size="12">deg 2</text>
    <text x="430" y="127" font-size="14" font-weight="bold">P4</text><text x="430" y="144" font-size="12">deg 2</text>
    <text x="430" y="307" font-size="14" font-weight="bold">P5</text><text x="430" y="324" font-size="12">deg 2</text>
    <text x="560" y="217" font-size="14" font-weight="bold">P6</text><text x="560" y="234" font-size="12">deg 3</text>
    <text x="670" y="217" font-size="14" font-weight="bold">P7</text><text x="670" y="234" font-size="12">deg 1</text>
    <text x="640" y="342" font-size="14" font-weight="bold">P8</text><text x="640" y="359" font-size="12">deg 0</text>
  </g>
  <g font-size="12" fill="#1f2937">
    <text x="300" y="181" text-anchor="middle" font-style="italic">hub</text>
    <text x="148" y="224" text-anchor="end" font-style="italic">3-cycle</text>
    <text x="430" y="224" text-anchor="middle" font-style="italic">4-cycle</text>
    <text x="700" y="272" text-anchor="end" font-style="italic">pendant (degree 1)</text>
    <text x="640" y="394" text-anchor="middle" font-style="italic">isolated (degree 0)</text>
  </g>
  <text x="360" y="430" text-anchor="middle" font-size="13" fill="#1f2937">Handshake lemma: 4+2+2+2+2+3+1+0 = 16 = 2 × 8 edges; odd-degree vertices: P6, P7 (an even count)</text>
</svg>
