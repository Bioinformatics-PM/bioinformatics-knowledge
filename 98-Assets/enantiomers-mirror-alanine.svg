 /><line x1="227.8" y1="167.6" x2="226.4" y2="175.5" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><line x1="237.3" y1="168.3" x2="235.6" y2="178.1" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><line x1="246.8" y1="168.9" x2="244.7" y2="180.7" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><line x1="256.2" y1="169.6" x2="253.8" y2="183.4" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><text x="276.7" y="186.3" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold" >H</text><circle cx="306.2" cy="185.5" r="10" fill="#e0e7ff" stroke="#6366f1"/><text x="306.2" y="190.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" >4</text><circle cx="190" cy="165" r="3" fill="#475569"/><path d="M 181.2 132.2 A 34 34 0 1 0 204.4 195.8" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/><text x="190.0" y="315.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" >L-alanine = (S)-alanine</text><text x="190.0" y="337.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" >1 → 2 → 3 anticlockwise: S</text><line x1="530.0" y1="165.0" x2="530.0" y2="99.0" stroke="#475569" stroke-width="2.2" stroke-linecap="round" /><text x="530.0" y="83.0" font-size="17" text-anchor="middle" fill="#1d4ed8" font-weight="bold" >NH₂</text><circle cx="505.5" cy="49.6" r="10" fill="#e0e7ff" stroke="#6366f1"/><text x="505.5" y="54.1" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" >1</text><line x1="530.0" y1="165.0" x2="587.2" y2="198.0" stroke="#475569" stroke-width="2.2" stroke-linecap="round" /><text x="606.2" y="215.0" font-size="17" text-anchor="middle" fill="#b91c1c" font-weight="bold" >COOH</text><circle cx="632.2" cy="224.0" r="10" fill="#e0e7ff" stroke="#6366f1"/><text x="632.2" y="228.5" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" >2</text><polygon points="530.0,165.0 482.2,211.1 492.9,220.1" fill="#475569"/><text x="473.4" y="238.4" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold" >CH₃</text><circle cx="454.2" cy="255.4" r="10" fill="#e0e7ff" stroke="#6366f1"/><text x="454.2" y="259.9" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" >3</text><line x1="520.9" y1="167.6" x2="520.5" y2="165.7" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><line x1="511.8" y1="170.2" x2="511.1" y2="166.3" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><line x1="502.7" y1="172.9" x2="501.6" y2="167.0" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><line x1="493.6" y1="175.5" x2="492.2" y2="167.6" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><line x1="484.4" y1="178.1" x2="482.7" y2="168.3" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><line x1="475.3" y1="180.7" x2="473.2" y2="168.9" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><line x1="466.2" y1="183.4" x2="463.8" y2="169.6" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><text x="443.3" y="186.3" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold" >H</text><circle cx="413.8" cy="185.5" r="10" fill="#e0e7ff" stroke="#6366f1"/><text x="413.8" y="190.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" >4</text><circle cx="530" cy="165" r="3" fill="#475569"/><path d="M 538.8 132.2 A 34 34 0 1 1 515.6 195.8" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/><text x="530.0" y="315.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" >D-alanine = (R)-alanine</text><text x="530.0" y="337.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" >1 → 2 → 3 clockwise: R</text><line x1="360.0" y1="58.0" x2="360.0" y2="300.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6"/><text x="360.0" y="318.0" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" >mirror</text><text x="360.0" y="368.0" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="normal" >CIP priorities: NH₂ (1) &gt; COOH (2) &gt; CH₃ (3) &gt; H (4); H, on the dashed bond, points away.</text><text x="360.0" y="388.0" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="normal" >Wedge = toward you. The two molecules are mirror images that cannot be superimposed: enantiomers.</text></svg>
