<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Bonding and antibonding orbitals of H2, and pi levels of conjugated chains</title>
<desc id="d">Left: two hydrogen 1s orbitals combine into a lower bonding sigma orbital holding both electrons and a higher, empty antibonding sigma star orbital; bond order 1. Right: Hückel pi levels of chains of 2, 4, 6 and 8 carbon p orbitals. Electrons fill the lower half; the gap between the highest occupied and lowest unoccupied levels shrinks from 2 to 0.69 times |beta| as the chain grows, and the measured absorption maxima move from 217 to 258 to 290 nanometres.</desc>
