<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Hydrogen bond geometry: donor, hydrogen, acceptor</title>
  <desc id="d">Left: a linear hydrogen bond between two water molecules, the donor oxygen, its hydrogen and the acceptor oxygen in a straight line, donor-acceptor distance about 0.30 nanometre. Middle: a bent hydrogen bond with a donor-hydrogen-acceptor angle near 130 degrees, weaker. Right: summary of donors (N-H, O-H) and acceptors (lone pairs on O and N) in biomolecules, with C-H not a donor, the alpha helix pattern and the base pair counts.</desc>
  <rect x="3" y="3" width="774" height="374" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">A hydrogen bond: D–H ··· A</text>
  <text x="390" y="56" text-anchor="middle" font-size="13" fill="#475569">Solid line: covalent bond. Dotted blue line: hydrogen bond. Schematic, not to scale.</text>

  <!-- Panel 1: linear -->
  <text x="140" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Linear: strongest</text>
  <line x1="62" y1="180" x2="40" y2="214" stroke="#64748b" stroke-width="4"/>
  <circle cx="38" cy="218" r="9" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <line x1="62" y1="180" x2="110" y2="180" stroke="#64748b" stroke-width="4"/>
  <line x1="122" y1="180" x2="196" y2="180" stroke="#2563eb" stroke-width="3" stroke-dasharray="5 5"/>
  <line x1="210" y1="180" x2="236" y2="152" stroke="#64748b" stroke-width="4"/>
  <line x1="210" y1="180" x2="236" y2="208" stroke="#64748b" stroke-width="4"/>
  <circle cx="240" cy="148" r="9" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <circle cx="240" cy="212" r="9" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <circle cx="62" cy="180" r="16" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="62" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">O</text>
  <circle cx="116" cy="180" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="116" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">H</text>
  <circle cx="210" cy="180" r="16" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="210" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">O</text>
  <text x="62" y="152" text-anchor="middle" font-size="13" fill="#b91c1c">donor (D)</text>
  <text x="200" y="112" text-anchor="middle" font-size="13" fill="#b91c1c">acceptor (A)</text>
  <text x="200" y="128" text-anchor="middle" font-size="12" fill="#475569">uses a lone pair</text>
  <line x1="62" y1="250" x2="210" y2="250" stroke="#475569" stroke-width="1.5"/>
  <line x1="62" y1="243" x2="62" y2="257" stroke="#475569" stroke-width="1.5"/>
  <line x1="210" y1="243" x2="210" y2="257" stroke="#475569" stroke-width="1.5"/>
  <text x="136" y="274" text-anchor="middle" font-size="13" fill="#1f2937">D ··· A about 0.30 nm</text>
  <text x="136" y="296" text-anchor="middle" font-size="13" fill="#1f2937">angle D–H ··· A = 180°</text>

  <!-- Panel 2: bent -->
  <text x="390" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Bent: weaker</text>
  <line x1="320" y1="200" x2="298" y2="234" stroke="#64748b" stroke-width="4"/>
  <circle cx="296" cy="238" r="9" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <line x1="320" y1="200" x2="353" y2="178" stroke="#64748b" stroke-width="4"/>
  <line x1="371" y1="175" x2="446" y2="196" stroke="#2563eb" stroke-width="3" stroke-dasharray="5 5"/>
  <line x1="462" y1="200" x2="488" y2="172" stroke="#64748b" stroke-width="4"/>
  <line x1="462" y1="200" x2="488" y2="228" stroke="#64748b" stroke-width="4"/>
  <circle cx="492" cy="168" r="9" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <circle cx="492" cy="232" r="9" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <circle cx="320" cy="200" r="16" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="320" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">O</text>
  <circle cx="361" cy="172" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="361" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">H</text>
  <circle cx="462" cy="200" r="16" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="462" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">O</text>
  <path d="M 343 184 A 22 22 0 0 0 382 178" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="366" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">≈ 130°</text>
  <text x="390" y="274" text-anchor="middle" font-size="13" fill="#1f2937">H no longer points at the lone pair:</text>
  <text x="390" y="296" text-anchor="middle" font-size="13" fill="#1f2937">less overlap of the partial charges</text>

  <!-- Panel 3: summary -->
  <rect x="540" y="78" width="222" height="240" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="651" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">In biomolecules</text>
  <text x="552" y="128" font-size="13" fill="#1f2937">Donors: N–H, O–H</text>
  <text x="552" y="148" font-size="13" fill="#1f2937">Acceptors: lone pairs on O</text>
  <text x="552" y="166" font-size="13" fill="#1f2937">(C=O, O–H, water) and on N</text>
  <text x="552" y="184" font-size="13" fill="#1f2937">(ring N without H)</text>
  <text x="552" y="208" font-size="13" fill="#b91c1c">Not a donor: C–H</text>
  <text x="552" y="232" font-size="13" fill="#1f2937">α helix: C=O of residue i</text>
  <text x="552" y="250" font-size="13" fill="#1f2937">··· H–N of residue i + 4</text>
  <text x="552" y="274" font-size="13" fill="#1f2937">Base pairs: A–T 2, G–C 3</text>
  <text x="552" y="298" font-size="13" fill="#1f2937">Water: 2 donors, 2 acceptors</text>
  <text x="390" y="352" text-anchor="middle" font-size="12" fill="#475569">Distances and angles: see the Hydrogen Bond note for sources (Alberts, Chemistry 2e, Berg).</text>
</svg>
