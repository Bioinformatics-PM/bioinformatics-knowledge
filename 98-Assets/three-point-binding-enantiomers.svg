<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Helvetica, Arial, sans-serif"><rect x="1" y="1" width="718" height="398" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="360.0" y="32.0" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Why a chiral binding site tells enantiomers apart</text><rect x="16" y="48" width="336" height="262" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/><text x="184.0" y="72.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">Molecule: three contacts match</text><rect x="156.0" y="84.0" width="56" height="56" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 3"/><text x="204.0" y="98.0" font-size="12" text-anchor="middle" fill="#475569" font-weight="bold">a</text><rect x="88.5" y="201.0" width="56" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3"/><text x="136.5" y="215.0" font-size="12" text-anchor="middle" fill="#475569" font-weight="bold">b</text><rect x="223.5" y="201.0" width="56" height="56" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 3"/><text x="271.5" y="215.0" font-size="12" text-anchor="middle" fill="#475569" font-weight="bold">c</text><line x1="184" y1="190" x2="184.0" y2="112.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/><line x1="184" y1="190" x2="116.5" y2="229.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/><line x1="184" y1="190" x2="251.5" y2="229.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/><circle cx="184.0" cy="112.0" r="17" fill="#93c5fd" stroke="#475569" stroke-width="1.5"/><text x="184.0" y="117.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">A</text><text x="218.0" y="134.0" font-size="18" text-anchor="middle" fill="#15803d" font-weight="bold">✓</text><circle cx="116.5" cy="229.0" r="17" fill="#fcd34d" stroke="#475569" stroke-width="1.5"/><text x="116.5" y="234.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">B</text><text x="82.5" y="251.0" font-size="18" text-anchor="middle" fill="#15803d" font-weight="bold">✓</text><circle cx="251.5" cy="229.0" r="17" fill="#86efac" stroke="#475569" stroke-width="1.5"/><text x="251.5" y="234.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">C</text><text x="285.5" y="251.0" font-size="18" text-anchor="middle" fill="#15803d" font-weight="bold">✓</text><circle cx="184" cy="190" r="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="184.0" y="195.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">H</text><text x="184.0" y="296.0" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal">central C under H; H points toward you</text><rect x="368" y="48" width="336" height="262" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/><text x="536.0" y="72.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">Mirror image: one contact matches</text><rect x="508.0" y="84.0" width="56" height="56" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 3"/><text x="556.0" y="98.0" font-size="12" text-anchor="middle" fill="#475569" font-weight="bold">a</text><rect x="440.5" y="201.0" width="56" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3"/><text x="488.5" y="215.0" font-size="12" text-anchor="middle" fill="#475569" font-weight="bold">b</text><rect x="575.5" y="201.0" width="56" height="56" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 3"/><text x="623.5" y="215.0" font-size="12" text-anchor="middle" fill="#475569" font-weight="bold">c</text><line x1="536" y1="190" x2="536.0" y2="112.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/><line x1="536" y1="190" x2="468.5" y2="229.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/><line x1="536" y1="190" x2="603.5" y2="229.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/><circle cx="536.0" cy="112.0" r="17" fill="#93c5fd" stroke="#475569" stroke-width="1.5"/><text x="536.0" y="117.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">A</text><text x="570.0" y="134.0" font-size="18" text-anchor="middle" fill="#15803d" font-weight="bold">✓</text><circle cx="468.5" cy="229.0" r="17" fill="#86efac" stroke="#475569" stroke-width="1.5"/><text x="468.5" y="234.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">C</text><text x="434.5" y="251.0" font-size="18" text-anchor="middle" fill="#b91c1c" font-weight="bold">✗</text><circle cx="603.5" cy="229.0" r="17" fill="#fcd34d" stroke="#475569" stroke-width="1.5"/><text x="603.5" y="234.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">B</text><text x="637.5" y="251.0" font-size="18" text-anchor="middle" fill="#b91c1c" font-weight="bold">✗</text><circle cx="536" cy="190" r="12" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="536.0" y="195.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">H</text><text x="536.0" y="296.0" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal">central C under H; H points toward you</text><text x="28.0" y="334.0" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="normal">Site pockets (dashed): a, b, c, each fitting one group type. Groups: A, B, C on the same carbon.</text><text x="28.0" y="354.0" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="normal">Clockwise from pocket a, the site needs A → C → B; the mirror image reads A → B → C at any rotation.</text><text x="28.0" y="374.0" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="normal">Flipping it over would push H into the site. No rigid motion gives three matches: the site is chiral.</text></svg>