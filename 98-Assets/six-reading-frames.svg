  <rect x="3" y="3" width="774" height="534" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Six reading frames: three per strand, each read 5' to 3'</text>
  <text x="390" y="58" text-anchor="middle" font-size="13" fill="#475569">Invented duplex, n = 14 bp. Boxes are codons, letters their amino acids (* = stop).</text>
  <text x="120" y="184" font-size="15" font-weight="bold" fill="#1f2937">+1</text>
