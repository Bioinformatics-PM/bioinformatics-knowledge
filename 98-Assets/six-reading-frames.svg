<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The six reading frames of a double-stranded sequence</title>
  <desc id="d">Invented 14-bp duplex 5'-GATGCCTGATTCAT-3'. Above it, frames +1, +2 and +3 group the top strand into codons starting at offsets 0, 1 and 2 from its 5' end and are read left to right. Below, frames -1, -2 and -3 group the bottom strand into codons starting at offsets 0, 1 and 2 from its own 5' end, on the right, and are read right to left. Each codon is labeled with its amino acid, * for stop.</desc>
