<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="408" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Reading a pedigree: an autosomal recessive family</text>
  <text x="380" y="52" text-anchor="middle" font-size="13" fill="#475569">Standard symbols (left) and the classic carrier-risk question (right)</text>

  <!-- Legend -->
  <rect x="16" y="68" width="232" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="90" font-size="13" font-weight="bold" fill="#1f2937">Symbols</text>
  <rect x="36" y="104" width="24" height="24" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="76" y="120" font-size="12" fill="#1f2937">male</text>
  <circle cx="48" cy="150" r="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="76" y="154" font-size="12" fill="#1f2937">female</text>
  <path d="M48,172 L60,184 L48,196 L36,184 Z" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="76" y="188" font-size="12" fill="#1f2937">sex not specified</text>
  <rect x="36" y="206" width="24" height="24" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
  <text x="76" y="222" font-size="12" fill="#1f2937">affected</text>
  <circle cx="48" cy="252" r="12" fill="#f1f5f9"/>
  <path d="M48,240 A12,12 0 0,0 48,264 Z" fill="#64748b"/>
  <circle cx="48" cy="252" r="12" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="76" y="256" font-size="12" fill="#1f2937">carrier (heterozygote)</text>
  <rect x="28" y="278" width="16" height="16" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <line x1="44" y1="286" x2="64" y2="286" stroke="#334155" stroke-width="1.5"/>
  <circle cx="72" cy="286" r="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="92" y="290" font-size="12" fill="#1f2937">mating</text>
  <rect x="28" y="310" width="16" height="16" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <line x1="44" y1="315" x2="64" y2="315" stroke="#334155" stroke-width="1.5"/>
  <line x1="44" y1="321" x2="64" y2="321" stroke="#334155" stroke-width="1.5"/>
  <circle cx="72" cy="318" r="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="92" y="322" font-size="12" fill="#1f2937">consanguineous mating</text>
  <line x1="30" y1="358" x2="56" y2="342" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="76" y="354" font-size="12" fill="#1f2937">proband</text>

  <!-- Generation numerals -->
  <g font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">
    <text x="292" y="117">I</text><text x="292" y="197">II</text><text x="292" y="287">III</text>
  </g>

  <!-- Generation I: obligate carriers -->
  <text x="460" y="84" text-anchor="middle" font-size="12" fill="#6d28d9">obligate carriers (Aa)</text>
  <rect x="384" y="96" width="32" height="32" fill="#f1f5f9"/>
  <rect x="384" y="96" width="16" height="32" fill="#64748b"/>
  <rect x="384" y="96" width="32" height="32" fill="none" stroke="#334155" stroke-width="1.5"/>
  <circle cx="520" cy="112" r="16" fill="#f1f5f9"/>
  <path d="M520,96 A16,16 0 0,0 520,128 Z" fill="#64748b"/>
  <circle cx="520" cy="112" r="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <line x1="416" y1="112" x2="504" y2="112" stroke="#334155" stroke-width="1.5"/>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="400" y="146">I-1</text><text x="520" y="146">I-2</text>
  </g>
  <path d="M460,112 L460,154 M400,154 L520,154 M400,154 L400,176 M520,154 L520,176" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Generation II -->
  <circle cx="400" cy="192" r="16" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
  <rect x="504" y="176" width="32" height="32" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <circle cx="650" cy="192" r="16" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <line x1="536" y1="192" x2="634" y2="192" stroke="#334155" stroke-width="1.5"/>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="400" y="226">II-1</text><text x="520" y="226">II-2</text><text x="650" y="226">II-3</text>
  </g>
  <g font-size="12" fill="#6d28d9" text-anchor="middle">
    <text x="520" y="244">P(carrier) = 2/3</text>
    <text x="650" y="244">P(carrier) = 2pq</text>
  </g>
  <line x1="350" y1="228" x2="382" y2="206" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="344" y="246" text-anchor="middle" font-size="12" fill="#1f2937">proband</text>

  <!-- Generation III -->
  <line x1="585" y1="192" x2="585" y2="266" stroke="#334155" stroke-width="1.5"/>
  <path d="M585,266 L601,282 L585,298 L569,282 Z" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="585" y="287" text-anchor="middle" font-size="13" fill="#1f2937">?</text>
  <text x="585" y="316" text-anchor="middle" font-size="12" fill="#1f2937">III-1</text>
  <text x="585" y="338" text-anchor="middle" font-size="12" fill="#6d28d9">P(affected) = 2/3 &#215; 2pq &#215; 1/4</text>

  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="507" y="372">An affected child of unaffected parents: a recessive signature.</text>
    <text x="507" y="392">The unaffected sib of an affected child is a carrier with probability 2/3.</text>
  </g>
</svg>
