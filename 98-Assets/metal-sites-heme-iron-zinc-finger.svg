<text x="514" y="137" text-anchor="middle" font-size="12" fill="#64748b" font-weight="normal">S (Cys)</text>
<text x="654" y="158" text-anchor="middle" font-size="16" fill="#a16207" font-weight="bold">S</text>
<text x="654" y="137" text-anchor="middle" font-size="12" fill="#64748b" font-weight="normal">S (Cys)</text>
<text x="526" y="290" text-anchor="middle" font-size="16" fill="#1d4ed8" font-weight="bold">N</text>
