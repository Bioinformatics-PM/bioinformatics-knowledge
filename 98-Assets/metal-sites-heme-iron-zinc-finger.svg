<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Coordination geometry of heme iron and of a zinc finger zinc</title>
<desc id="d">Left: heme iron in oxymyoglobin or oxyhemoglobin is six-coordinate and octahedral: four porphyrin nitrogens in a plane, the proximal histidine below and dioxygen above. Without oxygen it has five ligands. Right: the zinc of a Cys2His2 zinc finger has four ligands, two cysteine sulfurs and two histidine nitrogens, at the corners of a tetrahedron with angles near 109.5 degrees.</desc>
<rect x="1" y="1" width="758" height="418" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="380.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Metal sites in proteins: number and arrangement of ligands</text>
<rect x="16" y="44" width="398" height="360" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
<rect x="424" y="44" width="320" height="360" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
