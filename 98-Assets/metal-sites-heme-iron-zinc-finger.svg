<text x="646" y="303" text-anchor="middle" font-size="12" fill="#64748b" font-weight="normal">N (His)</text>
<path d="M 556.0 190.0 Q 584 167 612.0 190.0" fill="none" stroke="#64748b" stroke-width="1.3"/>
