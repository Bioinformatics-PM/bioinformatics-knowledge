<circle cx="584" cy="215" r="15" fill="#99f6e4" stroke="#0f766e" stroke-width="1.5"/>
<text x="584" y="220" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="bold">Zn</text>
<text x="584" y="330" text-anchor="middle" font-size="12" fill="#64748b" font-weight="normal">wedge: toward you; hashes: away</text>
<text x="584" y="368" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="normal">4 ligands: 2 Cys S + 2 His N → tetrahedral</text>
<text x="584" y="388" text-anchor="middle" font-size="12" fill="#64748b" font-weight="normal">structural role: the zinc holds the fold</text>
