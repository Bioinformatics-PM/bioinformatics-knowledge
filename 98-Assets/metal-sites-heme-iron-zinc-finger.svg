<line x1="186.4" y1="204.5" x2="177.8" y2="209.8" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
<text x="168" y="221" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="bold">N</text>
<line x1="200.0" y1="212.0" x2="200.0" y2="258.5" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
<line x1="200.0" y1="180.0" x2="200.0" y2="137.0" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
<text x="200" y="274" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="bold">N</text>
<polygon points="200.0,280.5 220.0,295.0 212.3,318.5 187.7,318.5 180.0,295.0" fill="none" stroke="#475569" stroke-width="2"/>
<text x="232" y="308" text-anchor="start" font-size="13" fill="#1f2937" font-weight="normal">His (proximal)</text>
<text x="200" y="131" text-anchor="middle" font-size="14" fill="#b91c1c" font-weight="bold">O</text>
<text x="234" y="91" text-anchor="middle" font-size="14" fill="#b91c1c" font-weight="bold">O</text>
<line x1="208.8" y1="120.3" x2="229.8" y2="95.6" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
<line x1="204.2" y1="116.4" x2="225.2" y2="91.7" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
<text x="248" y="92" text-anchor="start" font-size="13" fill="#1f2937" font-weight="normal">O₂ (sixth position)</text>
<circle cx="200" cy="196" r="15" fill="#fdba74" stroke="#b45309" stroke-width="1.5"/>
<text x="200" y="201" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="bold">Fe</text>
<text x="215" y="368" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="normal">6 ligands: 4 porphyrin N + His + O₂ → octahedral</text>
<text x="215" y="388" text-anchor="middle" font-size="12" fill="#64748b" font-weight="normal">without O₂: 5 ligands, Fe slightly out of the plane</text>
