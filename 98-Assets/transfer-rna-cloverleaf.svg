<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Transfer RNA: cloverleaf and L-shape, schematic</title>
  <desc id="d">Left: the cloverleaf secondary structure of a tRNA, with the acceptor stem and its 3' CCA end carrying the amino acid at the top, the D arm on the left, the TPsiC arm on the right, the variable loop, and the anticodon arm at the bottom. The anticodon 5'-GAA-3' pairs antiparallel with the codon 5'-UUC-3' of an mRNA. Right: the same molecule folded in three dimensions into an L, with the amino acid and the anticodon at opposite tips.</desc>
  <rect x="3" y="3" width="754" height="594" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Transfer RNA: two functional ends on one folded chain</text>

  <g transform="translate(0,40)">
    <text x="30" y="40" font-size="15" font-weight="bold" fill="#334155">Cloverleaf (secondary structure)</text>

    <!-- acceptor stem -->
    <rect x="218" y="104" width="54" height="100" rx="8" fill="#fde68a" fill-opacity="0.55" stroke="none"/>
    <line x1="230" y1="110" x2="230" y2="205" stroke="#64748b" stroke-width="4"/>
    <line x1="260" y1="58" x2="260" y2="205" stroke="#64748b" stroke-width="4"/>
    <g stroke="#94a3b8" stroke-width="2.5">
      <line x1="232" y1="118" x2="258" y2="118"/><line x1="232" y1="131" x2="258" y2="131"/>
      <line x1="232" y1="144" x2="258" y2="144"/><line x1="232" y1="157" x2="258" y2="157"/>
      <line x1="232" y1="170" x2="258" y2="170"/><line x1="232" y1="183" x2="258" y2="183"/>
      <line x1="232" y1="196" x2="258" y2="196"/>
    </g>
    <text x="220" y="112" text-anchor="end" font-size="14" font-weight="bold" fill="#475569">5'</text>
    <!-- CCA end and amino acid -->
    <g font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">
      <circle cx="260" cy="92" r="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="260" y="96">C</text>
      <circle cx="260" cy="74" r="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="260" y="78">C</text>
      <circle cx="260" cy="56" r="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="260" y="60">A</text>
    </g>
    <text x="244" y="60" text-anchor="end" font-size="14" font-weight="bold" fill="#475569">3'</text>
    <line x1="268" y1="52" x2="296" y2="38" stroke="#b91c1c" stroke-width="2.5"/>
    <circle cx="314" cy="32" r="20" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
    <text x="314" y="37" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Phe</text>
    <text x="342" y="28" font-size="13" fill="#1f2937">amino acid, esterified</text>
    <text x="342" y="44" font-size="13" fill="#1f2937">to the terminal A of CCA</text>
    <text x="284" y="150" font-size="13" fill="#92400e">acceptor stem</text>

    <!-- D arm -->
    <rect x="148" y="198" width="80" height="44" rx="8" fill="#bfdbfe" fill-opacity="0.55" stroke="none"/>
    <polyline points="230,205 150,205" fill="none" stroke="#64748b" stroke-width="4"/>
    <polyline points="150,235 230,235 230,250" fill="none" stroke="#64748b" stroke-width="4"/>
    <path d="M150,205 A27,27 0 1,0 150,235" fill="#dbeafe" stroke="#64748b" stroke-width="4"/>
    <g stroke="#94a3b8" stroke-width="2.5">
      <line x1="165" y1="207" x2="165" y2="233"/><line x1="182" y1="207" x2="182" y2="233"/>
      <line x1="199" y1="207" x2="199" y2="233"/><line x1="216" y1="207" x2="216" y2="233"/>
    </g>
    <text x="127" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">D</text>
    <text x="88" y="270" text-anchor="middle" font-size="13" fill="#1e40af">D arm</text>

    <!-- T arm -->
    <rect x="262" y="198" width="86" height="44" rx="8" fill="#fbcfe8" fill-opacity="0.55" stroke="none"/>
    <polyline points="345,205 260,205" fill="none" stroke="#64748b" stroke-width="4"/>
    <polyline points="295,235 345,235" fill="none" stroke="#64748b" stroke-width="4"/>
    <path d="M345,205 A27,27 0 1,1 345,235" fill="#fce7f3" stroke="#64748b" stroke-width="4"/>
    <g stroke="#94a3b8" stroke-width="2.5">
      <line x1="300" y1="207" x2="300" y2="233"/><line x1="311" y1="207" x2="311" y2="233"/>
      <line x1="322" y1="207" x2="322" y2="233"/><line x1="333" y1="207" x2="333" y2="233"/>
      <line x1="344" y1="207" x2="344" y2="233"/>
    </g>
    <text x="368" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">TΨC</text>
    <text x="400" y="270" text-anchor="middle" font-size="13" fill="#9d174d">TΨC arm</text>

    <!-- variable loop -->
    <path d="M260,250 C270,290 300,285 295,235" fill="none" stroke="#64748b" stroke-width="4"/>
    <circle cx="282" cy="277" r="6" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="304" y="300" font-size="13" fill="#6d28d9">variable loop</text>

    <!-- anticodon arm -->
    <rect x="218" y="250" width="54" height="78" rx="8" fill="#bbf7d0" fill-opacity="0.55" stroke="none"/>
    <line x1="230" y1="250" x2="230" y2="330" stroke="#64748b" stroke-width="4"/>
    <line x1="260" y1="250" x2="260" y2="330" stroke="#64748b" stroke-width="4"/>
    <g stroke="#94a3b8" stroke-width="2.5">
      <line x1="232" y1="260" x2="258" y2="260"/><line x1="232" y1="274" x2="258" y2="274"/>
      <line x1="232" y1="288" x2="258" y2="288"/><line x1="232" y1="302" x2="258" y2="302"/>
      <line x1="232" y1="316" x2="258" y2="316"/>
    </g>
    <path d="M230,330 C198,345 198,392 227,398 L263,398 C292,392 292,345 260,330" fill="#dcfce7" stroke="#64748b" stroke-width="4"/>
    <g font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">
      <circle cx="227" cy="398" r="10" fill="#86efac" stroke="#15803d" stroke-width="2"/><text x="227" y="403">G</text>
      <circle cx="245" cy="398" r="10" fill="#86efac" stroke="#15803d" stroke-width="2"/><text x="245" y="403">A</text>
      <circle cx="263" cy="398" r="10" fill="#86efac" stroke="#15803d" stroke-width="2"/><text x="263" y="403">A</text>
    </g>
    <text x="150" y="300" text-anchor="end" font-size="13" fill="#166534">anticodon arm</text>
    <text x="300" y="360" font-size="13" fill="#166534">anticodon, read 5' to 3':</text>
    <text x="300" y="376" font-size="13" fill="#166534">G (wobble position) A A</text>

    <!-- codon on mRNA -->
    <g stroke="#475569" stroke-width="2">
      <line x1="227" y1="410" x2="227" y2="422"/><line x1="245" y1="410" x2="245" y2="422"/><line x1="263" y1="410" x2="263" y2="422"/>
    </g>
    <g font-family="Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">
      <text x="227" y="438">C</text><text x="245" y="438">U</text><text x="263" y="438">U</text>
    </g>
    <line x1="140" y1="446" x2="350" y2="446" stroke="#f97316" stroke-width="5"/>
    <text x="126" y="451" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2410c">3'</text>
    <text x="364" y="451" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2410c">5'</text>
    <text x="245" y="470" text-anchor="middle" font-size="13" fill="#9a3412">mRNA codon 5'-UUC-3' (drawn 3' to 5')</text>
  </g>

  <!-- L-shape panel -->
  <line x1="448" y1="70" x2="448" y2="520" stroke="#e2e8f0" stroke-width="2"/>
  <text x="600" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">L-shape (3D fold)</text>
  <rect x="520" y="170" width="90" height="36" fill="#fbcfe8" stroke="#db2777" stroke-width="2"/>
  <rect x="610" y="170" width="92" height="36" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <rect x="520" y="206" width="36" height="116" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="520" y="322" width="36" height="120" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <line x1="702" y1="188" x2="716" y2="188" stroke="#b91c1c" stroke-width="2.5"/>
  <circle cx="732" cy="188" r="16" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <text x="732" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2937">Phe</text>
  <text x="565" y="162" text-anchor="middle" font-size="13" fill="#9d174d">TΨC arm</text>
  <text x="656" y="162" text-anchor="middle" font-size="13" fill="#92400e">acceptor stem</text>
  <text x="566" y="266" font-size="13" fill="#1e40af">D arm</text>
  <text x="566" y="386" font-size="13" fill="#166534">anticodon arm</text>
  <text x="538" y="462" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#15803d">GAA</text>
  <text x="470" y="118" font-size="12" fill="#475569">elbow: the D and TΨC loops</text>
  <text x="470" y="134" font-size="12" fill="#475569">meet at the corner</text>
  <line x1="500" y1="140" x2="518" y2="166" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="612" y="490" text-anchor="middle" font-size="13" fill="#1f2937">Amino acid and anticodon sit</text>
  <text x="612" y="507" text-anchor="middle" font-size="13" fill="#1f2937">at opposite tips of the L.</text>

  <text x="380" y="546" text-anchor="middle" font-size="12" fill="#475569">Pairing is antiparallel: the 5' (wobble) base of the anticodon pairs with the 3' base of the codon.</text>
  <text x="380" y="563" text-anchor="middle" font-size="12" fill="#475569">G at the wobble position also pairs with U, so this tRNA reads both UUC and UUU (phenylalanine).</text>
  <text x="380" y="580" text-anchor="middle" font-size="12" fill="#475569">Schematic: stem lengths and loop sizes are indicative, not to scale. Ψ = pseudouridine, D = dihydrouridine.</text>
</svg>
