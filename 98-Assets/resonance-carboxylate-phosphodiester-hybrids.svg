<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Resonance hybrids of a carboxylate and of a phosphodiester</title>
<desc id="d">Top row: the two resonance structures of a carboxylate group, related by curved arrows that move one lone pair and one pi bond, and their hybrid, in which both C-O bonds are one and a half bonds and each oxygen carries minus one half. Bottom row: the same pattern for the two non-bridging oxygens of a phosphodiester in the DNA backbone: each carries minus one half.</desc>
