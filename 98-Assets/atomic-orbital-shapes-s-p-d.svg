<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="320" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Shapes of s, p and d orbitals (boundary surfaces, schematic)</text>
  <text x="380" y="50" text-anchor="middle" font-size="13" fill="#374151">surface enclosing most of the probability |ψ|²; colors give the sign (phase) of ψ</text>
  <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3">
    <line x1="26" y1="160" x2="146" y2="160"/><line x1="86" y1="100" x2="86" y2="220"/>
    <line x1="172" y1="160" x2="292" y2="160"/><line x1="232" y1="100" x2="232" y2="220"/>
    <line x1="320" y1="160" x2="440" y2="160"/><line x1="380" y1="100" x2="380" y2="220"/>
    <line x1="468" y1="160" x2="588" y2="160"/><line x1="528" y1="100" x2="528" y2="220"/>
    <line x1="614" y1="160" x2="734" y2="160"/><line x1="674" y1="100" x2="674" y2="220"/>
  </g>
  <g stroke="#475569" stroke-width="1.2">
    <circle cx="86" cy="160" r="42" fill="#bfdbfe" fill-opacity="0.85"/>
    <ellipse cx="202" cy="160" rx="28" ry="18" fill="#fed7aa" fill-opacity="0.9"/>
    <ellipse cx="262" cy="160" rx="28" ry="18" fill="#bfdbfe" fill-opacity="0.9"/>
    <ellipse cx="380" cy="130" rx="18" ry="28" fill="#bfdbfe" fill-opacity="0.9"/>
    <ellipse cx="380" cy="190" rx="18" ry="28" fill="#fed7aa" fill-opacity="0.9"/>
    <ellipse cx="552" cy="136" rx="26" ry="14" transform="rotate(-45 552 136)" fill="#bfdbfe" fill-opacity="0.9"/>
    <ellipse cx="504" cy="184" rx="26" ry="14" transform="rotate(-45 504 184)" fill="#bfdbfe" fill-opacity="0.9"/>
    <ellipse cx="504" cy="136" rx="26" ry="14" transform="rotate(45 504 136)" fill="#fed7aa" fill-opacity="0.9"/>
    <ellipse cx="552" cy="184" rx="26" ry="14" transform="rotate(45 552 184)" fill="#fed7aa" fill-opacity="0.9"/>
    <ellipse cx="674" cy="160" rx="38" ry="11" fill="#fed7aa" fill-opacity="0.9"/>
    <ellipse cx="674" cy="126" rx="15" ry="27" fill="#bfdbfe" fill-opacity="0.9"/>
    <ellipse cx="674" cy="194" rx="15" ry="27" fill="#bfdbfe" fill-opacity="0.9"/>
  </g>
  <g stroke="#b45309" stroke-width="1.6" stroke-dasharray="2 3">
    <line x1="232" y1="118" x2="232" y2="202"/>
    <line x1="338" y1="160" x2="422" y2="160"/>
  </g>
  <g font-size="12" fill="#374151">
    <text x="148" y="164">x</text><text x="90" y="104">z</text>
    <text x="294" y="164">x</text><text x="236" y="104">z</text>
    <text x="442" y="164">x</text><text x="384" y="104">z</text>
    <text x="590" y="164">x</text><text x="532" y="104">y</text>
    <text x="736" y="164">x</text><text x="678" y="104">z</text>
  </g>
  <g font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">
    <text x="86" y="248">1s</text><text x="232" y="248">2p<tspan baseline-shift="sub" font-size="12">x</tspan></text><text x="380" y="248">2p<tspan baseline-shift="sub" font-size="12">z</tspan></text><text x="528" y="248">3d<tspan baseline-shift="sub" font-size="12">xy</tspan></text><text x="674" y="248">3d<tspan baseline-shift="sub" font-size="12">z²</tspan></text>
  </g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="86" y="266">l = 0, sphere</text><text x="232" y="266">l = 1, 1 nodal plane</text><text x="380" y="266">l = 1, 1 nodal plane</text><text x="528" y="266">l = 2, 2 nodal planes</text><text x="674" y="266">l = 2, 2 nodal cones</text>
  </g>
  <rect x="210" y="284" width="16" height="12" fill="#bfdbfe" stroke="#475569"/>
  <text x="232" y="295" font-size="12" fill="#374151">ψ &gt; 0</text>
  <rect x="300" y="284" width="16" height="12" fill="#fed7aa" stroke="#475569"/>
  <text x="322" y="295" font-size="12" fill="#374151">ψ &lt; 0</text>
  <line x1="392" y1="290" x2="414" y2="290" stroke="#b45309" stroke-width="1.6" stroke-dasharray="2 3"/>
  <text x="420" y="295" font-size="12" fill="#374151">nodal plane (ψ = 0); dashed grey: axes</text>
</svg>
