<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="758" height="448" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Chromosome structure: arms, centromere, telomeres, homologs, sex chromosomes</text>

  <!-- Panel titles -->
  <text x="150" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">Replicated chromosome</text>
  <text x="415" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">Homologous pair</text>
  <text x="645" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">Sex chromosomes</text>
  <line x1="275" y1="50" x2="275" y2="400" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="545" y1="50" x2="545" y2="400" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Panel 1: two sister chromatids joined at the centromere -->
  <g stroke="#64748b" stroke-width="1.5">
    <rect x="112" y="90" width="28" height="72" rx="13" fill="#bae6fd"/>
    <rect x="146" y="90" width="28" height="72" rx="13" fill="#bae6fd"/>
    <rect x="112" y="178" width="28" height="172" rx="13" fill="#bae6fd"/>
    <rect x="146" y="178" width="28" height="172" rx="13" fill="#bae6fd"/>
    <rect x="120" y="158" width="12" height="24" fill="#bae6fd"/>
    <rect x="154" y="158" width="12" height="24" fill="#bae6fd"/>
    <ellipse cx="143" cy="170" rx="28" ry="7" fill="#fcd34d"/>
    <rect x="112" y="90" width="28" height="12" rx="6" fill="#86efac"/>
    <rect x="146" y="90" width="28" height="12" rx="6" fill="#86efac"/>
    <rect x="112" y="338" width="28" height="12" rx="6" fill="#86efac"/>
    <rect x="146" y="338" width="28" height="12" rx="6" fill="#86efac"/>
  </g>
  <!-- arm brackets -->
  <g stroke="#64748b" stroke-width="1.5" fill="none">
    <polyline points="104,92 98,92 98,160 104,160"/>
    <polyline points="104,180 98,180 98,348 104,348"/>
    <line x1="176" y1="96" x2="192" y2="96"/>
    <line x1="171" y1="170" x2="192" y2="170"/>
    <line x1="176" y1="344" x2="192" y2="344"/>
  </g>
  <text x="92" y="122" text-anchor="end" font-size="13" fill="#1f2937">p arm</text>
  <text x="92" y="138" text-anchor="end" font-size="12" fill="#1f2937">(short)</text>
  <text x="92" y="258" text-anchor="end" font-size="13" fill="#1f2937">q arm</text>
  <text x="92" y="274" text-anchor="end" font-size="12" fill="#1f2937">(long)</text>
  <text x="196" y="100" font-size="13" fill="#1f2937">telomere</text>
  <text x="196" y="174" font-size="13" fill="#1f2937">centromere</text>
  <text x="196" y="348" font-size="13" fill="#1f2937">telomere</text>
  <text x="143" y="376" text-anchor="middle" font-size="13" fill="#1f2937">two sister chromatids</text>
  <text x="143" y="392" text-anchor="middle" font-size="12" fill="#1f2937">(identical copies made in S phase)</text>

  <!-- Panel 2: homologous pair, one chromatid each -->
  <g stroke="#64748b" stroke-width="1.5">
    <rect x="362" y="90" width="28" height="62" rx="13" fill="#fbcfe8"/>
    <rect x="362" y="166" width="28" height="164" rx="13" fill="#fbcfe8"/>
    <rect x="370" y="148" width="12" height="22" fill="#fbcfe8"/>
    <ellipse cx="376" cy="159" rx="12" ry="6" fill="#fcd34d"/>
    <rect x="362" y="90" width="28" height="12" rx="6" fill="#86efac"/>
    <rect x="362" y="318" width="28" height="12" rx="6" fill="#86efac"/>
    <rect x="362" y="240" width="28" height="12" fill="#818cf8"/>

    <rect x="440" y="90" width="28" height="62" rx="13" fill="#bfdbfe"/>
    <rect x="440" y="166" width="28" height="164" rx="13" fill="#bfdbfe"/>
    <rect x="448" y="148" width="12" height="22" fill="#bfdbfe"/>
    <ellipse cx="454" cy="159" rx="12" ry="6" fill="#fcd34d"/>
    <rect x="440" y="90" width="28" height="12" rx="6" fill="#86efac"/>
    <rect x="440" y="318" width="28" height="12" rx="6" fill="#86efac"/>
    <rect x="440" y="240" width="28" height="12" fill="#818cf8"/>
  </g>
  <line x1="392" y1="246" x2="438" y2="246" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="354" y="251" text-anchor="end" font-size="15" font-weight="bold" fill="#1f2937">A</text>
  <text x="476" y="251" font-size="15" font-weight="bold" fill="#1f2937">a</text>
  <text x="376" y="352" text-anchor="middle" font-size="13" fill="#1f2937">maternal</text>
  <text x="454" y="352" text-anchor="middle" font-size="13" fill="#1f2937">paternal</text>
  <text x="415" y="376" text-anchor="middle" font-size="13" fill="#1f2937">same genes, same order;</text>
  <text x="415" y="392" text-anchor="middle" font-size="12" fill="#1f2937">at one locus, alleles A and a</text>

  <!-- Panel 3: X and Y with pseudoautosomal regions -->
  <g stroke="#64748b" stroke-width="1.5">
    <rect x="590" y="100" width="28" height="70" rx="13" fill="#fde68a"/>
    <rect x="590" y="184" width="28" height="146" rx="13" fill="#fde68a"/>
    <rect x="598" y="166" width="12" height="22" fill="#fde68a"/>
    <ellipse cx="604" cy="177" rx="12" ry="6" fill="#fcd34d"/>
    <rect x="590" y="100" width="28" height="16" rx="7" fill="#ddd6fe"/>
    <rect x="590" y="316" width="28" height="14" rx="7" fill="#ddd6fe"/>

    <rect x="662" y="196" width="28" height="24" rx="11" fill="#fed7aa"/>
    <rect x="662" y="234" width="28" height="68" rx="13" fill="#fed7aa"/>
    <rect x="670" y="216" width="12" height="22" fill="#fed7aa"/>
    <ellipse cx="676" cy="227" rx="12" ry="6" fill="#fcd34d"/>
    <rect x="662" y="196" width="28" height="12" rx="6" fill="#ddd6fe"/>
    <rect x="662" y="290" width="28" height="12" rx="6" fill="#ddd6fe"/>
  </g>
  <line x1="620" y1="108" x2="660" y2="202" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="620" y1="323" x2="660" y2="296" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="604" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">X</text>
  <text x="676" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Y</text>
  <text x="698" y="206" font-size="12" fill="#1f2937">PAR</text>
  <text x="698" y="300" font-size="12" fill="#1f2937">PAR</text>
  <text x="648" y="360" text-anchor="middle" font-size="12" fill="#1f2937">shaded tips: pseudoautosomal</text>
  <text x="648" y="376" text-anchor="middle" font-size="12" fill="#1f2937">regions shared by X and Y;</text>
  <text x="648" y="392" text-anchor="middle" font-size="12" fill="#1f2937">female XX, male XY</text>

  <!-- Legend -->
  <g font-size="12" fill="#1f2937" stroke="#64748b" stroke-width="1">
    <rect x="40" y="416" width="14" height="14" rx="3" fill="#86efac"/>
    <rect x="140" y="416" width="14" height="14" rx="3" fill="#fcd34d"/>
    <rect x="252" y="416" width="14" height="14" rx="3" fill="#818cf8"/>
    <rect x="336" y="416" width="14" height="14" rx="3" fill="#ddd6fe"/>
  </g>
  <g font-size="12" fill="#1f2937">
    <text x="60" y="428">telomere</text>
    <text x="160" y="428">centromere</text>
    <text x="272" y="428">locus</text>
    <text x="356" y="428">pseudoautosomal region</text>
    <text x="720" y="428" text-anchor="end">schematic, not to scale</text>
  </g>
</svg>
