<text x="400.0" y="205.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">O</text>
<text x="400" y="120" text-anchor="middle" font-size="13" fill="#1d4ed8">accepts 2 (lone pairs)</text>
<text x="400" y="300" text-anchor="middle" font-size="13" fill="#1d4ed8">donates 2 (its H atoms)</text>
<text x="400" y="324" text-anchor="middle" font-size="13" fill="#1f2937">Ice: 4 per molecule, open lattice</text>
<text x="400" y="342" text-anchor="middle" font-size="13" fill="#1f2937">Liquid: fewer on average, constantly</text>
<text x="400" y="358" text-anchor="middle" font-size="13" fill="#1f2937">breaking and re-forming</text>
<text x="665" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">3. Hydration of ions</text>
