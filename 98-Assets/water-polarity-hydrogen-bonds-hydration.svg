<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Water: a bent polar molecule, a hydrogen-bond network and a solvent for ions</title>
<desc id="d">Left: a water molecule, bent with an H-O-H angle of 104.5 degrees, partial negative charge on oxygen and partial positive charges on the hydrogens, two lone pairs, and a net dipole along the bisector. Middle: one water molecule donates two hydrogen bonds through its hydrogens and accepts two through its lone pairs, making up to four hydrogen bonds. Right: in solution, water molecules turn their oxygen toward a sodium cation and a hydrogen toward a chloride anion (ion-dipole hydration).</desc>
<rect x="3" y="3" width="794" height="394" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Water: bent, polar, hydrogen-bonded, a solvent for ions</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="#475569">Schematic, not to scale. Red: O. Grey: H. Dotted blue: hydrogen bond.</text>
<text x="140" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">1. Polar because bent</text>
<ellipse cx="120" cy="149" rx="9" ry="16" transform="rotate(-35 120 149)" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<ellipse cx="160" cy="149" rx="9" ry="16" transform="rotate(35 160 149)" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
