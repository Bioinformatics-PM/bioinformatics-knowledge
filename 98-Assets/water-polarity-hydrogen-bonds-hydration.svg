<path d="M 116.3 193.4 A 30 30 0 0 0 163.7 193.4" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="140.0" cy="175.0" r="16" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
<text x="140.0" y="180.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">O</text>
<circle cx="87.8" cy="215.4" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<circle cx="192.2" cy="215.4" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="140" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">104.5°</text>
<text x="180" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">δ−</text>
<text x="69.81448813290635" y="233.40634048227366" text-anchor="middle" font-size="15" font-weight="bold" fill="#475569">δ+</text>
<text x="210.18551186709365" y="233.40634048227366" text-anchor="middle" font-size="15" font-weight="bold" fill="#475569">δ+</text>
<text x="78" y="141" text-anchor="middle" font-size="12" fill="#92400e">lone pairs</text>
<line x1="232" y1="245" x2="232" y2="165" stroke="#7c3aed" stroke-width="3"/>
<polygon points="232,155 225,169 239,169" fill="#7c3aed"/>
<text x="232" y="263" text-anchor="middle" font-size="12" fill="#6d28d9">net dipole</text>
<text x="140" y="300" text-anchor="middle" font-size="13" fill="#1f2937">Two polar O–H bonds at an angle:</text>
<text x="140" y="318" text-anchor="middle" font-size="13" fill="#1f2937">their dipoles add, they do not cancel</text>
<text x="140" y="336" text-anchor="middle" font-size="13" fill="#475569">(linear CO₂: they cancel)</text>
<text x="400" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">2. Up to 4 hydrogen bonds</text>
