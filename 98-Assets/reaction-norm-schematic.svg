<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="718" height="428" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="360.0" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Norms of reaction: one line per genotype across environments</text>
  <text x="360.0" y="54" text-anchor="middle" font-size="12" fill="#1f2937">Schematic with invented values: non-parallel lines are a genotype-by-environment interaction</text>
  <line x1="110" y1="330.0" x2="500" y2="330.0" stroke="#e2e8f0" stroke-width="1"/>
  <text x="102" y="334.0" text-anchor="end" font-size="12" fill="#1f2937">0</text>
  <line x1="110" y1="267.5" x2="500" y2="267.5" stroke="#e2e8f0" stroke-width="1"/>
  <text x="102" y="271.5" text-anchor="end" font-size="12" fill="#1f2937">25</text>
  <line x1="110" y1="205.0" x2="500" y2="205.0" stroke="#e2e8f0" stroke-width="1"/>
  <text x="102" y="209.0" text-anchor="end" font-size="12" fill="#1f2937">50</text>
  <line x1="110" y1="142.5" x2="500" y2="142.5" stroke="#e2e8f0" stroke-width="1"/>
  <text x="102" y="146.5" text-anchor="end" font-size="12" fill="#1f2937">75</text>
  <line x1="110" y1="80.0" x2="500" y2="80.0" stroke="#e2e8f0" stroke-width="1"/>
  <text x="102" y="84.0" text-anchor="end" font-size="12" fill="#1f2937">100</text>
  <line x1="110" y1="330" x2="500" y2="330" stroke="#64748b" stroke-width="1.5"/>
  <line x1="110" y1="80" x2="110" y2="330" stroke="#64748b" stroke-width="1.5"/>
  <text x="150.0" y="350" text-anchor="middle" font-size="12" fill="#1f2937">low</text>
  <text x="305.0" y="350" text-anchor="middle" font-size="12" fill="#1f2937">medium</text>
  <text x="460.0" y="350" text-anchor="middle" font-size="12" fill="#1f2937">high</text>
  <text x="305.0" y="372" text-anchor="middle" font-size="13" fill="#1f2937">environment (for example rearing temperature)</text>
  <text x="66" y="205.0" text-anchor="middle" font-size="13" fill="#1f2937" transform="rotate(-90 66 205.0)">phenotype (arbitrary units)</text>
  <polyline points="150.0,255.0 305.0,205.0 460.0,155.0" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="150.0" cy="255.0" r="5" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="305.0" cy="205.0" r="5" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="460.0" cy="155.0" r="5" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/>
  <polyline points="150.0,217.5 305.0,205.0 460.0,192.5" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="150.0" cy="217.5" r="5" fill="#f8fafc" stroke="#059669" stroke-width="2.5"/>
  <circle cx="305.0" cy="205.0" r="5" fill="#f8fafc" stroke="#059669" stroke-width="2.5"/>
  <circle cx="460.0" cy="192.5" r="5" fill="#f8fafc" stroke="#059669" stroke-width="2.5"/>
  <polyline points="150.0,150.0 305.0,200.0 460.0,250.0" fill="none" stroke="#db2777" stroke-width="3" stroke-dasharray="2 3"/>
  <circle cx="150.0" cy="150.0" r="5" fill="#f8fafc" stroke="#db2777" stroke-width="2.5"/>
  <circle cx="305.0" cy="200.0" r="5" fill="#f8fafc" stroke="#db2777" stroke-width="2.5"/>
  <circle cx="460.0" cy="250.0" r="5" fill="#f8fafc" stroke="#db2777" stroke-width="2.5"/>
  <line x1="522" y1="110" x2="556" y2="110" stroke="#2563eb" stroke-width="3"/>
  <text x="564" y="114" font-size="12" fill="#1f2937">genotype 1</text>
  <line x1="522" y1="136" x2="556" y2="136" stroke="#059669" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="564" y="140" font-size="12" fill="#1f2937">genotype 2</text>
  <line x1="522" y1="162" x2="556" y2="162" stroke="#db2777" stroke-width="3" stroke-dasharray="2 3"/>
  <text x="564" y="166" font-size="12" fill="#1f2937">genotype 3</text>
  <text x="522" y="215" font-size="12" fill="#1f2937" font-weight="bold" xml:space="preserve">Reading the plot:</text>
  <text x="522" y="233" font-size="12" fill="#1f2937" xml:space="preserve">- the ranking of genotypes</text>
  <text x="522" y="251" font-size="12" fill="#1f2937" xml:space="preserve">  changes with the environment;</text>
  <text x="522" y="269" font-size="12" fill="#1f2937" xml:space="preserve">- genotype 2 barely changes</text>
  <text x="522" y="287" font-size="12" fill="#1f2937" xml:space="preserve">  (little plasticity);</text>
  <text x="522" y="305" font-size="12" fill="#1f2937" xml:space="preserve">- the phenotype of a genotype</text>
  <text x="522" y="323" font-size="12" fill="#1f2937" xml:space="preserve">  is a line, not a single value.</text>
</svg>
