<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect x="0" y="0" width="720" height="330" rx="16" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Fischer projection: from a 3D stereocenter to a flat cross</text>

  <!-- Panel A: wedge-dash view of D-glyceraldehyde -->
  <rect x="20" y="48" width="220" height="230" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="130" y="70" text-anchor="middle" font-size="14" fill="#1f2937">3D view (wedge-dash)</text>
  <line x1="130" y1="155" x2="130" y2="105" stroke="#475569" stroke-width="2.5" stroke-dasharray="4 3"/>
  <line x1="130" y1="175" x2="130" y2="225" stroke="#475569" stroke-width="2.5" stroke-dasharray="4 3"/>
  <polygon points="120,165 72,158 72,172" fill="#475569"/>
  <polygon points="140,165 188,158 188,172" fill="#475569"/>
  <text x="130" y="170" text-anchor="middle" font-weight="bold" fill="#1f2937">C</text>
  <text x="130" y="98" text-anchor="middle" fill="#1f2937">CHO</text>
  <text x="130" y="244" text-anchor="middle" fill="#1f2937">CH₂OH</text>
  <text x="60" y="170" text-anchor="middle" fill="#1f2937">H</text>
  <text x="205" y="170" text-anchor="middle" fill="#1f2937">OH</text>
  <text x="130" y="266" text-anchor="middle" font-size="12" fill="#334155">wedges: toward you; dashes: away</text>

  <text x="262" y="170" text-anchor="middle" font-size="26" fill="#475569">=</text>

  <!-- Panel B: Fischer cross of D-glyceraldehyde -->
  <rect x="285" y="48" width="200" height="230" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="385" y="70" text-anchor="middle" font-size="14" fill="#1f2937">Fischer projection</text>
  <line x1="385" y1="105" x2="385" y2="225" stroke="#475569" stroke-width="2.5"/>
  <line x1="325" y1="165" x2="445" y2="165" stroke="#475569" stroke-width="2.5"/>
  <text x="385" y="98" text-anchor="middle" fill="#1f2937">CHO</text>
  <text x="385" y="244" text-anchor="middle" fill="#1f2937">CH₂OH</text>
  <text x="312" y="170" text-anchor="middle" fill="#1f2937">H</text>
  <ellipse cx="462" cy="165" rx="18" ry="13" fill="#fde68a" stroke="#d97706"/>
  <text x="462" y="170" text-anchor="middle" font-weight="bold" fill="#1f2937">OH</text>
  <text x="385" y="266" text-anchor="middle" font-size="13" fill="#1f2937">D-glyceraldehyde (R): OH right</text>

  <!-- Panel C: Fischer cross of L-alanine -->
  <rect x="500" y="48" width="200" height="230" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#1f2937">Same convention, amino acid</text>
  <line x1="600" y1="105" x2="600" y2="225" stroke="#475569" stroke-width="2.5"/>
  <line x1="545" y1="165" x2="655" y2="165" stroke="#475569" stroke-width="2.5"/>
  <text x="600" y="98" text-anchor="middle" fill="#1f2937">COO</text>
  <text x="622" y="90" font-size="13" fill="#1f2937">−</text>
  <text x="600" y="244" text-anchor="middle" fill="#1f2937">CH₃ (side chain)</text>
  <ellipse cx="525" cy="165" rx="22" ry="13" fill="#fde68a" stroke="#d97706"/>
  <text x="522" y="170" text-anchor="middle" font-weight="bold" fill="#1f2937">H₃N</text>
  <text x="538" y="161" font-size="12" font-weight="bold" fill="#1f2937">+</text>
  <text x="670" y="170" text-anchor="middle" fill="#1f2937">H</text>
  <text x="600" y="266" text-anchor="middle" font-size="13" fill="#1f2937">L-alanine (S): amino group left</text>

  <text x="360" y="304" text-anchor="middle" font-size="13" fill="#334155">Rule: carbon chain vertical, most oxidized carbon (C1) at top; each crossing is a stereocenter.</text>
  <text x="360" y="321" text-anchor="middle" font-size="13" fill="#334155">D or L is read at the stereocenter farthest from C1 (sugars) or at Cα (amino acids).</text>
</svg>
