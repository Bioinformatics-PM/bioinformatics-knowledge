<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Helvetica, Arial, sans-serif">
  <title>Symmetry of protein assemblies and the asymmetric unit versus the biological assembly of a PDB entry</title>
  <rect x="2" y="2" width="796" height="466" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Quaternary structure: identical subunits related by rotations</text>

  <!-- Panel 1: C2 -->
  <rect x="15" y="48" width="185" height="232" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="107" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">C2 dimer</text>
  <ellipse cx="80" cy="165" rx="26" ry="44" fill="#c4b5fd" stroke="#5b21b6" stroke-width="1.5"/>
  <ellipse cx="134" cy="165" rx="26" ry="44" fill="#c4b5fd" stroke="#5b21b6" stroke-width="1.5"/>
  <circle cx="80" cy="130" r="6" fill="#475569"/>
  <circle cx="134" cy="200" r="6" fill="#475569"/>
  <circle cx="101" cy="152" r="6" fill="#f472b6" stroke="#9d174d"/>
  <circle cx="113" cy="178" r="6" fill="#f472b6" stroke="#9d174d"/>
  <ellipse cx="107" cy="165" rx="5" ry="9" fill="#1f2937"/>
  <text x="107" y="233" text-anchor="middle" font-size="12" fill="#1f2937">180° about the axis (●)</text>
  <text x="107" y="250" text-anchor="middle" font-size="12" fill="#1f2937">isologous: the same patch</text>
  <text x="107" y="266" text-anchor="middle" font-size="12" fill="#1f2937">on both sides (pink)</text>

  <!-- Panel 2: C3 -->
  <rect x="210" y="48" width="185" height="232" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="302" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">C3 trimer</text>
  <g fill="#7dd3fc" stroke="#075985" stroke-width="1.5">
    <ellipse cx="302" cy="131" rx="21" ry="31"/>
    <ellipse cx="268" cy="190" rx="21" ry="31" transform="rotate(-120 268 190)"/>
    <ellipse cx="336" cy="190" rx="21" ry="31" transform="rotate(120 336 190)"/>
  </g>
  <g stroke="#1f2937" stroke-width="1">
    <circle cx="282" cy="150" r="5" fill="#f87171"/><circle cx="276" cy="162" r="5" fill="#60a5fa"/>
    <circle cx="296" cy="205" r="5" fill="#f87171"/><circle cx="309" cy="205" r="5" fill="#60a5fa"/>
    <circle cx="328" cy="162" r="5" fill="#f87171"/><circle cx="322" cy="150" r="5" fill="#60a5fa"/>
  </g>
  <polygon points="302,160 309,173 295,173" fill="#1f2937"/>
  <text x="302" y="240" text-anchor="middle" font-size="12" fill="#1f2937">120° about the axis (▲)</text>
  <text x="302" y="257" text-anchor="middle" font-size="12" fill="#1f2937">heterologous: patch A (red)</text>
  <text x="302" y="273" text-anchor="middle" font-size="12" fill="#1f2937">meets patch B (blue)</text>

  <!-- Panel 3: hemoglobin alpha2 beta2 -->
  <rect x="405" y="48" width="185" height="232" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="497" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">α₂β₂ (hemoglobin)</text>
  <line x1="420" y1="165" x2="575" y2="165" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="497" y1="88" x2="497" y2="226" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g stroke-width="1.5">
    <rect x="440" y="104" width="50" height="52" rx="16" fill="#fbcfe8" stroke="#9d174d"/>
    <rect x="504" y="104" width="50" height="52" rx="16" fill="#bfdbfe" stroke="#1e40af"/>
    <rect x="440" y="174" width="50" height="52" rx="16" fill="#bfdbfe" stroke="#1e40af"/>
    <rect x="504" y="174" width="50" height="52" rx="16" fill="#fbcfe8" stroke="#9d174d"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">
    <text x="465" y="135">α1</text><text x="529" y="135">β1</text><text x="465" y="205">β2</text><text x="529" y="205">α2</text>
  </g>
  <ellipse cx="497" cy="165" rx="5" ry="9" fill="#1f2937"/>
  <text x="497" y="245" text-anchor="middle" font-size="12" fill="#1f2937">● exact 2-fold: α1β1 ↔ α2β2</text>
  <text x="497" y="262" text-anchor="middle" font-size="12" fill="#1f2937">dashed: pseudo 2-folds,</text>
  <text x="497" y="276" text-anchor="middle" font-size="12" fill="#1f2937">as α and β are similar</text>

  <!-- Panel 4: icosahedral -->
  <rect x="600" y="48" width="185" height="232" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="692" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Icosahedral shell</text>
  <g fill="#bbf7d0" stroke="#166534" stroke-width="1.2">
    <polygon points="692,170 692.0,112.0 636.8,152.1"/>
    <polygon points="692,170 636.8,152.1 657.9,216.9"/>
    <polygon points="692,170 657.9,216.9 726.1,216.9"/>
    <polygon points="692,170 726.1,216.9 747.2,152.1"/>
    <polygon points="692,170 747.2,152.1 692.0,112.0"/>
  </g>
  <g fill="#f0fdf4" stroke="#166534" stroke-width="1.2">
    <polygon points="692.0,112.0 657.9,123.1 636.8,152.1"/>
    <polygon points="636.8,152.1 636.8,187.9 657.9,216.9"/>
    <polygon points="657.9,216.9 692.0,228.0 726.1,216.9"/>
    <polygon points="726.1,216.9 747.2,187.9 747.2,152.1"/>
    <polygon points="747.2,152.1 726.1,123.1 692.0,112.0"/>
  </g>
  <g fill="#16a34a">
    <circle cx="679.7" cy="153.1" r="4"/><circle cx="679.7" cy="133.8" r="4"/><circle cx="661.4" cy="147.2" r="4"/>
    <circle cx="672.2" cy="176.4" r="4"/><circle cx="653.8" cy="170.5" r="4"/><circle cx="660.8" cy="192.1" r="4"/>
    <circle cx="692.0" cy="190.9" r="4"/><circle cx="680.6" cy="206.5" r="4"/><circle cx="703.4" cy="206.5" r="4"/>
    <circle cx="711.8" cy="176.4" r="4"/><circle cx="723.2" cy="192.1" r="4"/><circle cx="730.2" cy="170.5" r="4"/>
    <circle cx="704.3" cy="153.1" r="4"/><circle cx="722.6" cy="147.2" r="4"/><circle cx="704.3" cy="133.8" r="4"/>
  </g>
  <polygon points="692,163 699,168 696,176 688,176 685,168" fill="#1f2937"/>
  <text x="692" y="250" text-anchor="middle" font-size="12" fill="#1f2937">20 faces × 3 = 60 positions</text>
  <text x="692" y="266" text-anchor="middle" font-size="12" fill="#1f2937">5-fold axis at the center (⬟)</text>

  <!-- Row 2: asymmetric unit versus biological assembly -->
  <rect x="15" y="292" width="770" height="160" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="30" y="315" font-size="15" font-weight="bold" fill="#1f2937">A PDB entry: deposited coordinates versus biological assembly</text>
  <text x="145" y="342" text-anchor="middle" font-size="13" fill="#1f2937">asymmetric unit (deposited)</text>
  <g stroke-width="1.5">
    <rect x="95" y="355" width="46" height="46" rx="14" fill="#fbcfe8" stroke="#9d174d"/>
    <rect x="150" y="355" width="46" height="46" rx="14" fill="#bfdbfe" stroke="#1e40af"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937"><text x="118" y="383">α</text><text x="173" y="383">β</text></g>
  <line x1="235" y1="378" x2="420" y2="378" stroke="#475569" stroke-width="2.5"/>
  <polygon points="420,370 436,378 420,386" fill="#475569"/>
  <text x="330" y="365" text-anchor="middle" font-size="12" fill="#1f2937">apply the symmetry operation</text>
  <text x="330" y="398" text-anchor="middle" font-size="12" fill="#1f2937">stored in the entry (a 2-fold)</text>
  <text x="510" y="342" text-anchor="middle" font-size="13" fill="#1f2937">biological assembly</text>
  <g stroke-width="1.5">
    <rect x="462" y="350" width="44" height="40" rx="12" fill="#fbcfe8" stroke="#9d174d"/>
    <rect x="512" y="350" width="44" height="40" rx="12" fill="#bfdbfe" stroke="#1e40af"/>
    <rect x="462" y="396" width="44" height="40" rx="12" fill="#bfdbfe" stroke="#1e40af"/>
    <rect x="512" y="396" width="44" height="40" rx="12" fill="#fbcfe8" stroke="#9d174d"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">
    <text x="484" y="375">α</text><text x="534" y="375">β</text><text x="484" y="421">β</text><text x="534" y="421">α</text>
  </g>
  <text x="585" y="360" font-size="12" fill="#1f2937">Hemoglobin entries hold 2 chains</text>
  <text x="585" y="377" font-size="12" fill="#1f2937">(half a tetramer) in some cases,</text>
  <text x="585" y="394" font-size="12" fill="#1f2937">8 or more (several tetramers)</text>
  <text x="585" y="411" font-size="12" fill="#1f2937">in others: analyze the assembly,</text>
  <text x="585" y="428" font-size="12" fill="#1f2937">not the deposited file.</text>
</svg>
