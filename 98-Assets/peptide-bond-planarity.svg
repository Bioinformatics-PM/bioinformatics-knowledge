<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Helvetica, Arial, sans-serif">
  <title>Planarity of the peptide bond</title>
  <rect x="2" y="2" width="756" height="466" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">The peptide bond: a rigid, planar unit between two Cα atoms</text>

  <!-- amide plane -->
  <polygon points="95,125 455,95 475,330 115,355" fill="#dbeafe" fill-opacity="0.75" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="100" y="112" font-size="13" font-style="italic" fill="#1d4ed8">amide plane</text>

  <!-- bonds -->
  <g stroke="#475569" stroke-width="3" stroke-linecap="round">
    <line x1="55" y1="200" x2="140" y2="245"/>
    <line x1="140" y1="245" x2="235" y2="200"/>
    <line x1="230" y1="200" x2="230" y2="135"/>
    <line x1="241" y1="200" x2="241" y2="135"/>
    <line x1="335" y1="245" x2="335" y2="305"/>
    <line x1="335" y1="245" x2="430" y2="200"/>
    <line x1="430" y1="200" x2="520" y2="245"/>
  </g>
  <!-- peptide bond: thick line plus dashed line for partial double-bond character -->
  <line x1="235" y1="200" x2="335" y2="245" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round"/>
  <line x1="240" y1="190" x2="333" y2="232" stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="6 5"/>
  <!-- side chains, out of the plane -->
  <g stroke="#a16207" stroke-width="3" stroke-dasharray="4 4">
    <line x1="140" y1="245" x2="68" y2="296"/>
    <line x1="430" y1="200" x2="500" y2="148"/>
  </g>

  <!-- atoms -->
  <circle cx="55" cy="200" r="17" fill="#e0e7ff" stroke="#64748b" stroke-width="2"/>
  <text x="55" y="205" text-anchor="middle" font-size="14" fill="#1f2937">N</text>
  <circle cx="140" cy="245" r="20" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="140" y="250" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Cα</text>
  <text x="165" y="275" font-size="13" fill="#475569">residue i</text>
  <circle cx="235" cy="200" r="18" fill="#e5e7eb" stroke="#475569" stroke-width="2"/>
  <text x="235" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">C</text>
  <circle cx="235" cy="135" r="18" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <text x="235" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">O</text>
  <circle cx="335" cy="245" r="18" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="335" y="250" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">N</text>
  <circle cx="335" cy="305" r="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="335" y="310" text-anchor="middle" font-size="14" fill="#1f2937">H</text>
  <circle cx="430" cy="200" r="20" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="430" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Cα</text>
  <text x="395" y="264" font-size="13" fill="#475569">residue i+1</text>
  <circle cx="520" cy="245" r="17" fill="#e5e7eb" stroke="#64748b" stroke-width="2"/>
  <text x="520" y="250" text-anchor="middle" font-size="14" fill="#1f2937">C</text>
  <circle cx="68" cy="296" r="15" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
  <text x="68" y="301" text-anchor="middle" font-size="14" fill="#1f2937">R</text>
  <circle cx="500" cy="148" r="15" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
  <text x="500" y="153" text-anchor="middle" font-size="14" fill="#1f2937">R</text>

  <!-- labels on bonds -->
  <text x="262" y="174" font-size="13" font-weight="bold" fill="#1e3a8a">peptide bond, 1.32 Å</text>
  <ellipse cx="187" cy="222" rx="7" ry="15" fill="none" stroke="#b45309" stroke-width="2" transform="rotate(-25 187 222)"/>
  <text x="166" y="206" font-size="16" font-weight="bold" fill="#b45309">ψ</text>
  <ellipse cx="382" cy="222" rx="7" ry="15" fill="none" stroke="#b45309" stroke-width="2" transform="rotate(-25 382 222)"/>
  <text x="357" y="206" font-size="16" font-weight="bold" fill="#b45309">φ</text>

  <!-- right panel: why planar -->
  <text x="560" y="88" font-size="15" font-weight="bold" fill="#1f2937">Why planar?</text>
  <text x="560" y="118" font-size="16" font-family="Menlo, Consolas, monospace" fill="#1f2937">O=C–N–H</text>
  <text x="560" y="142" font-size="13" fill="#475569">and its resonance form</text>
  <text x="560" y="168" font-size="16" font-family="Menlo, Consolas, monospace" fill="#1f2937">O⁻–C=N⁺–H</text>
  <text x="560" y="194" font-size="13" fill="#475569">partial double bond</text>
  <rect x="560" y="210" width="149" height="22" rx="4" fill="#e2e8f0"/>
  <text x="566" y="226" font-size="12" fill="#1f2937">C–N single 1.49 Å</text>
  <rect x="560" y="238" width="132" height="22" rx="4" fill="#bfdbfe"/>
  <text x="566" y="254" font-size="12" font-weight="bold" fill="#1f2937">peptide C–N 1.32 Å</text>
  <rect x="560" y="266" width="127" height="22" rx="4" fill="#e2e8f0"/>
  <text x="566" y="282" font-size="12" fill="#1f2937">C=N double 1.27 Å</text>
  <text x="560" y="318" font-size="13" fill="#1f2937">trans : cis ≈ 1000 : 1</text>
  <text x="560" y="338" font-size="13" fill="#1f2937">X–Pro bonds: cis</text>
  <text x="560" y="356" font-size="13" fill="#1f2937">much more often</text>

  <!-- caption -->
  <text x="40" y="398" font-size="14" fill="#1f2937">Six atoms (Cα, C, O, N, H, Cα) lie in one plane: rotation about the peptide bond (ω) is blocked.</text>
  <text x="40" y="422" font-size="14" fill="#1f2937">The chain turns only at the Cα atoms, through φ (N–Cα) and ψ (Cα–C): two angles per residue.</text>
  <text x="40" y="446" font-size="13" fill="#1f2937">Trans form shown: the two Cα lie on opposite sides of the peptide bond; side chains (R) leave the plane.</text>
</svg>
