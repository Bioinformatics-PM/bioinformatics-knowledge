<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="suc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fefce8"/><stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="cscl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="756" height="416" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Gradient centrifugation: separate by sedimentation rate or by density</text>
  <text x="170" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">(a) rate-zonal, sucrose gradient</text>
  <text x="560" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">(b) isopycnic, CsCl gradient</text>
  <text x="560" y="81" text-anchor="middle" font-size="12" fill="#475569">DNA bands after 0, 1, 2 generations in ¹⁴N (Meselson-Stahl)</text>
  <line x1="372" y1="50" x2="372" y2="402" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="28" y1="130" x2="28" y2="300" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
  <text x="18" y="215" text-anchor="middle" font-size="12" fill="#1f2937" transform="rotate(-90 18 215)">outward (centrifugal)</text>
  <path d="M70,108 L70,318 A23.0,23.0 0 0 0 116,318 L116,108 Z" fill="url(#suc)" stroke="#64748b" stroke-width="1.8"/><line x1="66" y1="108" x2="120" y2="108" stroke="#64748b" stroke-width="2"/><path d="M190,108 L190,318 A23.0,23.0 0 0 0 236,318 L236,108 Z" fill="url(#suc)" stroke="#64748b" stroke-width="1.8"/><line x1="186" y1="108" x2="240" y2="108" stroke="#64748b" stroke-width="2"/><rect x="74" y="115.5" width="38" height="9" rx="3" fill="#f472b6" stroke="#1f2937" stroke-width="0.8"/><rect x="194" y="146.5" width="38" height="7" rx="3" fill="#f472b6" stroke="#1f2937" stroke-width="0.8"/><rect x="194" y="201.5" width="38" height="7" rx="3" fill="#c084fc" stroke="#1f2937" stroke-width="0.8"/><rect x="194" y="264.5" width="38" height="7" rx="3" fill="#818cf8" stroke="#1f2937" stroke-width="0.8"/><text x="93.0" y="98" text-anchor="middle" font-size="13" fill="#1f2937">start</text><text x="213.0" y="98" text-anchor="middle" font-size="13" fill="#1f2937">after the run</text><text x="244" y="155" font-size="13" fill="#1f2937">small s</text><text x="244" y="210" font-size="13" fill="#1f2937">medium s</text><text x="244" y="273" font-size="13" fill="#1f2937">large s</text><text x="62" y="125" text-anchor="end" font-size="12" fill="#1f2937">sample</text><text x="62" y="139" text-anchor="end" font-size="12" fill="#1f2937">layer</text><path d="M420,108 L420,318 A23.0,23.0 0 0 0 466,318 L466,108 Z" fill="url(#cscl)" stroke="#64748b" stroke-width="1.8"/><line x1="416" y1="108" x2="470" y2="108" stroke="#64748b" stroke-width="2"/><text x="443.0" y="100" text-anchor="middle" font-size="13" fill="#1f2937">gen 0</text><path d="M510,108 L510,318 A23.0,23.0 0 0 0 556,318 L556,108 Z" fill="url(#cscl)" stroke="#64748b" stroke-width="1.8"/><line x1="506" y1="108" x2="560" y2="108" stroke="#64748b" stroke-width="2"/><text x="533.0" y="100" text-anchor="middle" font-size="13" fill="#1f2937">gen 1</text><path d="M600,108 L600,318 A23.0,23.0 0 0 0 646,318 L646,108 Z" fill="url(#cscl)" stroke="#64748b" stroke-width="1.8"/><line x1="596" y1="108" x2="650" y2="108" stroke="#64748b" stroke-width="2"/><text x="623.0" y="100" text-anchor="middle" font-size="13" fill="#1f2937">gen 2</text><rect x="424" y="252.5" width="38" height="7" rx="3" fill="#7c3aed" stroke="#1f2937" stroke-width="0.8"/><rect x="514" y="222.5" width="38" height="7" rx="3" fill="#a78bfa" stroke="#1f2937" stroke-width="0.8"/><rect x="604" y="222.5" width="38" height="7" rx="3" fill="#a78bfa" stroke="#1f2937" stroke-width="0.8"/><rect x="604" y="192.5" width="38" height="7" rx="3" fill="#ddd6fe" stroke="#1f2937" stroke-width="0.8"/><line x1="414" y1="196" x2="652" y2="196" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/><text x="658" y="201" font-size="13" fill="#1f2937">light ¹⁴N/¹⁴N</text><line x1="414" y1="226" x2="652" y2="226" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/><text x="658" y="231" font-size="13" fill="#1f2937">hybrid ¹⁵N/¹⁴N</text><line x1="414" y1="256" x2="652" y2="256" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/><text x="658" y="261" font-size="13" fill="#1f2937">heavy ¹⁵N/¹⁵N</text>
  <text x="170" y="370" text-anchor="middle" font-size="13" fill="#1f2937">Bands move at speeds set by s;</text>
  <text x="170" y="388" text-anchor="middle" font-size="13" fill="#1f2937">stop the run before they reach the bottom.</text>
  <text x="560" y="370" text-anchor="middle" font-size="13" fill="#1f2937">Each band rests where the medium is as dense as it is,</text>
  <text x="560" y="388" text-anchor="middle" font-size="13" fill="#1f2937">whatever the size of the molecules. Density rises downward.</text>
</svg>
