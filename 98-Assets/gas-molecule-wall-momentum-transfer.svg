<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="756" height="356" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Gas pressure as momentum delivered to a wall</text>
  <!-- box -->
  <rect x="60" y="70" width="400" height="200" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <rect x="460" y="70" width="14" height="200" fill="#cbd5e1" stroke="#64748b"/>
  <text x="482" y="64" font-size="13" fill="#1f2937">wall, area A</text>
  <line x1="60" y1="292" x2="460" y2="292" stroke="#475569" stroke-width="1.5" marker-start="url(#ma)" marker-end="url(#ma)"/>
  <text x="260" y="312" text-anchor="middle" font-size="14" fill="#1f2937">L</text>
  <!-- incoming molecule -->
  <circle cx="330" cy="120" r="10" fill="#fca5a5" stroke="#dc2626"/>
  <line x1="342" y1="126" x2="440" y2="166" stroke="#1f2937" stroke-width="2" marker-end="url(#ma)"/>
  <text x="300" y="104" font-size="13" fill="#1f2937">before: (v_x, v_y)</text>
  <!-- outgoing molecule -->
  <circle cx="330" cy="230" r="10" fill="#fca5a5" stroke="#dc2626"/>
  <line x1="440" y1="180" x2="344" y2="224" stroke="#1f2937" stroke-width="2" marker-end="url(#ma)"/>
  <text x="270" y="256" font-size="13" fill="#1f2937">after: (−v_x, v_y)</text>
  <!-- impulse on wall -->
  <line x1="478" y1="172" x2="540" y2="172" stroke="#b45309" stroke-width="3" marker-end="url(#ma)"/>
  <text x="548" y="168" font-size="13" fill="#b45309">impulse on wall</text>
  <text x="548" y="186" font-size="13" fill="#b45309">+2 m v_x</text>
  <!-- right-hand derivation -->
  <g font-size="14" fill="#1f2937">
    <text x="510" y="226">Δp (molecule) = −2 m v_x</text>
    <text x="510" y="250">time between hits = 2L / v_x</text>
    <text x="510" y="274">mean force = m v_x² / L</text>
    <text x="510" y="298">sum over N molecules:</text>
    <text x="510" y="322">P = N m ⟨v_x²⟩ / (A L)</text>
  </g>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#475569">Smooth elastic wall: only the normal component v_x reverses.</text>
</svg>
