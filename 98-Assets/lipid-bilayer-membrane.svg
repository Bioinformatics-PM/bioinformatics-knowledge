<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The plasma membrane: lipid bilayer, membrane proteins and selective permeability</title>
<desc id="d">Left: a phospholipid bilayer with hydrophilic heads facing water on both sides and hydrophobic tails forming the core. A single-pass transmembrane protein carries a sugar chain on its outer domain, a multipass protein forms a channel, a peripheral protein sits on the inner surface, cholesterol lies among the tails and a glycolipid carries sugars outside. Right: relative permeability of a protein-free bilayer: small nonpolar molecules such as O2 and CO2 cross fast, small polar molecules such as water slowly, large polar molecules such as glucose very slowly, and ions essentially not at all.</desc>
<rect x="1" y="1" width="918" height="478" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" font-weight="bold" fill="#1f2937">The plasma membrane: a lipid bilayer with proteins (schematic)</text>
<text x="24" y="56" font-size="13" fill="#374151">Fluid mosaic: proteins and cholesterol move within a two-layer sheet of phospholipids.</text>
<text x="40" y="92" font-size="13" font-style="italic" fill="#374151">outside the cell (water)</text>
<text x="40" y="440" font-size="13" font-style="italic" fill="#374151">cytosol (water)</text>
