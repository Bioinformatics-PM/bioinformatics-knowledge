<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="458" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">The three-domain tree of life (simplified, rooted)</text>

  <!-- domain labels -->
  <text x="200" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">Bacteria</text>
  <text x="200" y="80" text-anchor="middle" font-size="12" fill="#1f2937">no nucleus</text>
  <text x="445" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">Archaea</text>
  <text x="445" y="80" text-anchor="middle" font-size="12" fill="#1f2937">no nucleus</text>
  <text x="660" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">Eukarya</text>
  <text x="660" y="80" text-anchor="middle" font-size="12" fill="#1f2937">nucleus, organelles</text>

  <!-- vertical descent: stems and twigs -->
  <g stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 400,400 L 200,220" stroke="#60a5fa"/>
    <path d="M 200,220 L 110,100 M 200,220 L 200,100 M 200,220 L 290,100" stroke="#60a5fa"/>
    <path d="M 400,400 L 540,290" stroke="#94a3b8"/>
    <path d="M 540,290 L 450,200 M 450,200 L 400,100 M 450,200 L 490,100" stroke="#34d399"/>
    <path d="M 540,290 L 640,200 M 640,200 L 590,100 M 640,200 L 660,100 M 640,200 L 730,100" stroke="#fbbf24"/>
  </g>
  <circle cx="400" cy="400" r="7" fill="#64748b"/>
  <text x="400" y="428" text-anchor="middle" font-size="13" fill="#1f2937">universal common ancestor (root)</text>

  <!-- horizontal gene transfer between lineages -->
  <path d="M 262,140 Q 340,175 418,140" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="340" y="120" text-anchor="middle" font-size="12" fill="#1f2937">horizontal</text>
  <text x="340" y="135" text-anchor="middle" font-size="12" fill="#1f2937">gene transfer</text>

  <!-- endosymbiosis: bacterial lineages enter eukaryotic cells -->
  <path d="M 225,190 C 330,300 560,290 630,212" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="400" y="300" text-anchor="middle" font-size="12" fill="#1f2937">endosymbiosis</text>
  <text x="400" y="316" text-anchor="middle" font-size="12" fill="#1f2937">(mitochondria, plastids)</text>

  <!-- legend -->
  <line x1="30" y1="372" x2="70" y2="372" stroke="#94a3b8" stroke-width="4"/>
  <text x="78" y="376" font-size="12" fill="#1f2937">vertical descent</text>
  <line x1="30" y1="396" x2="70" y2="396" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="78" y="400" font-size="12" fill="#1f2937">genes crossing lineages</text>
</svg>
