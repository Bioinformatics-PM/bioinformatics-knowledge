<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="Helvetica, Arial, sans-serif">
<title>Four values in memory: a Python list of int objects, an array of 32-bit integers, and DNA packed at 2 bits per base</title>
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="388" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="380" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">Four values in memory: boxed Python objects versus packed storage</text>
<text x="30" y="62" font-size="13" fill="#1f2937">Python list of 4 positions: 56 + 4 × 8 + 4 × 28 = 200 bytes (toy values)</text>
<rect x="30" y="74" width="110" height="42" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="85.0" y="91.5" font-size="12" text-anchor="middle" fill="#1f2937">list header</text>
<text x="85.0" y="106.5" font-size="12" text-anchor="middle" fill="#1f2937">56 B</text>
<rect x="140" y="74" width="56" height="42" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="168.0" y="91.5" font-size="12" text-anchor="middle" fill="#1f2937">pointer</text>
<text x="168.0" y="106.5" font-size="12" text-anchor="middle" fill="#1f2937">8 B</text>
<rect x="196" y="74" width="56" height="42" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="224.0" y="91.5" font-size="12" text-anchor="middle" fill="#1f2937">pointer</text>
<text x="224.0" y="106.5" font-size="12" text-anchor="middle" fill="#1f2937">8 B</text>
<rect x="252" y="74" width="56" height="42" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="280.0" y="91.5" font-size="12" text-anchor="middle" fill="#1f2937">pointer</text>
<text x="280.0" y="106.5" font-size="12" text-anchor="middle" fill="#1f2937">8 B</text>
<rect x="308" y="74" width="56" height="42" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="336.0" y="91.5" font-size="12" text-anchor="middle" fill="#1f2937">pointer</text>
<text x="336.0" y="106.5" font-size="12" text-anchor="middle" fill="#1f2937">8 B</text>
<rect x="210" y="154" width="76" height="44" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="248.0" y="172.5" font-size="12" text-anchor="middle" fill="#1f2937">int, 28 B</text>
<text x="248.0" y="187.5" font-size="12" text-anchor="middle" fill="#1f2937">1043</text>
<line x1="168" y1="117" x2="248" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<rect x="306" y="154" width="76" height="44" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="344.0" y="172.5" font-size="12" text-anchor="middle" fill="#1f2937">int, 28 B</text>
<text x="344.0" y="187.5" font-size="12" text-anchor="middle" fill="#1f2937">88210</text>
<line x1="224" y1="117" x2="344" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<rect x="402" y="154" width="76" height="44" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="440.0" y="172.5" font-size="12" text-anchor="middle" fill="#1f2937">int, 28 B</text>
<text x="440.0" y="187.5" font-size="12" text-anchor="middle" fill="#1f2937">51277</text>
<line x1="280" y1="117" x2="440" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<rect x="498" y="154" width="76" height="44" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="536.0" y="172.5" font-size="12" text-anchor="middle" fill="#1f2937">int, 28 B</text>
<text x="536.0" y="187.5" font-size="12" text-anchor="middle" fill="#1f2937">9001</text>
<line x1="336" y1="117" x2="536" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="600" y="172" font-size="12" fill="#475569">each pointer leads to</text>
<text x="600" y="188" font-size="12" fill="#475569">a separate int object</text>
<text x="30" y="222" font-size="13" fill="#1f2937">array('I') of the same 4 positions: 80 + 4 × 4 = 96 bytes</text>
<rect x="30" y="232" width="110" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="85.0" y="249.5" font-size="12" text-anchor="middle" fill="#1f2937">array header</text>
<text x="85.0" y="264.5" font-size="12" text-anchor="middle" fill="#1f2937">80 B</text>
<rect x="140" y="232" width="64" height="42" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
<text x="172.0" y="249.5" font-size="12" text-anchor="middle" fill="#1f2937">1043</text>
<text x="172.0" y="264.5" font-size="12" text-anchor="middle" fill="#1f2937">4 B</text>
<rect x="204" y="232" width="64" height="42" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
<text x="236.0" y="249.5" font-size="12" text-anchor="middle" fill="#1f2937">88210</text>
<text x="236.0" y="264.5" font-size="12" text-anchor="middle" fill="#1f2937">4 B</text>
<rect x="268" y="232" width="64" height="42" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
<text x="300.0" y="249.5" font-size="12" text-anchor="middle" fill="#1f2937">51277</text>
<text x="300.0" y="264.5" font-size="12" text-anchor="middle" fill="#1f2937">4 B</text>
<rect x="332" y="232" width="64" height="42" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
<text x="364.0" y="249.5" font-size="12" text-anchor="middle" fill="#1f2937">9001</text>
<text x="364.0" y="264.5" font-size="12" text-anchor="middle" fill="#1f2937">4 B</text>
<text x="420" y="249" font-size="12" fill="#475569">contiguous unsigned 32-bit integers, no pointers:</text>
<text x="420" y="265" font-size="12" fill="#475569">4 bytes per position, values up to 4,294,967,295</text>
<text x="30" y="306" font-size="13" fill="#1f2937">The bases ACGT packed at 2 bits per base: 1 byte (the str 'ACGT' takes 49 + 4 = 53 bytes)</text>
<rect x="30" y="318" width="64" height="42" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
<text x="62.0" y="335.5" font-size="12" text-anchor="middle" fill="#1f2937">A</text>
<text x="62.0" y="350.5" font-size="12" text-anchor="middle" fill="#1f2937">00</text>
<rect x="94" y="318" width="64" height="42" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
<text x="126.0" y="335.5" font-size="12" text-anchor="middle" fill="#1f2937">C</text>
<text x="126.0" y="350.5" font-size="12" text-anchor="middle" fill="#1f2937">01</text>
<rect x="158" y="318" width="64" height="42" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
<text x="190.0" y="335.5" font-size="12" text-anchor="middle" fill="#1f2937">G</text>
<text x="190.0" y="350.5" font-size="12" text-anchor="middle" fill="#1f2937">10</text>
<rect x="222" y="318" width="64" height="42" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
<text x="254.0" y="335.5" font-size="12" text-anchor="middle" fill="#1f2937">T</text>
<text x="254.0" y="350.5" font-size="12" text-anchor="middle" fill="#1f2937">11</text>
<path d="M30,368 V374 H286 V368" fill="none" stroke="#64748b" stroke-width="1.5"/>
<text x="158" y="386" font-size="12" text-anchor="middle" fill="#475569">one byte = 8 bits</text>
<text x="320" y="335" font-size="12" fill="#475569">A, C, G, T coded 0, 1, 2, 3: four bases per byte, so a genome</text>
<text x="320" y="351" font-size="12" fill="#475569">of n bases needs n/4 bytes instead of n (plus side tables for N runs)</text>
</svg>
