<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Phases of a bacterial growth curve on a logarithmic axis</title>
<desc id="d">Schematic growth curve of a batch culture: the logarithm of viable cells per millilitre against time. A flat lag phase, an exponential phase that is a straight rising line on the log axis, a flat stationary phase, and a declining death phase. Invented numbers.</desc>
<rect x="1" y="1" width="798" height="468" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" font-weight="bold" fill="#1f2937">The four phases of a bacterial growth curve (batch culture)</text>
<text x="24" y="56" font-size="13" fill="#475569">Viable cells per mL on a logarithmic axis. Schematic: invented numbers, real phases vary in length and shape.</text>
<rect x="90.0" y="120" width="95.7" height="240" fill="#fef3c7" fill-opacity="0.8"/>
<text x="137.9" y="92" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Lag</text>
<text x="137.9" y="412" font-size="12" fill="#334155" text-anchor="middle">adaptation,</text>
<text x="137.9" y="427" font-size="12" fill="#334155" text-anchor="middle">little division</text>
<line x1="90.0" y1="100" x2="90.0" y2="360" stroke="#94a3b8" stroke-dasharray="3 3"/>
<rect x="185.7" y="120" width="215.4" height="240" fill="#dcfce7" fill-opacity="0.8"/>
<text x="293.4" y="92" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Exponential (log)</text>
<text x="293.4" y="412" font-size="12" fill="#334155" text-anchor="middle">constant doubling time g:</text>
<text x="293.4" y="427" font-size="12" fill="#334155" text-anchor="middle">a straight line on this axis</text>
<line x1="185.7" y1="100" x2="185.7" y2="360" stroke="#94a3b8" stroke-dasharray="3 3"/>
<rect x="401.1" y="120" width="167.5" height="240" fill="#e0f2fe" fill-opacity="0.8"/>
<text x="484.8" y="92" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Stationary</text>
<text x="484.8" y="412" font-size="12" fill="#334155" text-anchor="middle">divisions balance deaths,</text>
<text x="484.8" y="427" font-size="12" fill="#334155" text-anchor="middle">nutrients exhausted</text>
<line x1="401.1" y1="100" x2="401.1" y2="360" stroke="#94a3b8" stroke-dasharray="3 3"/>
<rect x="568.6" y="120" width="191.4" height="240" fill="#fce7f3" fill-opacity="0.8"/>
<text x="664.3" y="92" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Death (decline)</text>
<text x="664.3" y="412" font-size="12" fill="#334155" text-anchor="middle">deaths exceed divisions</text>
<line x1="568.6" y1="100" x2="568.6" y2="360" stroke="#94a3b8" stroke-dasharray="3 3"/>
<line x1="90" y1="360.0" x2="760" y2="360.0" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="82" y="364.0" font-size="12" fill="#334155" text-anchor="end">10^4</text>
<line x1="90" y1="320.0" x2="760" y2="320.0" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="82" y="324.0" font-size="12" fill="#334155" text-anchor="end">10^5</text>
<line x1="90" y1="280.0" x2="760" y2="280.0" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="82" y="284.0" font-size="12" fill="#334155" text-anchor="end">10^6</text>
<line x1="90" y1="240.0" x2="760" y2="240.0" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="82" y="244.0" font-size="12" fill="#334155" text-anchor="end">10^7</text>
<line x1="90" y1="200.0" x2="760" y2="200.0" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="82" y="204.0" font-size="12" fill="#334155" text-anchor="end">10^8</text>
<line x1="90" y1="160.0" x2="760" y2="160.0" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="82" y="164.0" font-size="12" fill="#334155" text-anchor="end">10^9</text>
<line x1="90" y1="120.0" x2="760" y2="120.0" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="82" y="124.0" font-size="12" fill="#334155" text-anchor="end">10^10</text>
