<text x="90.0" y="380" font-size="12" fill="#334155" text-anchor="middle">0</text>
<line x1="185.7" y1="360" x2="185.7" y2="365" stroke="#475569"/>
<text x="185.7" y="380" font-size="12" fill="#334155" text-anchor="middle">2</text>
<line x1="281.4" y1="360" x2="281.4" y2="365" stroke="#475569"/>
<text x="281.4" y="380" font-size="12" fill="#334155" text-anchor="middle">4</text>
<line x1="377.1" y1="360" x2="377.1" y2="365" stroke="#475569"/>
<text x="377.1" y="380" font-size="12" fill="#334155" text-anchor="middle">6</text>
<line x1="472.9" y1="360" x2="472.9" y2="365" stroke="#475569"/>
<text x="472.9" y="380" font-size="12" fill="#334155" text-anchor="middle">8</text>
<line x1="568.6" y1="360" x2="568.6" y2="365" stroke="#475569"/>
<text x="568.6" y="380" font-size="12" fill="#334155" text-anchor="middle">10</text>
<line x1="664.3" y1="360" x2="664.3" y2="365" stroke="#475569"/>
<text x="664.3" y="380" font-size="12" fill="#334155" text-anchor="middle">12</text>
<line x1="760.0" y1="360" x2="760.0" y2="365" stroke="#475569"/>
<text x="760.0" y="380" font-size="12" fill="#334155" text-anchor="middle">14</text>
<line x1="90" y1="360" x2="760" y2="360" stroke="#475569" stroke-width="1.2"/>
<line x1="90" y1="120" x2="90" y2="360" stroke="#475569" stroke-width="1.2"/>
<text x="425.0" y="396" font-size="13" fill="#1f2937" text-anchor="middle">time (h)</text>
<text x="28" y="240.0" font-size="13" fill="#1f2937" text-anchor="middle" transform="rotate(-90 28 240.0)">viable cells per mL (log scale)</text>
