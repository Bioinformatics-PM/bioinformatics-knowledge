<text x="441" y="350.0" font-size="12" fill="#1f2937">≈ 600 bp</text>
<text x="505" y="250" text-anchor="middle" font-size="12" fill="#475569">no band</text>
<text x="350" y="436" text-anchor="middle" font-size="12" fill="#475569">M: ladder of known sizes. A: digest (3 fragments). B: PCR product. C: no-template control.</text>
<text x="350" y="454" text-anchor="middle" font-size="12" fill="#475569">Wells at the top; distance from the well falls roughly linearly with log(size).</text>
