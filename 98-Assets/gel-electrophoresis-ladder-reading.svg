<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="700" height="470" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Agarose gel read against a size ladder (invented data)</text>
