<rect x="175" y="310.5" width="60" height="5" rx="2" fill="#f59e0b"/>
<text x="142" y="317.0" text-anchor="end" font-size="12" fill="#1f2937">1,000 bp</text>
<rect x="175" y="334.5" width="60" height="5" rx="2" fill="#f59e0b"/>
