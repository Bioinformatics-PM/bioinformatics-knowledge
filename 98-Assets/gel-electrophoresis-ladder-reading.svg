<rect x="175" y="388.5" width="60" height="5" rx="2" fill="#f59e0b"/>
<text x="142" y="395.0" text-anchor="end" font-size="12" fill="#1f2937">300 bp</text>
<rect x="275" y="181.0" width="60" height="6" rx="2" fill="#ea580c"/>
<text x="341" y="188.0" font-size="12" fill="#1f2937">≈ 7.7-8.0 kb</text>
<rect x="275" y="247.0" width="60" height="6" rx="2" fill="#ea580c"/>
<text x="341" y="254.0" font-size="12" fill="#1f2937">≈ 2.6-2.7 kb</text>
<rect x="275" y="301.0" width="60" height="6" rx="2" fill="#ea580c"/>
