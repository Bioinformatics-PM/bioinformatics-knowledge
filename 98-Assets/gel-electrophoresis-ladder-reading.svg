<text x="600" y="92" font-size="14" font-weight="bold" fill="#475569">− cathode</text>
<text x="600" y="404" font-size="14" font-weight="bold" fill="#475569">+ anode</text>
<line x1="625" y1="110" x2="625" y2="380" stroke="#64748b" stroke-width="2.5"/>
<polygon points="618,378 632,378 625,392" fill="#64748b"/>
<text x="640" y="250" font-size="12" fill="#475569" transform="rotate(90 640 250)" text-anchor="middle">DNA moves toward +</text>
<rect x="173" y="86" width="64" height="12" rx="2" fill="#f8fafc" stroke="#64748b"/>
<text x="205" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">M</text>
