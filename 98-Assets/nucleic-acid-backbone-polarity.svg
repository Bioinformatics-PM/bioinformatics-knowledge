<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Sugar-phosphate backbone and strand polarity</title>
  <desc id="d">A DNA trinucleotide 5'-ACG-3' drawn top to bottom. Each phosphate links the 3' carbon of one sugar to the 5' carbon of the next (a 3'-5' phosphodiester bond). The top end carries a free 5' phosphate, the bottom end a free 3' hydroxyl. Bases hang off the 1' carbons. Right: consequences of polarity.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect x="3" y="3" width="774" height="554" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Sugar-phosphate backbone: why every strand has a 5' and a 3' end</text>
  <text x="390" y="58" text-anchor="middle" font-size="13" fill="#475569">Schematic DNA strand 5'-ACG-3', not to scale. Primed numbers are sugar carbons.</text>
  <line x1="62" y1="115" x2="62" y2="500" stroke="#475569" stroke-width="3" marker-end="url(#arr)"/>
  <text x="48" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937" transform="rotate(-90 48 308)">5' to 3' direction of the chain</text>
  <line x1="208" y1="170" x2="175" y2="146" stroke="#64748b" stroke-width="3"/>
  <line x1="175" y1="146" x2="150" y2="110" stroke="#64748b" stroke-width="3"/>
  <polygon points="240,146 272,170 260,206 220,206 208,170" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="240" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">O</text>
  <text x="274" y="188" font-size="12" fill="#1f2937">1'</text>
  <text x="266" y="220" font-size="12" fill="#1f2937">2' (H)</text>
  <text x="202" y="220" font-size="12" font-weight="bold" fill="#1f2937">3'</text>
  <text x="206" y="190" text-anchor="end" font-size="12" fill="#1f2937">4'</text>
  <circle cx="175" cy="146" r="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="142" font-size="12" font-weight="bold" fill="#1f2937">5'</text>
  <line x1="272" y1="170" x2="310" y2="170" stroke="#64748b" stroke-width="3"/>
  <rect x="310" y="148" width="70" height="44" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="345" y="177" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">A</text>
  <circle cx="150" cy="110" r="18" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
  <text x="150" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">P</text>
  <text x="124" y="115" text-anchor="end" font-size="13" font-weight="bold" fill="#1f2937">5' end</text>
  <text x="176" y="102" font-size="12" fill="#475569">free 5' phosphate</text>
  <line x1="208" y1="295" x2="175" y2="271" stroke="#64748b" stroke-width="3"/>
  <line x1="175" y1="271" x2="150" y2="235" stroke="#64748b" stroke-width="3"/>
  <polygon points="240,271 272,295 260,331 220,331 208,295" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="240" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">O</text>
  <text x="274" y="313" font-size="12" fill="#1f2937">1'</text>
  <text x="266" y="345" font-size="12" fill="#1f2937">2' (H)</text>
  <text x="202" y="345" font-size="12" font-weight="bold" fill="#1f2937">3'</text>
  <text x="206" y="315" text-anchor="end" font-size="12" fill="#1f2937">4'</text>
  <circle cx="175" cy="271" r="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="267" font-size="12" font-weight="bold" fill="#1f2937">5'</text>
  <line x1="272" y1="295" x2="310" y2="295" stroke="#64748b" stroke-width="3"/>
  <rect x="310" y="273" width="70" height="44" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="345" y="302" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">C</text>
  <circle cx="150" cy="235" r="18" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
  <text x="150" y="241" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">P</text>
  <line x1="220" y1="206" x2="150" y2="235" stroke="#64748b" stroke-width="3"/>
  <text x="180" y="245" font-size="12" fill="#475569">3'-O-P-O-5' link</text>
  <line x1="208" y1="420" x2="175" y2="396" stroke="#64748b" stroke-width="3"/>
  <line x1="175" y1="396" x2="150" y2="360" stroke="#64748b" stroke-width="3"/>
  <polygon points="240,396 272,420 260,456 220,456 208,420" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="240" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">O</text>
  <text x="274" y="438" font-size="12" fill="#1f2937">1'</text>
  <text x="266" y="470" font-size="12" fill="#1f2937">2' (H)</text>
  <text x="202" y="470" font-size="12" font-weight="bold" fill="#1f2937">3'</text>
  <text x="206" y="440" text-anchor="end" font-size="12" fill="#1f2937">4'</text>
  <circle cx="175" cy="396" r="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="392" font-size="12" font-weight="bold" fill="#1f2937">5'</text>
  <line x1="272" y1="420" x2="310" y2="420" stroke="#64748b" stroke-width="3"/>
  <rect x="310" y="398" width="70" height="44" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="345" y="427" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">G</text>
  <circle cx="150" cy="360" r="18" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
  <text x="150" y="366" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">P</text>
  <line x1="220" y1="331" x2="150" y2="360" stroke="#64748b" stroke-width="3"/>
  <text x="180" y="370" font-size="12" fill="#475569">3'-O-P-O-5' link</text>
  <line x1="220" y1="456" x2="220" y2="486" stroke="#64748b" stroke-width="3"/>
  <text x="220" y="504" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">OH</text>
  <text x="246" y="504" font-size="13" font-weight="bold" fill="#1f2937">3' end: free 3'-OH (a polymerase adds here)</text>
  <path d="M 395 118 h 10 v 362 h -10" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="415" y="290" font-size="12" fill="#475569">repeating</text>
  <text x="415" y="306" font-size="12" fill="#475569">sugar-phosphate</text>
  <text x="415" y="322" font-size="12" fill="#475569">backbone</text>
  <line x1="515" y1="90" x2="515" y2="530" stroke="#cbd5e1" stroke-width="2"/>
  <text x="535" y="118" font-size="15" font-weight="bold" fill="#1f2937">What polarity implies</text>
  <rect x="535" y="140" width="222" height="75" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="547" y="159" font-size="13" font-weight="bold" fill="#1f2937">Same letters, different molecules</text>
  <text x="547" y="177" font-size="12" fill="#1f2937" xml:space="preserve">5'-ACG-3'  is not  5'-GCA-3'</text>
  <text x="547" y="194" font-size="12" fill="#1f2937" xml:space="preserve">(A carries the free 5' end</text>
  <text x="547" y="211" font-size="12" fill="#1f2937" xml:space="preserve">in the first, G in the second)</text>
  <rect x="535" y="231" width="222" height="75" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="547" y="250" font-size="13" font-weight="bold" fill="#1f2937">One writing convention</text>
  <text x="547" y="268" font-size="12" fill="#1f2937" xml:space="preserve">left = 5', right = 3';</text>
  <text x="547" y="285" font-size="12" fill="#1f2937" xml:space="preserve">an unlabeled sequence</text>
  <text x="547" y="302" font-size="12" fill="#1f2937" xml:space="preserve">is read 5' to 3'</text>
  <rect x="535" y="322" width="222" height="75" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="547" y="341" font-size="13" font-weight="bold" fill="#1f2937">Growth only at the 3' end</text>
  <text x="547" y="359" font-size="12" fill="#1f2937" xml:space="preserve">polymerases join a new</text>
  <text x="547" y="376" font-size="12" fill="#1f2937" xml:space="preserve">nucleotide to the free 3'-OH,</text>
  <text x="547" y="393" font-size="12" fill="#1f2937" xml:space="preserve">so chains grow 5' to 3'</text>
  <rect x="535" y="413" width="222" height="75" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="547" y="432" font-size="13" font-weight="bold" fill="#1f2937">Uniform backbone</text>
  <text x="547" y="450" font-size="12" fill="#1f2937" xml:space="preserve">identical repeating unit;</text>
  <text x="547" y="467" font-size="12" fill="#1f2937" xml:space="preserve">the information is the</text>
  <text x="547" y="484" font-size="12" fill="#1f2937" xml:space="preserve">order of the bases</text>
</svg>
