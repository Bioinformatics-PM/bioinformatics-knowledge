<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">RNA stem-loop, schematic</title>
  <desc id="d">A single RNA strand GGUCGAAAGGCC folds back on itself: positions 1 to 4 pair with 12 to 9 to form a four base-pair stem (G-C, G-C, U-G wobble, C-G) closed by a four-nucleotide GAAA hairpin loop. Dot-bracket: ((((....)))).</desc>
  <rect x="4" y="4" width="632" height="592" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="320" y="40" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2937">RNA stem-loop (hairpin)</text>
  <text x="320" y="64" text-anchor="middle" font-size="14" fill="#475569">Toy sequence folding back on itself; numbers are positions from the 5' end.</text>
  <polyline points="250,440 250,380 250,320 250,260 232,196 268,146 332,146 368,196 350,260 350,320 350,380 350,440" fill="none" stroke="#64748b" stroke-width="4" stroke-linejoin="round"/>
  <line x1="270" y1="440" x2="330" y2="440" stroke="#475569" stroke-width="3"/>
  <line x1="270" y1="380" x2="330" y2="380" stroke="#475569" stroke-width="3"/>
  <line x1="270" y1="320" x2="330" y2="320" stroke="#475569" stroke-width="3" stroke-dasharray="4 5"/>
  <line x1="270" y1="260" x2="330" y2="260" stroke="#475569" stroke-width="3"/>
  <circle cx="250" cy="440" r="19" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
  <text x="250" y="447" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">G</text>
  <text x="224" y="445" text-anchor="end" font-size="13" fill="#475569">1</text>
  <circle cx="250" cy="380" r="19" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
  <text x="250" y="387" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">G</text>
  <text x="224" y="385" text-anchor="end" font-size="13" fill="#475569">2</text>
  <circle cx="250" cy="320" r="19" fill="#fecaca" stroke="#dc2626" stroke-width="2.5"/>
  <text x="250" y="327" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">U</text>
  <text x="224" y="325" text-anchor="end" font-size="13" fill="#475569">3</text>
  <circle cx="250" cy="260" r="19" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="250" y="267" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">C</text>
  <text x="224" y="265" text-anchor="end" font-size="13" fill="#475569">4</text>
  <circle cx="232" cy="196" r="19" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
  <text x="232" y="203" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">G</text>
  <text x="206" y="201" text-anchor="end" font-size="13" fill="#475569">5</text>
  <circle cx="268" cy="146" r="19" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
  <text x="268" y="153" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">A</text>
  <text x="242" y="151" text-anchor="end" font-size="13" fill="#475569">6</text>
  <circle cx="332" cy="146" r="19" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
  <text x="332" y="153" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">A</text>
  <text x="358" y="151" text-anchor="start" font-size="13" fill="#475569">7</text>
  <circle cx="368" cy="196" r="19" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
  <text x="368" y="203" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">A</text>
  <text x="394" y="201" text-anchor="start" font-size="13" fill="#475569">8</text>
  <circle cx="350" cy="260" r="19" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
  <text x="350" y="267" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">G</text>
  <text x="376" y="265" text-anchor="start" font-size="13" fill="#475569">9</text>
  <circle cx="350" cy="320" r="19" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
  <text x="350" y="327" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">G</text>
  <text x="376" y="325" text-anchor="start" font-size="13" fill="#475569">10</text>
  <circle cx="350" cy="380" r="19" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="350" y="387" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">C</text>
  <text x="376" y="385" text-anchor="start" font-size="13" fill="#475569">11</text>
  <circle cx="350" cy="440" r="19" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="350" y="447" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">C</text>
  <text x="376" y="445" text-anchor="start" font-size="13" fill="#475569">12</text>
  <text x="250" y="492" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">5'</text>
  <text x="350" y="492" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">3'</text>
  <path d="M 190 250 h -8 v 200 h 8" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="174" y="345" text-anchor="end" font-size="15" fill="#1f2937">stem</text>
  <text x="174" y="363" text-anchor="end" font-size="13" fill="#475569">(4 base pairs,</text>
  <text x="174" y="379" text-anchor="end" font-size="13" fill="#475569">double helix)</text>
  <text x="300" y="104" text-anchor="middle" font-size="15" fill="#1f2937">hairpin loop: GAAA (unpaired)</text>
  <line x1="420" y1="320" x2="468" y2="320" stroke="#475569" stroke-width="1.5"/>
  <text x="474" y="316" font-size="15" fill="#1f2937">U-G wobble pair</text>
  <text x="474" y="334" font-size="13" fill="#475569">(allowed in RNA)</text>
  <line x1="420" y1="380" x2="468" y2="380" stroke="#475569" stroke-width="1.5"/>
  <text x="474" y="376" font-size="15" fill="#1f2937">G-C pair</text>
  <text x="474" y="394" font-size="13" fill="#475569">(Watson-Crick)</text>
  <text x="320" y="534" text-anchor="middle" font-size="17" fill="#1f2937" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace">GGUCGAAAGGCC</text>
  <text x="238" y="534" text-anchor="end" font-size="15" fill="#1f2937">5'</text>
  <text x="402" y="534" text-anchor="start" font-size="15" fill="#1f2937">3'</text>
  <text x="320" y="560" text-anchor="middle" font-size="17" fill="#1f2937" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace">((((....))))</text>
  <text x="320" y="582" text-anchor="middle" font-size="12" fill="#475569">dot-bracket: "(" and ")" = paired positions, "." = unpaired</text>
</svg>
