<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Sizes in the cell and what microscopes resolve, on a log scale</title>
<desc id="d">Logarithmic scale from 10 picometres to 1 millimetre. Eukaryotic cells span 10 to 100 micrometres, prokaryotic cells 0.1 to 5 micrometres, mitochondria are 0.5 to 1 micrometre wide, visible light has wavelengths of 0.4 to 0.7 micrometre, plasma membranes are 5 to 10 nanometres thick and the DNA double helix is about 2 nanometres wide. A light microscope resolves details down to about 200 nanometres; an electron microscope down to about 0.1 nanometre as an instrument and about 2 nanometres on biological samples.</desc>
<rect x="1" y="1" width="798" height="468" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="24" y="34" font-size="18" font-weight="bold" fill="#1f2937">Sizes in the cell, and what each microscope can resolve</text>
<text x="24" y="56" font-size="13" fill="#374151">Logarithmic scale: each gridline is 10 times the previous one.</text>
<line x1="70.0" y1="76" x2="70.0" y2="372" stroke="#e2e8f0" stroke-width="1"/>
<text x="70.0" y="390" font-size="12" text-anchor="middle" fill="#374151">10 pm</text>
<line x1="156.2" y1="76" x2="156.2" y2="372" stroke="#e2e8f0" stroke-width="1"/>
<text x="156.2" y="390" font-size="12" text-anchor="middle" fill="#374151">100 pm</text>
<line x1="242.5" y1="76" x2="242.5" y2="372" stroke="#e2e8f0" stroke-width="1"/>
<text x="242.5" y="390" font-size="12" text-anchor="middle" fill="#374151">1 nm</text>
<line x1="328.8" y1="76" x2="328.8" y2="372" stroke="#e2e8f0" stroke-width="1"/>
<text x="328.8" y="390" font-size="12" text-anchor="middle" fill="#374151">10 nm</text>
<line x1="415.0" y1="76" x2="415.0" y2="372" stroke="#e2e8f0" stroke-width="1"/>
<text x="415.0" y="390" font-size="12" text-anchor="middle" fill="#374151">100 nm</text>
<line x1="501.2" y1="76" x2="501.2" y2="372" stroke="#e2e8f0" stroke-width="1"/>
<text x="501.2" y="390" font-size="12" text-anchor="middle" fill="#374151">1 µm</text>
<line x1="587.5" y1="76" x2="587.5" y2="372" stroke="#e2e8f0" stroke-width="1"/>
<text x="587.5" y="390" font-size="12" text-anchor="middle" fill="#374151">10 µm</text>
<line x1="673.8" y1="76" x2="673.8" y2="372" stroke="#e2e8f0" stroke-width="1"/>
<text x="673.8" y="390" font-size="12" text-anchor="middle" fill="#374151">100 µm</text>
<line x1="760.0" y1="76" x2="760.0" y2="372" stroke="#e2e8f0" stroke-width="1"/>
<text x="760.0" y="390" font-size="12" text-anchor="middle" fill="#374151">1 mm</text>
<line x1="70" y1="372" x2="760" y2="372" stroke="#64748b" stroke-width="1.4"/>
<rect x="587.5" y="93" width="86.2" height="18" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
<text x="577.5" y="107" font-size="13" text-anchor="end" fill="#1f2937">Eukaryotic cells: 10 to 100 µm</text>
<rect x="415.0" y="127" width="146.5" height="18" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="405.0" y="141" font-size="13" text-anchor="end" fill="#1f2937">Prokaryotic cells: 0.1 to 5 µm</text>
<rect x="475.3" y="161" width="26.0" height="18" rx="6" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
<text x="465.3" y="175" font-size="13" text-anchor="end" fill="#1f2937">Mitochondria: 0.5 to 1 µm wide</text>
<rect x="466.9" y="195" width="21.0" height="18" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<text x="456.9" y="209" font-size="13" text-anchor="end" fill="#1f2937">Visible light wavelength: 0.4 to 0.7 µm</text>
<rect x="302.8" y="229" width="26.0" height="18" rx="6" fill="#fbcfe8" stroke="#be185d" stroke-width="1.5"/>
<text x="338.8" y="243" font-size="13" fill="#1f2937">Plasma membrane: 5 to 10 nm thick</text>
<circle cx="268.5" cy="272" r="7" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1.5"/>
<text x="285.5" y="277" font-size="13" fill="#1f2937">DNA double helix: about 2 nm wide</text>
<rect x="441.0" y="299" width="319.0" height="22" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.2"/>
<line x1="441.0" y1="295" x2="441.0" y2="325" stroke="#0369a1" stroke-width="2.5"/>
<text x="451.0" y="315" font-size="13" fill="#1f2937">Light microscope: details down to about 200 nm</text>
<rect x="156.2" y="333" width="603.8" height="22" rx="4" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.2"/>
<line x1="156.2" y1="329" x2="156.2" y2="359" stroke="#7e22ce" stroke-width="2.5"/>
<text x="166.2" y="349" font-size="13" fill="#1f2937">Electron microscope: about 0.1 nm (instrument), about 2 nm on biological samples</text>
<text x="24" y="430" font-size="12" fill="#4b5563">Bars: size ranges; dots: typical single values. Shaded bands: what each instrument can separate,</text>
<text x="24" y="448" font-size="12" fill="#4b5563">from its resolution limit (thick line) upward. Values and their sources: see the Microscopy note.</text>
</svg>