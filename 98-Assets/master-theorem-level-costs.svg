<text x="24" y="396" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2937" >Level j holds a^j subproblems of size n/b^j and costs a^j·f(n/b^j); the a^(log_b n) = n^(log_b a) leaves cost T(1) each.</text>
