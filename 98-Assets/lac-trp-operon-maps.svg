<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" font-family="Helvetica, Arial, sans-serif">
  <title>Bacterial operons: the lac and trp operons of Escherichia coli</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="776" height="496" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Bacterial operons: the lac and trp operons of E. coli</text>
  <text x="390" y="52" text-anchor="middle" font-size="12" fill="#475569">Genes and regulatory sites on the DNA, not to scale. One promoter gives one polycistronic mRNA.</text>

  <!-- Panel A: lac operon -->
  <text x="40" y="84" font-size="14" font-weight="bold" fill="#1f2937">A. lac operon (inducible): using lactose</text>
  <line x1="40" y1="140" x2="740" y2="140" stroke="#64748b" stroke-width="3"/>
  <rect x="56" y="128" width="90" height="24" rx="3" fill="#e9d5ff" stroke="#7e22ce" stroke-width="1.5"/>
  <text x="101" y="145" text-anchor="middle" font-size="13" font-style="italic" fill="#1f2937">lacI</text>
  <path d="M60,128 L60,112 L84,112" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="101" y="172" text-anchor="middle" font-size="12" fill="#1f2937">repressor gene</text>
  <text x="101" y="188" text-anchor="middle" font-size="12" fill="#1f2937">(own promoter)</text>
  <rect x="180" y="128" width="40" height="24" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <rect x="222" y="128" width="60" height="24" rx="3" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="272" y="128" width="40" height="24" rx="3" fill="#bbf7d0" fill-opacity="0.85" stroke="#15803d" stroke-width="1.5"/>
  <text x="200" y="172" text-anchor="middle" font-size="12" fill="#1f2937">CAP site</text>
  <text x="252" y="188" text-anchor="middle" font-size="12" fill="#1f2937">promoter</text>
  <text x="294" y="172" text-anchor="middle" font-size="12" fill="#1f2937">operator</text>
  <path d="M300,128 L300,108 L326,108" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="334" y="112" font-size="12" font-weight="bold" fill="#1f2937">+1</text>
  <rect x="318" y="128" width="202" height="24" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="524" y="128" width="86" height="24" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="614" y="128" width="50" height="24" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="419" y="145" text-anchor="middle" font-size="13" font-style="italic" fill="#1f2937">lacZ</text>
  <text x="567" y="145" text-anchor="middle" font-size="13" font-style="italic" fill="#1f2937">lacY</text>
  <text x="639" y="145" text-anchor="middle" font-size="13" font-style="italic" fill="#1f2937">lacA</text>
  <text x="419" y="172" text-anchor="middle" font-size="12" fill="#1f2937">β-galactosidase</text>
  <text x="567" y="172" text-anchor="middle" font-size="12" fill="#1f2937">permease</text>
  <text x="639" y="188" text-anchor="middle" font-size="12" fill="#1f2937">transacetylase</text>
  <path d="M682,128 L686,112 Q690,104 694,112 L698,128" fill="none" stroke="#475569" stroke-width="1.8"/>
  <text x="712" y="172" text-anchor="middle" font-size="12" fill="#1f2937">terminator</text>
  <line x1="300" y1="216" x2="696" y2="216" stroke="#0f766e" stroke-width="3"/>
  <text x="284" y="220" font-size="12" fill="#1f2937">5'</text>
  <text x="702" y="220" font-size="12" fill="#1f2937">3'</text>
  <text x="498" y="236" text-anchor="middle" font-size="12" fill="#1f2937">one polycistronic mRNA: lacZ, lacY and lacA coding sequences</text>
  <text x="40" y="264" font-size="12" fill="#1f2937">The Lac repressor binds the operator and blocks transcription; allolactose, made from lactose, releases it.</text>
  <text x="40" y="281" font-size="12" fill="#1f2937">CAP-cAMP, abundant when glucose is low, binds the CAP site and helps RNA polymerase bind the promoter.</text>
  <text x="40" y="298" font-size="12" fill="#1f2937">High expression therefore needs lactose present and glucose absent.</text>

  <!-- Panel B: trp operon -->
  <g transform="translate(0,20)">
  <text x="40" y="318" font-size="14" font-weight="bold" fill="#1f2937">B. trp operon (repressible): making tryptophan</text>
  <line x1="40" y1="370" x2="740" y2="370" stroke="#64748b" stroke-width="3"/>
  <rect x="70" y="358" width="50" height="24" rx="3" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="110" y="358" width="40" height="24" rx="3" fill="#bbf7d0" fill-opacity="0.85" stroke="#15803d" stroke-width="1.5"/>
  <path d="M140,358 L140,338 L166,338" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="174" y="342" font-size="12" font-weight="bold" fill="#1f2937">+1</text>
  <rect x="156" y="358" width="70" height="24" rx="3" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="191" y="375" text-anchor="middle" font-size="13" font-style="italic" fill="#1f2937">trpL</text>
  <path d="M230,358 L234,342 Q238,334 242,342 L246,358" fill="none" stroke="#475569" stroke-width="1.8"/>
  <rect x="252" y="358" width="96" height="24" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="352" y="358" width="96" height="24" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="452" y="358" width="80" height="24" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="536" y="358" width="80" height="24" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="620" y="358" width="60" height="24" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="375" text-anchor="middle" font-size="13" font-style="italic" fill="#1f2937">trpE</text>
  <text x="400" y="375" text-anchor="middle" font-size="13" font-style="italic" fill="#1f2937">trpD</text>
  <text x="492" y="375" text-anchor="middle" font-size="13" font-style="italic" fill="#1f2937">trpC</text>
  <text x="576" y="375" text-anchor="middle" font-size="13" font-style="italic" fill="#1f2937">trpB</text>
  <text x="650" y="375" text-anchor="middle" font-size="13" font-style="italic" fill="#1f2937">trpA</text>
  <text x="95" y="402" text-anchor="middle" font-size="12" fill="#1f2937">promoter</text>
  <text x="132" y="418" text-anchor="middle" font-size="12" fill="#1f2937">operator</text>
  <text x="212" y="402" text-anchor="middle" font-size="12" fill="#1f2937">leader, attenuator</text>
  <text x="466" y="402" text-anchor="middle" font-size="12" fill="#1f2937">enzymes of tryptophan synthesis</text>
  <text x="40" y="446" font-size="12" fill="#1f2937">Tryptophan binds the trp repressor, which then binds the operator and stops transcription (repression).</text>
  <text x="40" y="463" font-size="12" fill="#1f2937">Attenuation: with tryptophan abundant, ribosomes translating the leader let a terminator hairpin form early.</text>
  </g>
</svg>
