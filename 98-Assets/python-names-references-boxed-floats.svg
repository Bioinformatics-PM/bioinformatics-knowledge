<text x="380" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">Names, references and boxed floats (CPython 3.13, 64-bit)</text>
<text x="24" y="56" font-size="14" font-weight="bold" fill="#1f2937">A. Assignment binds a name to an object; it never copies</text>
<text x="24" y="76" font-size="12" font-family="Courier New, monospace" fill="#475569">a = [0.5, 0.25];  b = a;  c = list(a);  b.append(0.125)</text>
