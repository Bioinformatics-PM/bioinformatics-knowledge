<text x="270" y="222" font-size="12" fill="#475569">c: a new list holding the same float objects</text>
<text x="270" y="238" font-size="12" fill="#475569">(shallow copy); 0.125, appended through b, is not in c</text>
<line x1="24" y1="258" x2="736" y2="258" stroke="#cbd5e1" stroke-width="1"/>
<text x="24" y="282" font-size="14" font-weight="bold" fill="#1f2937">B. A million floats: boxed in a list versus packed in an array</text>
