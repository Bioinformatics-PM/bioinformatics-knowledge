<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="310" rx="16" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Matrix-vector product: Ax is a combination of the columns of A</text>

  <!-- A (3 x 2) -->
  <rect x="52" y="70" width="48" height="120" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="106" y="70" width="48" height="120" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <path d="M 46 64 H 38 V 196 H 46" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 160 64 H 168 V 196 H 160" fill="none" stroke="#475569" stroke-width="2"/>
  <g font-size="16" fill="#1f2937" text-anchor="middle">
    <text x="76" y="102">1</text><text x="76" y="136">0</text><text x="76" y="170">4</text>
    <text x="130" y="102">2</text><text x="130" y="136">1</text><text x="130" y="170">−1</text>
  </g>

  <!-- x (2 x 1) -->
  <path d="M 190 96 H 182 V 164 H 190" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 222 96 H 230 V 164 H 222" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="206" y="122" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">3</text>
  <text x="206" y="152" font-size="16" fill="#d97706" font-weight="bold" text-anchor="middle">2</text>

  <text x="252" y="137" font-size="20" fill="#1f2937" text-anchor="middle">=</text>

  <!-- 3 x column 1 -->
  <text x="284" y="137" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">3 ×</text>
  <rect x="306" y="70" width="48" height="120" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <g font-size="16" fill="#1f2937" text-anchor="middle">
    <text x="330" y="102">1</text><text x="330" y="136">0</text><text x="330" y="170">4</text>
  </g>
  <text x="378" y="137" font-size="20" fill="#1f2937" text-anchor="middle">+</text>

  <!-- 2 x column 2 -->
  <text x="410" y="137" font-size="16" fill="#d97706" font-weight="bold" text-anchor="middle">2 ×</text>
  <rect x="432" y="70" width="48" height="120" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <g font-size="16" fill="#1f2937" text-anchor="middle">
    <text x="456" y="102">2</text><text x="456" y="136">1</text><text x="456" y="170">−1</text>
  </g>
  <text x="504" y="137" font-size="20" fill="#1f2937" text-anchor="middle">=</text>

  <!-- result -->
  <rect x="528" y="70" width="56" height="120" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <g font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">
    <text x="556" y="102">7</text><text x="556" y="136">2</text><text x="556" y="170">10</text>
  </g>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="600" y="102" text-anchor="start">= 3×1 + 2×2</text>
    <text x="600" y="136" text-anchor="start">= 3×0 + 2×1</text>
    <text x="600" y="170" text-anchor="start">= 3×4 + 2×(−1)</text>
  </g>

  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="103" y="216">A (3 × 2)</text>
    <text x="206" y="216">x (2 × 1)</text>
    <text x="330" y="216">x₁ · column 1</text>
    <text x="456" y="216">x₂ · column 2</text>
    <text x="556" y="216">Ax (3 × 1)</text>
  </g>
  <text x="40" y="252" font-size="14" fill="#1f2937">Row picture: each entry is a row of A dotted with x, e.g. 7 = (1, 2) · (3, 2).</text>
  <text x="40" y="280" font-size="14" fill="#1f2937">Deconvolution reading: columns = cell-type profiles, x = amounts, Ax = predicted bulk profile.</text>
</svg>
