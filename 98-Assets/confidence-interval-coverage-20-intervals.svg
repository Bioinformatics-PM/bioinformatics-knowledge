<text x="615.0" y="249.0" text-anchor="start" font-size="12" fill="#1f2937">chance to cover μ.</text>
<text x="615.0" y="266.0" text-anchor="start" font-size="12" fill="#1f2937"></text>
<text x="615.0" y="283.0" text-anchor="start" font-size="12" fill="#1f2937">After the data, a given</text>
