<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="Helvetica, Arial, sans-serif">
  <title>Transcription bubble: RNA polymerase copies the template strand</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="796" height="426" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Transcription bubble: RNA polymerase copies the template strand</text>

  <!-- promoter (already passed) and +1 -->
  <rect x="96" y="138" width="104" height="64" rx="8" fill="#bbf7d0" opacity="0.8"/>
  <text x="148" y="128" text-anchor="middle" font-size="13" fill="#1f2937">promoter</text>
  <line x1="214" y1="138" x2="214" y2="202" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="214" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">+1</text>
  <text x="60" y="80" font-size="13" fill="#475569">upstream</text>
  <text x="680" y="80" font-size="13" fill="#475569">downstream</text>

  <!-- RNA polymerase -->
  <ellipse cx="405" cy="176" rx="128" ry="106" fill="#fde68a" opacity="0.55" stroke="#d97706" stroke-width="2"/>
  <text x="405" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">RNA polymerase</text>

  <!-- base pairs in the closed duplex -->
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="50" y1="153" x2="50" y2="187"/><line x1="70" y1="153" x2="70" y2="187"/>
    <line x1="90" y1="153" x2="90" y2="187"/><line x1="110" y1="153" x2="110" y2="187"/>
    <line x1="130" y1="153" x2="130" y2="187"/><line x1="150" y1="153" x2="150" y2="187"/>
    <line x1="170" y1="153" x2="170" y2="187"/><line x1="190" y1="153" x2="190" y2="187"/>
    <line x1="230" y1="153" x2="230" y2="187"/><line x1="250" y1="153" x2="250" y2="187"/>
    <line x1="270" y1="153" x2="270" y2="187"/><line x1="290" y1="153" x2="290" y2="187"/>
    <line x1="510" y1="153" x2="510" y2="187"/><line x1="530" y1="153" x2="530" y2="187"/>
    <line x1="550" y1="153" x2="550" y2="187"/><line x1="570" y1="153" x2="570" y2="187"/>
    <line x1="590" y1="153" x2="590" y2="187"/><line x1="610" y1="153" x2="610" y2="187"/>
    <line x1="630" y1="153" x2="630" y2="187"/><line x1="650" y1="153" x2="650" y2="187"/>
    <line x1="670" y1="153" x2="670" y2="187"/><line x1="690" y1="153" x2="690" y2="187"/>
    <line x1="710" y1="153" x2="710" y2="187"/><line x1="730" y1="153" x2="730" y2="187"/>
    <line x1="750" y1="153" x2="750" y2="187"/>
  </g>

  <!-- coding strand (top) and template strand (bottom) -->
  <path d="M40,150 L300,150 C320,150 330,100 350,100 L460,100 C470,100 480,150 500,150 L760,150" fill="none" stroke="#3b82f6" stroke-width="5"/>
  <path d="M40,190 L300,190 C320,190 330,250 350,250 L460,250 C470,250 480,190 500,190 L760,190" fill="none" stroke="#8b5cf6" stroke-width="5"/>
  <text x="18" y="155" font-size="14" font-weight="bold" fill="#1d4ed8">5'</text>
  <text x="766" y="155" font-size="14" font-weight="bold" fill="#1d4ed8">3'</text>
  <text x="18" y="195" font-size="14" font-weight="bold" fill="#6d28d9">3'</text>
  <text x="766" y="195" font-size="14" font-weight="bold" fill="#6d28d9">5'</text>
  <text x="508" y="120" font-size="13" font-weight="bold" fill="#1d4ed8">coding strand</text>
  <text x="508" y="138" font-size="13" fill="#1d4ed8">same sequence as the RNA (T for U)</text>
  <text x="508" y="214" font-size="13" font-weight="bold" fill="#6d28d9">template strand</text>
  <text x="508" y="232" font-size="13" fill="#6d28d9">read by the polymerase 3' to 5'</text>

  <!-- RNA-DNA hybrid base pairs -->
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="370" y1="233" x2="370" y2="246"/><line x1="385" y1="233" x2="385" y2="246"/>
    <line x1="400" y1="233" x2="400" y2="246"/><line x1="415" y1="233" x2="415" y2="246"/>
    <line x1="430" y1="233" x2="430" y2="246"/><line x1="445" y1="233" x2="445" y2="246"/>
  </g>

  <!-- RNA transcript -->
  <path d="M452,228 L365,228 C335,228 320,262 290,300 C265,332 220,352 150,364" fill="none" stroke="#f97316" stroke-width="5"/>
  <text x="440" y="220" font-size="13" font-weight="bold" fill="#c2410c">3'</text>
  <text x="126" y="369" font-size="14" font-weight="bold" fill="#c2410c">5'</text>
  <text x="60" y="392" font-size="13" fill="#9a3412">RNA transcript, synthesized 5' to 3'</text>
  <text x="405" y="272" text-anchor="middle" font-size="12" fill="#1f2937">RNA-DNA hybrid</text>

  <!-- active site -->
  <circle cx="458" cy="238" r="7" fill="#dc2626"/>
  <line x1="465" y1="244" x2="560" y2="300" stroke="#475569" stroke-width="1.5"/>
  <text x="564" y="304" font-size="13" fill="#1f2937">active site: each NTP is added</text>
  <text x="564" y="320" font-size="13" fill="#1f2937">to the 3' end of the RNA</text>

  <!-- direction -->
  <line x1="560" y1="360" x2="740" y2="360" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="650" y="346" text-anchor="middle" font-size="13" fill="#1f2937">direction of transcription</text>

  <text x="400" y="418" text-anchor="middle" font-size="12" fill="#475569">Schematic, not to scale. The RNA is complementary and antiparallel to the template strand.</text>
</svg>
