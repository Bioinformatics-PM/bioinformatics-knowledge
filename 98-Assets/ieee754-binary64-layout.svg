<text x="40" y="150" font-size="13" font-family="monospace" fill="#1f2937" xml:space="preserve">s = 0      e = 01111111011₂ = 1019, so E = e − 1023 = -4      f = 0x999999999999A</text>
<text x="40" y="174" font-size="13" font-family="monospace" fill="#1f2937" xml:space="preserve">value = (−1)ˢ × (1 + f / 2⁵²) × 2^E = 1.600000000000000088… × 2^−4</text>
<text x="40" y="198" font-size="13" font-family="monospace" fill="#1f2937" xml:space="preserve">      = 0.100000000000000005551115123…  (not 0.1: 1/10 has no finite binary expansion)</text>
<text x="40" y="240" font-size="14" font-weight="bold" fill="#1f2937">Spacing doubles at every power of two (toy format with 2 fraction bits)</text>
