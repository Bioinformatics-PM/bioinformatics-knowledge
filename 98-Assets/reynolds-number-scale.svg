<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif">
  <rect x="2" y="2" width="756" height="326" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Reynolds number Re = ρvL/η: inertial over viscous forces</text>
  <rect x="40.0" y="44" width="375.6" height="244" rx="8" fill="#dbeafe"/>
  <rect x="415.6" y="44" width="304.4" height="244" rx="8" fill="#ffedd5"/>
  <text x="227.8" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">Re ≪ 1: viscous forces dominate</text>
  <text x="227.8" y="82" text-anchor="middle" font-size="12" fill="#1e3a8a">no coasting, drag ∝ speed, reversible flow</text>
  <text x="567.8" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">Re ≫ 1: inertia dominates</text>
  <text x="567.8" y="82" text-anchor="middle" font-size="12" fill="#9a3412">coasting, wakes, turbulence</text>
  <rect x="532.9" y="148.0" width="6.3" height="60" fill="#fca5a5"/>
  <text x="532.9" y="228.0" text-anchor="middle" font-size="13" fill="#1f2937">pipe flow turns</text>
  <text x="532.9" y="244.0" text-anchor="middle" font-size="13" fill="#1f2937">turbulent, 2000-3000</text>
  <line x1="50.0" y1="178.0" x2="710.0" y2="178.0" stroke="#334155" stroke-width="2"/>
  <line x1="60.0" y1="172.0" x2="60.0" y2="184.0" stroke="#475569" stroke-width="1.5"/><text x="60.0" y="200.0" text-anchor="middle" font-size="12" fill="#1f2937">10⁻¹⁰</text><line x1="131.1" y1="172.0" x2="131.1" y2="184.0" stroke="#475569" stroke-width="1.5"/><text x="131.1" y="200.0" text-anchor="middle" font-size="12" fill="#1f2937">10⁻⁸</text><line x1="202.2" y1="172.0" x2="202.2" y2="184.0" stroke="#475569" stroke-width="1.5"/><text x="202.2" y="200.0" text-anchor="middle" font-size="12" fill="#1f2937">10⁻⁶</text><line x1="273.3" y1="172.0" x2="273.3" y2="184.0" stroke="#475569" stroke-width="1.5"/><text x="273.3" y="200.0" text-anchor="middle" font-size="12" fill="#1f2937">10⁻⁴</text><line x1="344.4" y1="172.0" x2="344.4" y2="184.0" stroke="#475569" stroke-width="1.5"/><text x="344.4" y="200.0" text-anchor="middle" font-size="12" fill="#1f2937">10⁻²</text><line x1="415.6" y1="172.0" x2="415.6" y2="184.0" stroke="#475569" stroke-width="1.5"/><text x="415.6" y="200.0" text-anchor="middle" font-size="12" fill="#1f2937">10⁰</text><line x1="486.7" y1="172.0" x2="486.7" y2="184.0" stroke="#475569" stroke-width="1.5"/><text x="486.7" y="200.0" text-anchor="middle" font-size="12" fill="#1f2937">10²</text><line x1="557.8" y1="172.0" x2="557.8" y2="184.0" stroke="#475569" stroke-width="1.5"/><text x="557.8" y="200.0" text-anchor="middle" font-size="12" fill="#1f2937">10⁴</text><line x1="628.9" y1="172.0" x2="628.9" y2="184.0" stroke="#475569" stroke-width="1.5"/><text x="628.9" y="200.0" text-anchor="middle" font-size="12" fill="#1f2937">10⁶</text><line x1="700.0" y1="172.0" x2="700.0" y2="184.0" stroke="#475569" stroke-width="1.5"/><text x="700.0" y="200.0" text-anchor="middle" font-size="12" fill="#1f2937">10⁸</text>
  <line x1="120.4" y1="178.0" x2="120.4" y2="140.0" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/><circle cx="120.4" cy="178.0" r="6" fill="#fde68a" stroke="#d97706" stroke-width="2"/><text x="120.4" y="120.0" text-anchor="middle" font-size="13" fill="#1f2937">protein pulled by a motor</text><text x="120.4" y="136.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">5 × 10⁻⁹</text><line x1="254.7" y1="178.0" x2="254.7" y2="224.0" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/><circle cx="254.7" cy="178.0" r="6" fill="#fde68a" stroke="#d97706" stroke-width="2"/><text x="254.7" y="226.0" text-anchor="middle" font-size="13" fill="#1f2937">E. coli swimming</text><text x="254.7" y="242.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">3 × 10⁻⁵</text><line x1="363.8" y1="178.0" x2="363.8" y2="128.0" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/><circle cx="363.8" cy="178.0" r="6" fill="#fde68a" stroke="#d97706" stroke-width="2"/><text x="363.8" y="108.0" text-anchor="middle" font-size="13" fill="#1f2937">protein at thermal speed</text><text x="363.8" y="124.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">0.035</text><line x1="369.3" y1="178.0" x2="369.3" y2="260.0" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/><circle cx="369.3" cy="178.0" r="6" fill="#fde68a" stroke="#d97706" stroke-width="2"/><text x="369.3" y="262.0" text-anchor="middle" font-size="13" fill="#1f2937">microfluidic channel</text><text x="369.3" y="278.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">0.05</text><line x1="639.6" y1="178.0" x2="639.6" y2="140.0" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/><circle cx="639.6" cy="178.0" r="6" fill="#fde68a" stroke="#d97706" stroke-width="2"/><text x="639.6" y="120.0" text-anchor="middle" font-size="13" fill="#1f2937">human swimmer</text><text x="639.6" y="136.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">2 × 10⁶</text>
  <text x="380" y="314" text-anchor="middle" font-size="12" fill="#475569">Log scale. Sizes and speeds are illustrative round values in water, except the E. coli speed (30 µm/s).</text>
</svg>
