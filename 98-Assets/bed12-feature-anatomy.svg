<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="758" height="338" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">One BED12 line: blocks, thick part and 0-based boundaries</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" font-family="Courier New, monospace" fill="#1f2937">chr1 100 1000 txA 0 + 248 900 0 3 200,150,150, 0,400,750</text>
  <text x="380" y="82" text-anchor="middle" font-size="12" fill="#475569">(invented toy transcript on the + strand; x axis: 1 px = 1.5 bp)</text>
  <!-- introns: thin line with chevrons pointing in the + direction -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="213" y1="160" x2="347" y2="160"/>
    <line x1="447" y1="160" x2="580" y2="160"/>
    <polyline points="256,154 262,160 256,166"/><polyline points="298,154 304,160 298,166"/>
    <polyline points="492,154 498,160 492,166"/><polyline points="534,154 540,160 534,166"/>
  </g>
  <!-- blocks: thin (outside thickStart..thickEnd) and thick parts -->
  <g stroke="#475569" stroke-width="1.5">
    <rect x="80" y="152" width="99" height="16" fill="#bfdbfe"/>
    <rect x="179" y="143" width="34" height="34" fill="#93c5fd"/>
    <rect x="347" y="143" width="100" height="34" fill="#93c5fd"/>
    <rect x="580" y="143" width="33" height="34" fill="#93c5fd"/>
    <rect x="613" y="152" width="67" height="16" fill="#bfdbfe"/>
  </g>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="146" y="134">block 1: 100 + 0, size 200</text>
    <text x="397" y="134">block 2: 100 + 400, size 150</text>
    <text x="630" y="134">block 3: 100 + 750, size 150</text>
  </g>
  <!-- axis with 0-based boundary ticks -->
  <line x1="80" y1="205" x2="680" y2="205" stroke="#475569" stroke-width="1.5"/>
  <g stroke="#475569" stroke-width="1.5">
    <line x1="80" y1="199" x2="80" y2="211"/><line x1="179" y1="199" x2="179" y2="211"/>
    <line x1="213" y1="199" x2="213" y2="211"/><line x1="347" y1="199" x2="347" y2="211"/>
    <line x1="447" y1="199" x2="447" y2="211"/><line x1="580" y1="199" x2="580" y2="211"/>
    <line x1="613" y1="199" x2="613" y2="211"/><line x1="680" y1="199" x2="680" y2="211"/>
  </g>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="80" y="226">100</text><text x="177" y="226">248</text><text x="215" y="226">300</text>
    <text x="347" y="226">500</text><text x="447" y="226">650</text><text x="578" y="226">850</text>
    <text x="615" y="226">900</text><text x="680" y="226">1000</text>
  </g>
  <g font-size="12" fill="#1e3a8a" text-anchor="middle">
    <text x="80" y="244">chromStart</text><text x="179" y="244">thickStart</text>
    <text x="613" y="244">thickEnd</text><text x="680" y="244">chromEnd</text>
  </g>
  <!-- legend -->
  <rect x="80" y="270" width="30" height="16" fill="#93c5fd" stroke="#475569"/>
  <text x="118" y="283" font-size="12" fill="#1f2937">thick: inside thickStart..thickEnd (e.g. coding part)</text>
  <rect x="430" y="274" width="30" height="8" fill="#bfdbfe" stroke="#475569"/>
  <text x="468" y="283" font-size="12" fill="#1f2937">thin: rest of a block (e.g. UTR)</text>
  <line x1="80" y1="310" x2="110" y2="310" stroke="#64748b" stroke-width="2"/>
  <text x="118" y="314" font-size="12" fill="#1f2937">gap between blocks (e.g. intron); chevrons give the strand</text>
</svg>
