<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 610" width="820" height="610" font-family="Helvetica, Arial, sans-serif">
  <title>Gene structure: eukaryotic split gene and bacterial operon</title>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="816" height="606" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Gene structure: eukaryotic split gene and bacterial operon</text>

  <!-- A: eukaryotic gene on DNA -->
  <text x="30" y="64" font-size="14" font-weight="bold" fill="#1f2937">A. Eukaryotic protein-coding gene (DNA, coding strand shown 5' to 3')</text>
  <line x1="40" y1="120" x2="780" y2="120" stroke="#94a3b8" stroke-width="3"/>
  <text x="20" y="125" font-size="13" font-weight="bold" fill="#475569">5'</text>
  <text x="786" y="125" font-size="13" font-weight="bold" fill="#475569">3'</text>
  <rect x="60" y="108" width="80" height="24" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="100" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">TATA</text>
  <text x="100" y="100" text-anchor="middle" font-size="13" fill="#1f2937">promoter</text>
  <path d="M160,104 V84 H188" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#head)"/>
  <text x="196" y="89" font-size="13" font-weight="bold" fill="#166534">+1</text>
  <rect x="160" y="112" width="40" height="16" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <rect x="200" y="104" width="60" height="32" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="380" y="104" width="90" height="32" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="570" y="104" width="50" height="32" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="620" y="112" width="80" height="16" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="320" y="100" text-anchor="middle" font-size="13" fill="#475569">intron 1</text>
  <text x="520" y="100" text-anchor="middle" font-size="13" fill="#475569">intron 2</text>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="200" y="154">ATG</text>
    <text x="274" y="154">GT</text>
    <text x="366" y="154">AG</text>
    <text x="484" y="154">GT</text>
    <text x="556" y="154">AG</text>
    <text x="620" y="154">stop</text>
    <text x="672" y="154">AATAAA</text>
  </g>
  <g font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
    <text x="210" y="176">exon 1</text>
    <text x="425" y="176">exon 2</text>
    <text x="635" y="176">exon 3</text>
  </g>

  <!-- B: pre-mRNA -->
  <text x="30" y="210" font-size="14" font-weight="bold" fill="#1f2937">B. Primary transcript (pre-mRNA): exons and introns are both transcribed</text>
  <line x1="260" y1="240" x2="380" y2="240" stroke="#94a3b8" stroke-width="3"/>
  <line x1="470" y1="240" x2="570" y2="240" stroke="#94a3b8" stroke-width="3"/>
  <rect x="160" y="233" width="40" height="14" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <rect x="200" y="228" width="60" height="24" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="380" y="228" width="90" height="24" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="570" y="228" width="50" height="24" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="620" y="233" width="80" height="14" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="140" y="245" font-size="13" font-weight="bold" fill="#475569">5'</text>
  <text x="708" y="245" font-size="13" font-weight="bold" fill="#475569">3'</text>
  <line x1="410" y1="262" x2="410" y2="292" stroke="#475569" stroke-width="2" marker-end="url(#head)"/>
  <text x="422" y="282" font-size="13" fill="#1f2937">splicing removes the introns; a 5' cap and a poly(A) tail are added</text>

  <!-- C: mature mRNA -->
  <text x="30" y="316" font-size="14" font-weight="bold" fill="#1f2937">C. Mature mRNA</text>
  <circle cx="150" cy="350" r="11" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="150" y="330" text-anchor="middle" font-size="12" fill="#1f2937">5' cap (m7G)</text>
  <line x1="161" y1="350" x2="165" y2="350" stroke="#94a3b8" stroke-width="3"/>
  <rect x="165" y="343" width="40" height="14" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <rect x="205" y="338" width="200" height="24" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="265" y1="338" x2="265" y2="362" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="355" y1="338" x2="355" y2="362" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="405" y="343" width="80" height="14" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="490" y="355" font-size="14" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#92400e">AAAAAAAAAA</text>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="185" y="384">5' UTR</text>
    <text x="305" y="384">coding sequence (CDS)</text>
    <text x="445" y="384">3' UTR</text>
    <text x="545" y="384">poly(A) tail</text>
    <text x="305" y="400">AUG ... stop</text>
  </g>
  <text x="640" y="344" font-size="12" fill="#475569">dashed lines:</text>
  <text x="640" y="360" font-size="12" fill="#475569">exon-exon junctions</text>

  <!-- D: operon -->
  <text x="30" y="436" font-size="14" font-weight="bold" fill="#1f2937">D. Bacterial operon: one promoter, several genes, one polycistronic mRNA</text>
  <line x1="40" y1="476" x2="780" y2="476" stroke="#94a3b8" stroke-width="3"/>
  <rect x="60" y="464" width="70" height="24" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="130" y="464" width="40" height="24" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="92" y="458" text-anchor="middle" font-size="12" fill="#1f2937">promoter</text>
  <text x="152" y="458" text-anchor="middle" font-size="12" fill="#1f2937">operator</text>
  <rect x="190" y="462" width="130" height="28" rx="4" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="335" y="462" width="120" height="28" rx="4" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="470" y="462" width="120" height="28" rx="4" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <g font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">
    <text x="255" y="481">gene A</text>
    <text x="395" y="481">gene B</text>
    <text x="530" y="481">gene C</text>
  </g>
  <rect x="604" y="466" width="18" height="20" rx="3" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="630" y="458" font-size="12" fill="#1f2937">terminator</text>
  <line x1="180" y1="530" x2="612" y2="530" stroke="#f97316" stroke-width="4"/>
  <rect x="195" y="523" width="120" height="14" fill="#fdba74" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="340" y="523" width="110" height="14" fill="#fdba74" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="475" y="523" width="110" height="14" fill="#fdba74" stroke="#c2410c" stroke-width="1.2"/>
  <text x="162" y="535" font-size="13" font-weight="bold" fill="#c2410c">5'</text>
  <text x="618" y="535" font-size="13" font-weight="bold" fill="#c2410c">3'</text>
  <line x1="660" y1="492" x2="660" y2="520" stroke="#475569" stroke-width="2" marker-end="url(#head)"/>
  <text x="672" y="512" font-size="12" fill="#1f2937">transcription</text>
  <text x="400" y="560" text-anchor="middle" font-size="12" fill="#1f2937">one mRNA, three coding sequences, each with its own start and stop codon</text>

  <text x="410" y="596" text-anchor="middle" font-size="12" fill="#475569">Schematic, not to scale. Blue: coding sequence. Yellow: untranslated regions (UTRs). +1: transcription start site.</text>
</svg>
