<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="758" height="358" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Penetrance and expressivity: two questions about carriers</text>
  <text x="380" y="52" text-anchor="middle" font-size="13" fill="#475569">Every circle is a carrier of the same genotype, Aa, for a dominant disorder</text>
  <rect x="20" y="68" width="350" height="226" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="195" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Penetrance</text>
  <text x="195" y="114" text-anchor="middle" font-size="12" fill="#475569">How many carriers show the trait at all?</text>
  <circle cx="75" cy="160" r="20" fill="#64748b" stroke="#334155" stroke-width="1.5"/><text x="75" y="164" text-anchor="middle" font-size="12" fill="#f8fafc">Aa</text><circle cx="135" cy="160" r="20" fill="#64748b" stroke="#334155" stroke-width="1.5"/><text x="135" y="164" text-anchor="middle" font-size="12" fill="#f8fafc">Aa</text><circle cx="195" cy="160" r="20" fill="#64748b" stroke="#334155" stroke-width="1.5"/><text x="195" y="164" text-anchor="middle" font-size="12" fill="#f8fafc">Aa</text><circle cx="255" cy="160" r="20" fill="#64748b" stroke="#334155" stroke-width="1.5"/><text x="255" y="164" text-anchor="middle" font-size="12" fill="#f8fafc">Aa</text><circle cx="315" cy="160" r="20" fill="#64748b" stroke="#334155" stroke-width="1.5"/><text x="315" y="164" text-anchor="middle" font-size="12" fill="#f8fafc">Aa</text><circle cx="75" cy="215" r="20" fill="#64748b" stroke="#334155" stroke-width="1.5"/><text x="75" y="219" text-anchor="middle" font-size="12" fill="#f8fafc">Aa</text><circle cx="135" cy="215" r="20" fill="#64748b" stroke="#334155" stroke-width="1.5"/><text x="135" y="219" text-anchor="middle" font-size="12" fill="#f8fafc">Aa</text><circle cx="195" cy="215" r="20" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="195" y="219" text-anchor="middle" font-size="12" fill="#1f2937">Aa</text><circle cx="255" cy="215" r="20" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="255" y="219" text-anchor="middle" font-size="12" fill="#1f2937">Aa</text><circle cx="315" cy="215" r="20" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="315" y="219" text-anchor="middle" font-size="12" fill="#1f2937">Aa</text>
  <text x="195" y="268" text-anchor="middle" font-size="13" fill="#1f2937">7 of 10 carriers affected: penetrance 0.7</text>
  <rect x="390" y="68" width="350" height="226" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="565" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Expressivity</text>
  <text x="565" y="114" text-anchor="middle" font-size="12" fill="#475569">How strongly do the affected carriers show it?</text>
  <circle cx="430" cy="170" r="18" fill="#ddd6fe" stroke="#334155" stroke-width="1.5"/><text x="430" y="174" text-anchor="middle" font-size="12" fill="#1f2937">Aa</text><circle cx="475" cy="170" r="18" fill="#ddd6fe" stroke="#334155" stroke-width="1.5"/><text x="475" y="174" text-anchor="middle" font-size="12" fill="#1f2937">Aa</text><circle cx="520" cy="170" r="18" fill="#ddd6fe" stroke="#334155" stroke-width="1.5"/><text x="520" y="174" text-anchor="middle" font-size="12" fill="#1f2937">Aa</text><circle cx="565" cy="170" r="18" fill="#a78bfa" stroke="#334155" stroke-width="1.5"/><text x="565" y="174" text-anchor="middle" font-size="12" fill="#1f2937">Aa</text><circle cx="610" cy="170" r="18" fill="#a78bfa" stroke="#334155" stroke-width="1.5"/><text x="610" y="174" text-anchor="middle" font-size="12" fill="#1f2937">Aa</text><circle cx="655" cy="170" r="18" fill="#6d28d9" stroke="#334155" stroke-width="1.5"/><text x="655" y="174" text-anchor="middle" font-size="12" fill="#f8fafc">Aa</text><circle cx="700" cy="170" r="18" fill="#6d28d9" stroke="#334155" stroke-width="1.5"/><text x="700" y="174" text-anchor="middle" font-size="12" fill="#f8fafc">Aa</text>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="475" y="212">mild</text><text x="587" y="212">moderate</text><text x="677" y="212">severe</text>
  </g>
  <path d="M412,222 L538,222 M545,222 L628,222 M635,222 L718,222" stroke="#94a3b8" stroke-width="2"/>
  <text x="565" y="268" text-anchor="middle" font-size="13" fill="#1f2937">The 7 affected carriers differ in severity</text>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="380" y="320">Penetrance is a probability over carriers; expressivity describes severity among the affected.</text>
    <text x="380" y="340">Both are shaped by other genes, by the environment and by chance.</text>
  </g>
</svg>
