<text x="396.3" y="312.9" text-anchor="middle" font-size="13" font-family="monospace" fill="#1f2937">0101</text>
<text x="344.6" y="291.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">5</text>
<text x="316.8" y="280.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">5</text>
<circle cx="336.1" cy="346.1" r="4" fill="#64748b"/>
<text x="357.3" y="371.3" text-anchor="middle" font-size="13" font-family="monospace" fill="#1f2937">0110</text>
<text x="317.7" y="331.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">6</text>
<text x="296.5" y="310.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">6</text>
<circle cx="287.4" cy="378.6" r="4" fill="#64748b"/>
<text x="298.9" y="410.3" text-anchor="middle" font-size="13" font-family="monospace" fill="#1f2937">0111</text>
<text x="277.5" y="358.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">7</text>
<text x="266.0" y="330.8" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">7</text>
<circle cx="230.0" cy="390.0" r="4" fill="#64748b"/>
<text x="230.0" y="424.0" text-anchor="middle" font-size="13" font-family="monospace" fill="#1f2937">1000</text>
<text x="230.0" y="368.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">8</text>
<text x="230.0" y="338.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">−8</text>
<circle cx="172.6" cy="378.6" r="4" fill="#64748b"/>
<text x="161.1" y="410.3" text-anchor="middle" font-size="13" font-family="monospace" fill="#1f2937">1001</text>
<text x="182.5" y="358.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">9</text>
<text x="194.0" y="330.8" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">−7</text>
<circle cx="123.9" cy="346.1" r="4" fill="#64748b"/>
<text x="102.7" y="371.3" text-anchor="middle" font-size="13" font-family="monospace" fill="#1f2937">1010</text>
<text x="142.3" y="331.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">10</text>
<text x="163.5" y="310.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">−6</text>
<circle cx="91.4" cy="297.4" r="4" fill="#64748b"/>
<text x="63.7" y="312.9" text-anchor="middle" font-size="13" font-family="monospace" fill="#1f2937">1011</text>
<text x="115.4" y="291.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">11</text>
<text x="143.2" y="280.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">−5</text>
<circle cx="80.0" cy="240.0" r="4" fill="#64748b"/>
<text x="50.0" y="244.0" text-anchor="middle" font-size="13" font-family="monospace" fill="#1f2937">1100</text>
<text x="106.0" y="244.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">12</text>
<text x="136.0" y="244.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">−4</text>
<circle cx="91.4" cy="182.6" r="4" fill="#64748b"/>
<text x="63.7" y="175.1" text-anchor="middle" font-size="13" font-family="monospace" fill="#1f2937">1101</text>
<text x="115.4" y="196.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">13</text>
<text x="143.2" y="208.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">−3</text>
<circle cx="123.9" cy="133.9" r="4" fill="#64748b"/>
<text x="102.7" y="116.7" text-anchor="middle" font-size="13" font-family="monospace" fill="#1f2937">1110</text>
<text x="142.3" y="156.3" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">14</text>
<text x="163.5" y="177.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">−2</text>
<circle cx="172.6" cy="101.4" r="4" fill="#64748b"/>
<text x="161.1" y="77.7" text-anchor="middle" font-size="13" font-family="monospace" fill="#1f2937">1111</text>
<text x="182.5" y="129.4" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">15</text>
<text x="194.0" y="157.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">−1</text>
<line x1="216.3" y1="171.3" x2="198.0" y2="79.2" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 4"/>
<line x1="243.7" y1="308.7" x2="262.0" y2="400.8" stroke="#d97706" stroke-width="3" stroke-dasharray="6 4"/>
<text x="230" y="236" text-anchor="middle" font-size="12" fill="#1f2937">blue: unsigned</text>
<text x="230" y="254" text-anchor="middle" font-size="12" fill="#1f2937">orange: signed</text>
<text x="450" y="76" font-size="13" font-weight="bold" fill="#1f2937">Three readings of the same 4 bits</text>
<text x="450" y="100" font-size="13" font-weight="normal" fill="#1f2937">outer ring: bit pattern</text>
<text x="450" y="120" font-size="13" font-weight="normal" fill="#1d4ed8">blue: unsigned value, 0 to 15</text>
<text x="450" y="140" font-size="13" font-weight="normal" fill="#b45309">orange: two's complement value, −8 to 7</text>
<text x="450" y="176" font-size="13" font-weight="bold" fill="#1f2937">Crossing a dashed line</text>
<text x="450" y="200" font-size="13" font-weight="normal" fill="#1d4ed8">1111 + 1 = 0000: unsigned 15 becomes 0</text>
<text x="450" y="220" font-size="13" font-weight="normal" fill="#b45309">0111 + 1 = 1000: signed 7 becomes −8</text>
<text x="450" y="240" font-size="13" font-weight="normal" fill="#1f2937">the hardware keeps the low 4 bits, silently</text>
<text x="450" y="276" font-size="13" font-weight="bold" fill="#1f2937">Negation: flip the bits, add 1</text>
<text x="450" y="300" font-size="13" font-weight="normal" fill="#1f2937">5 = 0101 → 1010 → 1011 = −5</text>
<text x="450" y="320" font-size="13" font-weight="normal" fill="#1f2937">−8 = 1000 → 0111 → 1000: −(−8) = −8</text>
<text x="450" y="356" font-size="13" font-weight="bold" fill="#1f2937">Same wheel, more positions</text>
<text x="450" y="380" font-size="13" font-weight="normal" fill="#1f2937">uint8: 256 positions (250 + 10 = 4)</text>
<text x="450" y="400" font-size="13" font-weight="normal" fill="#1f2937">int32: 2³² positions (2³¹ − 1 + 1 = −2³¹)</text>
</svg>
