<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect x="2" y="2" width="716" height="396" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Law of total probability: one read base, summed over genotypes</text>

  <!-- Partition labels -->
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="140" y="58" font-weight="bold">B₁ = CC</text>
    <text x="140" y="74">P(CC) = 0.81</text>
    <text x="315" y="58" font-weight="bold">B₂ = CT</text>
    <text x="315" y="74">P(CT) = 0.18</text>
    <text x="415" y="58" font-weight="bold">B₃ = TT</text>
    <text x="415" y="74">0.01</text>
  </g>

  <!-- Sample space split into three genotype columns -->
  <rect x="30" y="80" width="220" height="250" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/>
  <rect x="250" y="80" width="130" height="250" fill="#ede9fe" stroke="#64748b" stroke-width="1.5"/>
  <rect x="380" y="80" width="70" height="250" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/>
  <rect x="30" y="80" width="420" height="250" fill="none" stroke="#475569" stroke-width="2"/>

  <!-- Event T = read shows T, bottom-aligned, height proportional to P(T | genotype) -->
  <rect x="30" y="326" width="220" height="4" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
  <rect x="250" y="206" width="130" height="124" fill="#fca5a5" fill-opacity="0.85" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="380" y="83" width="70" height="247" fill="#fca5a5" fill-opacity="0.85" stroke="#dc2626" stroke-width="1.5"/>

  <g font-size="13" fill="#1f2937">
    <text x="140" y="300" text-anchor="middle">P(T | CC) = 0.0033</text>
    <text x="140" y="316" text-anchor="middle">(thin band below)</text>
    <text x="315" y="262" text-anchor="middle">P(T | CT)</text>
    <text x="315" y="279" text-anchor="middle">= 0.4967</text>
    <text x="420" y="206" text-anchor="middle" transform="rotate(-90 420 206)">P(T | TT) = 0.99</text>
  </g>

  <g font-size="13" fill="#1f2937">
    <text x="30" y="354">Shaded: the event T = "read shows T"; height = P(T | genotype).</text>
    <text x="30" y="372">Column widths not to scale; the CC band is exaggerated.</text>
  </g>

  <!-- Right panel: the computation -->
  <g font-size="13" fill="#1f2937">
    <text x="475" y="92" font-size="14" font-weight="bold">Partition of Ω by genotype</text>
    <text x="475" y="114">B₁, B₂, B₃ disjoint, union = Ω</text>
    <text x="475" y="148" font-size="14" font-weight="bold">P(T) = Σ P(T | Bᵢ) P(Bᵢ)</text>
    <text x="475" y="174">CC: 0.0033 × 0.81 = 0.0027</text>
    <text x="475" y="194">CT: 0.4967 × 0.18 = 0.0894</text>
    <text x="475" y="214">TT: 0.9900 × 0.01 = 0.0099</text>
    <text x="475" y="240" font-size="14" font-weight="bold">P(T) = 0.1020</text>
    <text x="475" y="278">Model (invented): T allele</text>
    <text x="475" y="296">frequency q = 0.1, Hardy-Weinberg</text>
    <text x="475" y="314">priors, error rate e = 0.01 (Q20);</text>
    <text x="475" y="332">an error gives each other base</text>
    <text x="475" y="350">with probability e/3.</text>
  </g>
</svg>
