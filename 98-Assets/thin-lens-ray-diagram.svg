<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Helvetica, Arial, sans-serif">
<rect x="1" y="1" width="798" height="398" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Thin converging lens: object between f and 2f gives a real, inverted, enlarged image</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs>
<line x1="40.0" y1="215.0" x2="760.0" y2="215.0" stroke="#475569" stroke-width="1"/>
<ellipse cx="360" cy="215" rx="14" ry="135" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<circle cx="260" cy="215" r="3.5" fill="#1f2937"/>
<text x="260.0" y="235.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1f2937">F</text>
<circle cx="460" cy="215" r="3.5" fill="#1f2937"/>
<text x="460.0" y="235.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1f2937">F′</text>
<circle cx="160" cy="215" r="3.5" fill="#1f2937"/>
<text x="160.0" y="235.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1f2937">2F</text>
<circle cx="560" cy="215" r="3.5" fill="#1f2937"/>
<text x="560.0" y="235.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1f2937">2F′</text>
<line x1="210.0" y1="215.0" x2="210.0" y2="155.0" stroke="#059669" stroke-width="3" marker-end="url(#ah)"/>
<text x="202.0" y="149.0" text-anchor="end" font-size="13" font-weight="bold" fill="#059669">object</text>
<line x1="660.0" y1="215.0" x2="660.0" y2="335.0" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah)"/>
<text x="674.0" y="357.0" text-anchor="start" font-size="13" font-weight="bold" fill="#7c3aed">image</text>
<line x1="210.0" y1="155.0" x2="360.0" y2="155.0" stroke="#ea580c" stroke-width="1.8"/>
<line x1="360.0" y1="155.0" x2="700.0" y2="359.0" stroke="#ea580c" stroke-width="1.8"/>
<line x1="210.0" y1="155.0" x2="700.0" y2="351.0" stroke="#dc2626" stroke-width="1.8"/>
<line x1="210.0" y1="155.0" x2="360.0" y2="335.0" stroke="#2563eb" stroke-width="1.8"/>
<line x1="360.0" y1="335.0" x2="700.0" y2="335.0" stroke="#2563eb" stroke-width="1.8"/>
<line x1="210.0" y1="365.0" x2="360.0" y2="365.0" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="360.0" y1="365.0" x2="210.0" y2="365.0" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="285.0" y="359.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1f2937">d_o = 1.5 f</text>
<line x1="360.0" y1="365.0" x2="660.0" y2="365.0" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="660.0" y1="365.0" x2="360.0" y2="365.0" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="510.0" y="359.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1f2937">d_i = 3 f</text>
<text x="600.0" y="70.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">1/d_o + 1/d_i = 1/f</text>
<text x="600.0" y="90.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">m = −d_i/d_o = -2</text>
<text x="140.0" y="70.0" text-anchor="start" font-size="12" font-weight="normal" fill="#ea580c">orange: parallel ray → through F′</text>
<text x="140.0" y="86.0" text-anchor="start" font-size="12" font-weight="normal" fill="#dc2626">red: through the centre, undeviated</text>
<text x="140.0" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#2563eb">blue: through F → leaves parallel</text>
</svg>
