<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="758" height="448" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="380" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Redox tower: electrons flow toward the more positive standard potential</text>
<text x="380" y="54" text-anchor="middle" font-size="13" fill="#475569">Standard reduction potentials E°′ at pH 7 (biochemical standard state)</text>
<line x1="110" y1="80.0" x2="110" y2="380.0" stroke="#64748b" stroke-width="1.5"/>
<line x1="104" y1="80.0" x2="110" y2="80.0" stroke="#64748b"/>
<text x="98" y="84.0" text-anchor="end" font-size="12" fill="#1f2937">−0.4</text>
<line x1="104" y1="126.2" x2="110" y2="126.2" stroke="#64748b"/>
<text x="98" y="130.2" text-anchor="end" font-size="12" fill="#1f2937">−0.2</text>
<line x1="104" y1="172.3" x2="110" y2="172.3" stroke="#64748b"/>
<text x="98" y="176.3" text-anchor="end" font-size="12" fill="#1f2937">0.0</text>
<line x1="104" y1="218.5" x2="110" y2="218.5" stroke="#64748b"/>
<text x="98" y="222.5" text-anchor="end" font-size="12" fill="#1f2937">+0.2</text>
<line x1="104" y1="264.6" x2="110" y2="264.6" stroke="#64748b"/>
<text x="98" y="268.6" text-anchor="end" font-size="12" fill="#1f2937">+0.4</text>
<line x1="104" y1="310.8" x2="110" y2="310.8" stroke="#64748b"/>
<text x="98" y="314.8" text-anchor="end" font-size="12" fill="#1f2937">+0.6</text>
<line x1="104" y1="356.9" x2="110" y2="356.9" stroke="#64748b"/>
<text x="98" y="360.9" text-anchor="end" font-size="12" fill="#1f2937">+0.8</text>
<text x="40" y="230.0" text-anchor="middle" font-size="13" fill="#1f2937" transform="rotate(-90 40 230.0)">E°′ (V)</text>
<rect x="140" y="93.5" width="170" height="10" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
<text x="320" y="103.5" font-size="13" fill="#1f2937"><tspan font-weight="bold">NAD+ / NADH</tspan>  −0.32 V</text>
<rect x="140" y="123.5" width="170" height="10" rx="3" fill="#fef3c7" stroke="#d97706"/>
<text x="320" y="133.5" font-size="13" fill="#1f2937"><tspan font-weight="bold">pyruvate / lactate</tspan>  −0.19 V</text>
<rect x="140" y="356.5" width="170" height="10" rx="3" fill="#dcfce7" stroke="#16a34a"/>
<text x="320" y="366.5" font-size="13" fill="#1f2937"><tspan font-weight="bold">O₂ / H₂O</tspan>  +0.82 V</text>
<line x1="180" y1="104.5" x2="180" y2="354.5" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="270" y1="104.5" x2="270" y2="121.5" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
<text x="200" y="236.9" font-size="13" fill="#1f2937">NADH → O₂ (respiratory chain)</text>
<text x="200" y="254.9" font-size="13" fill="#1f2937">ΔE°′ = +1.14 V, ΔG°′ ≈ −220 kJ/mol</text>
<text x="200" y="158.5" font-size="12" fill="#1f2937">NADH → pyruvate (lactate dehydrogenase)</text>
<text x="200" y="174.5" font-size="12" fill="#1f2937">ΔE°′ = +0.13 V, ΔG°′ ≈ −25 kJ/mol</text>
<text x="380" y="432" text-anchor="middle" font-size="12" fill="#475569">ΔG°′ = −nFΔE°′ with n = 2 electrons; the larger the drop, the more free energy released</text>
</svg>
