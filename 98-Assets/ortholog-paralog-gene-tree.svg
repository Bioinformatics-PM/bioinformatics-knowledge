<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker></defs>
<rect x="0" y="0" width="800" height="480" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400.0" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Orthologs and paralogs: the event at the last common ancestor decides</text>
<line x1="290" y1="100" x2="290" y2="245" stroke="#e2e8f0" stroke-width="86" stroke-linecap="round"/>
<line x1="290" y1="245" x2="150" y2="385" stroke="#e2e8f0" stroke-width="86" stroke-linecap="round"/>
<line x1="290" y1="245" x2="430" y2="385" stroke="#e2e8f0" stroke-width="86" stroke-linecap="round"/>
<text x="150.0" y="449.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748b">human</text>
<text x="430.0" y="449.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748b">mouse</text>
<text x="344.0" y="106.0" text-anchor="start" font-size="12" font-weight="normal" fill="#64748b">ancestral species</text>
<line x1="290" y1="100" x2="290" y2="150" stroke="#64748b" stroke-width="3"/>
<polyline points="290,150 268,180 268,245" fill="none" stroke="#2563eb" stroke-width="3"/>
<polyline points="290,150 312,180 312,245" fill="none" stroke="#ea580c" stroke-width="3"/>
<line x1="268" y1="245" x2="128" y2="385" stroke="#2563eb" stroke-width="3"/>
<line x1="268" y1="245" x2="408" y2="385" stroke="#2563eb" stroke-width="3"/>
<line x1="312" y1="245" x2="172" y2="385" stroke="#ea580c" stroke-width="3"/>
<line x1="312" y1="245" x2="452" y2="385" stroke="#ea580c" stroke-width="3"/>
<circle cx="268" cy="245" r="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="268.0" y="249.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">S</text>
<circle cx="312" cy="245" r="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="312.0" y="249.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">S</text>
<rect x="280" y="140" width="20" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="290.0" y="155.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">D</text>
<circle cx="128" cy="385" r="5" fill="#2563eb"/>
<text x="128.0" y="409.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">α</text>
<circle cx="172" cy="385" r="5" fill="#ea580c"/>
<text x="172.0" y="409.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#ea580c">β</text>
<circle cx="408" cy="385" r="5" fill="#2563eb"/>
<text x="408.0" y="409.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">α</text>
<circle cx="452" cy="385" r="5" fill="#ea580c"/>
<text x="452.0" y="409.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#ea580c">β</text>
<rect x="560" y="74" width="16" height="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="586.0" y="87.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1f2937">D: gene duplication</text>
<circle cx="568" cy="110" r="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="586.0" y="115.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1f2937">S: speciation</text>
<text x="560.0" y="160.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2937">Last common ancestor of the pair:</text>
<text x="560.0" y="190.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1f2937">α human – α mouse</text>
<text x="574.0" y="207.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1d4ed8">→ S, so orthologs</text>
<text x="560.0" y="230.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1f2937">β human – β mouse</text>
<text x="574.0" y="247.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1d4ed8">→ S, so orthologs</text>
<text x="560.0" y="270.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1f2937">α human – β human</text>
<text x="574.0" y="287.0" text-anchor="start" font-size="13" font-weight="bold" fill="#b91c1c">→ D, so paralogs</text>
<text x="560.0" y="310.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1f2937">α human – β mouse</text>
<text x="574.0" y="327.0" text-anchor="start" font-size="13" font-weight="bold" fill="#b91c1c">→ D, so paralogs</text>
<text x="560.0" y="362.0" text-anchor="start" font-size="12" font-weight="normal" fill="#64748b">Different species does not</text>
<text x="560.0" y="378.0" text-anchor="start" font-size="12" font-weight="normal" fill="#64748b">imply orthology (last row).</text>
</svg>
