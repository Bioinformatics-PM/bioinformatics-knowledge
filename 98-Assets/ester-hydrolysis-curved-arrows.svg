<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 548" font-family="Helvetica, Arial, sans-serif" font-size="16">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="548" rx="16" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Ester hydrolysis in base: curved-arrow mechanism</text>

  <!-- Panel 1: addition -->
  <rect x="20" y="48" width="350" height="225" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="60" y="175" text-anchor="middle" fill="#1f2937">H</text>
  <line x1="68" y1="170" x2="85" y2="170" stroke="#475569" stroke-width="2"/>
  <text x="95" y="175" text-anchor="middle" fill="#1f2937">O</text>
  <circle cx="107" cy="165" r="2" fill="#1f2937"/><circle cx="107" cy="175" r="2" fill="#1f2937"/>
  <text x="100" y="156" font-size="14" fill="#1f2937">−</text>
  <text x="205" y="175" text-anchor="middle" fill="#1f2937">C</text>
  <line x1="201" y1="158" x2="201" y2="117" stroke="#475569" stroke-width="2"/>
  <line x1="209" y1="158" x2="209" y2="117" stroke="#475569" stroke-width="2"/>
  <text x="205" y="110" text-anchor="middle" fill="#1f2937">O</text>
  <line x1="216" y1="170" x2="254" y2="170" stroke="#475569" stroke-width="2"/>
  <text x="265" y="175" text-anchor="middle" fill="#1f2937">O</text>
  <line x1="276" y1="170" x2="296" y2="170" stroke="#475569" stroke-width="2"/>
  <text x="310" y="175" text-anchor="middle" fill="#1f2937">R′</text>
  <line x1="205" y1="182" x2="205" y2="218" stroke="#475569" stroke-width="2"/>
  <text x="205" y="237" text-anchor="middle" fill="#1f2937">R</text>
  <path d="M111,160 Q150,110 192,160" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M213,142 C245,138 245,106 222,104" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>
  <text x="195" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">1. Addition</text>
  <text x="195" y="255" text-anchor="middle" font-size="13" fill="#1f2937">A lone pair of HO− attacks the carbonyl carbon;</text>
  <text x="195" y="268" text-anchor="middle" font-size="13" fill="#1f2937">the C=O π electrons move onto oxygen.</text>

  <text x="380" y="168" text-anchor="middle" font-size="22" fill="#475569">→</text>

  <!-- Panel 2: tetrahedral intermediate collapses -->
  <rect x="390" y="48" width="350" height="225" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="470" y="175" text-anchor="middle" fill="#1f2937">H</text>
  <line x1="478" y1="170" x2="495" y2="170" stroke="#475569" stroke-width="2"/>
  <text x="505" y="175" text-anchor="middle" fill="#1f2937">O</text>
  <line x1="515" y1="170" x2="553" y2="170" stroke="#475569" stroke-width="2"/>
  <text x="565" y="175" text-anchor="middle" fill="#1f2937">C</text>
  <line x1="565" y1="158" x2="565" y2="117" stroke="#475569" stroke-width="2"/>
  <text x="565" y="110" text-anchor="middle" fill="#1f2937">O</text>
  <circle cx="552" cy="100" r="2" fill="#1f2937"/><circle cx="552" cy="110" r="2" fill="#1f2937"/>
  <text x="575" y="96" font-size="14" fill="#1f2937">−</text>
  <line x1="576" y1="170" x2="614" y2="170" stroke="#475569" stroke-width="2"/>
  <text x="625" y="175" text-anchor="middle" fill="#1f2937">O</text>
  <line x1="636" y1="170" x2="656" y2="170" stroke="#475569" stroke-width="2"/>
  <text x="670" y="175" text-anchor="middle" fill="#1f2937">R′</text>
  <line x1="565" y1="182" x2="565" y2="218" stroke="#475569" stroke-width="2"/>
  <text x="565" y="237" text-anchor="middle" fill="#1f2937">R</text>
  <path d="M548,98 C520,100 522,138 558,138" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M595,166 Q606,132 622,156" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>
  <text x="565" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">2. Tetrahedral intermediate collapses</text>
  <text x="565" y="255" text-anchor="middle" font-size="13" fill="#1f2937">A lone pair of O− re-forms C=O and the</text>
  <text x="565" y="268" text-anchor="middle" font-size="13" fill="#1f2937">C–OR′ bond breaks: R′O− is the leaving group.</text>

  <!-- Panel 3: proton transfer -->
  <rect x="20" y="288" width="350" height="205" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="130" y="375" text-anchor="middle" fill="#1f2937">C</text>
  <line x1="126" y1="358" x2="126" y2="337" stroke="#475569" stroke-width="2"/>
  <line x1="134" y1="358" x2="134" y2="337" stroke="#475569" stroke-width="2"/>
  <text x="130" y="330" text-anchor="middle" fill="#1f2937">O</text>
  <line x1="141" y1="370" x2="179" y2="370" stroke="#475569" stroke-width="2"/>
  <text x="190" y="375" text-anchor="middle" fill="#1f2937">O</text>
  <line x1="200" y1="370" x2="217" y2="370" stroke="#475569" stroke-width="2"/>
  <text x="225" y="375" text-anchor="middle" fill="#1f2937">H</text>
  <line x1="130" y1="382" x2="130" y2="410" stroke="#475569" stroke-width="2"/>
  <text x="130" y="428" text-anchor="middle" fill="#1f2937">R</text>
  <circle cx="279" cy="365" r="2" fill="#1f2937"/><circle cx="279" cy="375" r="2" fill="#1f2937"/>
  <text x="292" y="375" text-anchor="middle" fill="#1f2937">O</text>
  <text x="298" y="356" font-size="14" fill="#1f2937">−</text>
  <line x1="302" y1="370" x2="318" y2="370" stroke="#475569" stroke-width="2"/>
  <text x="332" y="375" text-anchor="middle" fill="#1f2937">R′</text>
  <path d="M277,361 Q258,325 230,355" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M209,375 C214,402 194,404 191,386" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>
  <text x="195" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">3. Proton transfer</text>
  <text x="195" y="462" text-anchor="middle" font-size="13" fill="#1f2937">The strongly basic alkoxide takes the acid's proton;</text>
  <text x="195" y="476" text-anchor="middle" font-size="13" fill="#1f2937">this acid-base step drives hydrolysis to completion.</text>

  <text x="380" y="378" text-anchor="middle" font-size="22" fill="#475569">→</text>

  <!-- Panel 4: products -->
  <rect x="390" y="288" width="350" height="205" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="490" y="375" text-anchor="middle" fill="#1f2937">C</text>
  <line x1="486" y1="358" x2="486" y2="337" stroke="#475569" stroke-width="2"/>
  <line x1="494" y1="358" x2="494" y2="337" stroke="#475569" stroke-width="2"/>
  <text x="490" y="330" text-anchor="middle" fill="#1f2937">O</text>
  <line x1="501" y1="370" x2="539" y2="370" stroke="#475569" stroke-width="2"/>
  <text x="550" y="375" text-anchor="middle" fill="#1f2937">O</text>
  <text x="559" y="358" font-size="14" fill="#1f2937">−</text>
  <line x1="490" y1="382" x2="490" y2="410" stroke="#475569" stroke-width="2"/>
  <text x="490" y="428" text-anchor="middle" fill="#1f2937">R</text>
  <text x="595" y="375" text-anchor="middle" fill="#1f2937">+</text>
  <text x="630" y="375" text-anchor="middle" fill="#1f2937">H</text>
  <line x1="638" y1="370" x2="655" y2="370" stroke="#475569" stroke-width="2"/>
  <text x="665" y="375" text-anchor="middle" fill="#1f2937">O</text>
  <line x1="675" y1="370" x2="691" y2="370" stroke="#475569" stroke-width="2"/>
  <text x="705" y="375" text-anchor="middle" fill="#1f2937">R′</text>
  <text x="565" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">4. Products</text>
  <text x="510" y="452" text-anchor="middle" font-size="13" fill="#1f2937">carboxylate</text>
  <text x="667" y="452" text-anchor="middle" font-size="13" fill="#1f2937">alcohol</text>
  <text x="565" y="476" text-anchor="middle" font-size="13" fill="#1f2937">Net: RCOOR′ + HO− → RCOO− + R′OH</text>

  <text x="380" y="514" text-anchor="middle" font-size="13" fill="#334155">Red arrow: one electron pair moves from its tail (lone pair or bond) to its head (atom or new bond).</text>
  <text x="380" y="532" text-anchor="middle" font-size="13" fill="#334155">R, R′: carbon groups.</text>
</svg>
