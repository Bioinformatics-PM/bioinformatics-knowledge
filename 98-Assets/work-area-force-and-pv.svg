<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="wa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="756" height="376" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Work is an area: force along displacement, or pressure along volume</text>
  <!-- left panel -->
  <text x="205" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">(a) motor step against a constant load</text>
  <line x1="70" y1="300" x2="360" y2="300" stroke="#64748b" stroke-width="1.5" marker-end="url(#wa)"/>
  <line x1="70" y1="300" x2="70" y2="80" stroke="#64748b" stroke-width="1.5" marker-end="url(#wa)"/>
  <text x="355" y="322" text-anchor="end" font-size="13" fill="#1f2937">displacement x (nm)</text>
  <text x="40" y="190" text-anchor="middle" font-size="13" fill="#1f2937" transform="rotate(-90 40 190)">load force F (pN)</text>
  <rect x="110" y="170" width="120" height="130" fill="#fde68a" stroke="#f59e0b"/>
  <line x1="70" y1="170" x2="340" y2="170" stroke="#d97706" stroke-width="3"/>
  <text x="62" y="174" text-anchor="end" font-size="12" fill="#1f2937">6</text>
  <text x="110" y="318" text-anchor="middle" font-size="12" fill="#1f2937">x₀</text>
  <text x="230" y="318" text-anchor="middle" font-size="12" fill="#1f2937">x₀ + 8</text>
  <text x="170" y="230" text-anchor="middle" font-size="13" fill="#1f2937">W = F d</text>
  <text x="170" y="250" text-anchor="middle" font-size="13" fill="#1f2937">= 48 pN·nm</text>
  <text x="205" y="350" text-anchor="middle" font-size="13" fill="#1f2937">One 8-nm step at 6 pN: about 12 k_BT.</text>
  <line x1="392" y1="50" x2="392" y2="365" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- right panel -->
  <text x="580" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">(b) gas expanding at constant T</text>
