<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Helvetica, Arial, sans-serif">
  <title>Tertiary structure: a two-domain chain with its hydrophobic cores, salt bridge, disulfide and hydrogen bond</title>
  <rect x="2" y="2" width="796" height="466" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Tertiary structure: one chain, two domains (schematic cross-section)</text>

  <!-- water around the protein -->
  <g fill="#bae6fd" stroke="#0284c7" stroke-width="1">
    <circle cx="40" cy="120" r="7"/><circle cx="48" cy="285" r="7"/><circle cx="120" cy="395" r="7"/>
    <circle cx="300" cy="60" r="7"/><circle cx="405" cy="95" r="7"/><circle cx="430" cy="380" r="7"/>
    <circle cx="745" cy="150" r="7"/><circle cx="765" cy="392" r="7"/><circle cx="600" cy="400" r="7"/>
  </g>
  <text x="74" y="105" font-size="12" fill="#1f2937">water</text>

  <!-- domain 1 -->
  <ellipse cx="225" cy="230" rx="170" ry="150" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="225" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Domain 1 (all α)</text>
  <ellipse cx="225" cy="230" rx="75" ry="62" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="225" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">hydrophobic core</text>
  <text x="225" y="238" text-anchor="middle" font-size="12" fill="#1f2937">Leu Ile Val Phe Met</text>
  <text x="225" y="256" text-anchor="middle" font-size="12" fill="#1f2937">packed side chains</text>
  <!-- helices as cylinders around the core -->
  <g fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5">
    <rect x="160" y="125" width="130" height="28" rx="14"/>
    <rect x="160" y="307" width="130" height="28" rx="14"/>
    <rect x="113" y="168" width="28" height="124" rx="14"/>
    <rect x="309" y="168" width="28" height="124" rx="14"/>
  </g>
  <text x="225" y="144" text-anchor="middle" font-size="12" fill="#1f2937">α helix</text>
  <!-- salt bridge on the surface of domain 1 -->
  <circle cx="110" cy="312" r="13" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="150" cy="352" r="13" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="110" y="317" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">+</text>
  <text x="150" y="357" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">−</text>
  <line x1="119" y1="321" x2="141" y2="343" stroke="#db2777" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="64" y="322" font-size="12" fill="#1f2937">Lys</text>
  <text x="168" y="357" font-size="12" fill="#1f2937">Glu</text>
  <text x="55" y="378" font-size="12" fill="#1f2937">salt bridge</text>
  <!-- side-chain hydrogen bond on surface -->
  <circle cx="318" cy="128" r="11" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="352" cy="156" r="11" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1.5"/>
  <line x1="327" y1="135" x2="343" y2="149" stroke="#6d28d9" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="296" y="111" font-size="12" fill="#1f2937">Ser</text>
  <text x="370" y="161" font-size="12" fill="#1f2937">Asn: H bond</text>

  <!-- linker -->
  <path d="M 392 240 C 430 215 455 265 492 240" fill="none" stroke="#475569" stroke-width="3"/>
  <text x="442" y="282" text-anchor="middle" font-size="12" fill="#1f2937">linker</text>

  <!-- domain 2 -->
  <ellipse cx="620" cy="235" rx="130" ry="120" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Domain 2 (α + β)</text>
  <ellipse cx="620" cy="252" rx="55" ry="30" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="620" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">its own</text>
  <text x="620" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">core</text>
  <!-- beta sheet (three strands) above the core, helix below -->
  <g fill="#86efac" stroke="#166534" stroke-width="1.2">
    <polygon points="545,140 680,140 680,132 700,146 680,160 680,152 545,152"/>
    <polygon points="700,170 565,170 565,162 545,176 565,190 565,182 700,182"/>
    <polygon points="545,200 680,200 680,192 700,206 680,220 680,212 545,212"/>
  </g>
  <rect x="560" y="285" width="120" height="26" rx="13" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/>
  <text x="620" y="302" text-anchor="middle" font-size="12" fill="#1f2937">α helix</text>
  <text x="725" y="180" font-size="12" fill="#1f2937">β sheet</text>
  <!-- disulfide -->
  <circle cx="700" cy="300" r="10" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
  <circle cx="725" cy="245" r="10" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
  <line x1="704" y1="291" x2="721" y2="254" stroke="#c2410c" stroke-width="4"/>
  <text x="630" y="340" font-size="12" fill="#1f2937">Cys–S–S–Cys: disulfide</text>

  <!-- legend -->
  <g font-size="12" fill="#1f2937">
    <rect x="30" y="425" width="16" height="16" rx="4" fill="#fde68a" stroke="#b45309"/><text x="52" y="438">nonpolar core</text>
    <line x1="160" y1="433" x2="190" y2="433" stroke="#db2777" stroke-width="2.5" stroke-dasharray="5 3"/><text x="196" y="438">ion pair</text>
    <line x1="270" y1="433" x2="300" y2="433" stroke="#6d28d9" stroke-width="2" stroke-dasharray="3 3"/><text x="306" y="438">hydrogen bond</text>
    <line x1="410" y1="433" x2="440" y2="433" stroke="#c2410c" stroke-width="4"/><text x="446" y="438">covalent S–S</text>
    <circle cx="560" cy="433" r="7" fill="#bae6fd" stroke="#0284c7"/><text x="572" y="438">water; polar groups line the surface</text>
  </g>
</svg>
